[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinglongwu"
dynamic = ["version"]
description = "Fully local, offline real-time speech translator (system audio -> ASR -> translation -> text)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.5",
  "sentencepiece==0.2.3",
  "opencc-python-reimplemented==0.1.7",
  "soundcard==0.4.6",
  "soundfile==0.14.0",
  "scipy==1.18.1",
  "numpy==2.5.4",
  "av==19.0.2",
  "huggingface_hub==2.4.0",
  "sv-ttk==2.6.1",
  "pymorphy3==2.0.6",  # #390 Russian name declension before MT (MIT; lazy-loaded)
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "psutil==7.2.2", "ruff==0.16.9"]

[project.scripts]
tlwu = "tinglongwu.cli:main"
tlwu-setup = "tinglongwu_setup.cli:main"

[project.gui-scripts]
tlwu-gui = "tinglongwu.gui:main"

[tool.setuptools]
# src/ layer layout (#1664): tinglongwu's modules are split over src/{core,ui,flow,system}/tinglongwu/;
# the core package's __init__ extends __path__ to the other layer dirs (editable install / source checkout).
packages = ["tlwu_app", "tinglongwu", "tinglongwu.capture", "tinglongwu.gui", "tinglongwu.reverse", "tinglongwu.lang", "tinglongwu.lang.ja",
            "tinglongwu_setup", "tlwu_eval"]

[tool.setuptools.package-dir]
tinglongwu = "src/core/tinglongwu"
"tinglongwu.lang" = "src/core/tinglongwu/lang"
"tinglongwu.lang.ja" = "src/core/tinglongwu/lang/ja"
"tinglongwu.gui" = "src/ui/tinglongwu/gui"
"tinglongwu.reverse" = "src/flow/tinglongwu/reverse"
"tinglongwu.capture" = "src/system/tinglongwu/capture"
tlwu_app = "src/ui/tlwu_app"
tinglongwu_setup = "src/system/tinglongwu_setup"
tlwu_eval = "eval/tlwu_eval"

[tool.setuptools.package-data]
tinglongwu_setup = ["manifest.json"]
"tinglongwu.gui" = ["assets/*.ico", "assets/*.png", "assets/*.svg"]
tinglongwu = ["data/*.txt", "data/*.wav", "data/*.gz"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# small first rule set (#665): pyflakes, syntax errors, bugbear, pyupgrade
select = ["F", "E9", "B", "UP"]
# noisy style rules deferred to follow-ups: %-format (UP031), zip strict (B905), loop-var closures (B023); B027/B028 are intentional default hooks and test warnings
ignore = ["UP031", "B905", "B023", "B027", "B028"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/core", "src/ui", "src/flow", "src/system", "eval"]
markers = ["offline: runs under the network guard; CI also runs these in a network-less namespace"]

[tool.setuptools.dynamic]
version = {attr = "tinglongwu.__version__"}
