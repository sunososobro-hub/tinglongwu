<svg xmlns="http://www.w3.org/2000/svg" width="720" height="274" viewBox="0 0 720 274" role="img" aria-label="The only hard rules: offline by default; no telemetry; cloud only opt-in; runs on 4-8 GB GPUs and CPU; English in code and docs; MIT-compatible dependencies; never copy GPL or AGPL code." font-family='system-ui,-apple-system,"Segoe UI","Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif'><title>The only hard rules: offline by default; no telemetry; cloud only opt-in; runs on 4-8 GB GPUs and CPU; English in code and docs; MIT-compatible dependencies; never copy GPL or AGPL code.</title><style>.ink{fill:#11161d}.mut{fill:#5b6470}.card{fill:#f4f6f9;stroke:#d8dee4}.good{fill:#12804a}.bad{fill:#cf2f2f}.blue{fill:#2a78d6}.goodS{stroke:#12804a}.badS{stroke:#cf2f2f}.blueS{stroke:#2a78d6}@media (prefers-color-scheme:dark){.ink{fill:#e6edf3}.mut{fill:#9aa4ae}.card{fill:#161b22;stroke:#30363d}.good{fill:#3fbf7f}.bad{fill:#f06262}.blue{fill:#4c9be8}.goodS{stroke:#3fbf7f}.badS{stroke:#f06262}.blueS{stroke:#4c9be8}}</style><rect class="card" x="1" y="1" width="718" height="272" rx="14"/><text x="20" y="36" font-size="18" font-weight="700" class="ink">The only hard rules</text><g transform="translate(18 53) scale(.8)" class="goodS"><path d="M5 12l4 4 10-10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="70" font-size="15" class="ink">Offline by default: only tlwu-setup may use the network</text><g transform="translate(18 83) scale(.8)" class="goodS"><path d="M5 12l4 4 10-10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="100" font-size="15" class="ink">No telemetry, no analytics, no phone home</text><g transform="translate(18 113) scale(.8)" class="goodS"><path d="M5 12l4 4 10-10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="130" font-size="15" class="ink">Cloud only as opt-in, off by default</text><g transform="translate(18 143) scale(.8)" class="goodS"><path d="M5 12l4 4 10-10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="160" font-size="15" class="ink">Runs on 4-8 GB GPUs, and on CPU alone</text><g transform="translate(18 173) scale(.8)" class="goodS"><path d="M5 12l4 4 10-10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="190" font-size="15" class="ink">English in code, UI strings, comments and docs</text><g transform="translate(18 203) scale(.8)" class="goodS"><path d="M5 12l4 4 10-10" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="46" y="220" font-size="15" class="ink">MIT-compatible dependencies, listed with their license</text><g transform="translate(18 233) scale(.8)" class="badS"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="3" stroke-linecap="round"/></g><text x="46" y="250" font-size="15" class="ink">Never copy GPL / AGPL code (ideas are fine)</text></svg>
