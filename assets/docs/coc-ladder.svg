<svg xmlns="http://www.w3.org/2000/svg" width="720" height="190" viewBox="0 0 720 190" role="img" aria-label="Enforcement ladder: 1 Correction, private written warning. 2 Warning, no contact for a period. 3 Temporary ban. 4 Permanent ban for a pattern of violations." font-family='system-ui,-apple-system,"Segoe UI","Noto Sans CJK TC","Microsoft JhengHei","PingFang TC",sans-serif'><title>Enforcement ladder: 1 Correction, private written warning. 2 Warning, no contact for a period. 3 Temporary ban. 4 Permanent ban for a pattern of violations.</title><style>.ink{fill:#11161d}.mut{fill:#5b6470}.card{fill:#f4f6f9;stroke:#d8dee4}.good{fill:#12804a}.bad{fill:#cf2f2f}.blue{fill:#2a78d6}.goodS{stroke:#12804a}.badS{stroke:#cf2f2f}.blueS{stroke:#2a78d6}@media (prefers-color-scheme:dark){.ink{fill:#e6edf3}.mut{fill:#9aa4ae}.card{fill:#161b22;stroke:#30363d}.good{fill:#3fbf7f}.bad{fill:#f06262}.blue{fill:#4c9be8}.goodS{stroke:#3fbf7f}.badS{stroke:#f06262}.blueS{stroke:#4c9be8}}</style><rect class="card" x="1.0" y="90" width="169.0" height="98" rx="12"/><rect class="bad" x="1.0" y="90" width="169.0" height="8" rx="4" opacity="0.35"/><text x="14.0" y="128" font-size="22" font-weight="800" class="ink">1</text><text x="40.0" y="127" font-size="16" font-weight="700" class="ink">Correction</text><text x="14.0" y="154" font-size="13" class="mut">Private written warning</text><text x="14.0" y="174" font-size="13" class="mut">Maybe a public apology</text><rect class="card" x="184.0" y="68" width="169.0" height="120" rx="12"/><rect class="bad" x="184.0" y="68" width="169.0" height="8" rx="4" opacity="0.55"/><text x="197.0" y="106" font-size="22" font-weight="800" class="ink">2</text><text x="223.0" y="105" font-size="16" font-weight="700" class="ink">Warning</text><text x="197.0" y="132" font-size="13" class="mut">No contact with those</text><text x="197.0" y="152" font-size="13" class="mut">involved for a while</text><rect class="card" x="367.0" y="46" width="169.0" height="142" rx="12"/><rect class="bad" x="367.0" y="46" width="169.0" height="8" rx="4" opacity="0.75"/><text x="380.0" y="84" font-size="22" font-weight="800" class="ink">3</text><text x="406.0" y="83" font-size="16" font-weight="700" class="ink">Temporary ban</text><text x="380.0" y="110" font-size="13" class="mut">No interaction with the</text><text x="380.0" y="130" font-size="13" class="mut">community for a period</text><rect class="card" x="550.0" y="24" width="169.0" height="164" rx="12"/><rect class="bad" x="550.0" y="24" width="169.0" height="8" rx="4" opacity="0.95"/><text x="563.0" y="62" font-size="22" font-weight="800" class="ink">4</text><text x="589.0" y="61" font-size="16" font-weight="700" class="ink">Permanent ban</text><text x="563.0" y="88" font-size="13" class="mut">For a pattern of</text><text x="563.0" y="108" font-size="13" class="mut">violations</text></svg>
