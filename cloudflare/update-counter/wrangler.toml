# #806 update-check counter. Deploy: see README.md.
name = "tlwu-update"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

# No request logs: Workers Logs / tail are off, so not even Cloudflare's own log of this Worker keeps request data.
[observability]
enabled = false

[[kv_namespaces]]
binding = "COUNTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
