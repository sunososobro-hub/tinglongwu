name: Idea or translation / 想法或翻譯
description: A feature, UI wording or translation fix. / 功能、介面用字或翻譯修正
labels: ["type:feat"]
body:
  - type: textarea
    id: did
    attributes:
      label: 做了什麼 / What were you doing?
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: 看到什麼 / What do you see now? (paste text or screenshot)
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: 想要什麼 / What do you want instead?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / 作業系統
  - type: input
    id: version
    attributes:
      label: Version / 版本
