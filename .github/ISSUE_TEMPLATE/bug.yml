name: Bug / 問題回報
description: Something broke or looks wrong. / 有東西壞了或怪怪的
labels: ["type:bug"]
body:
  - type: textarea
    id: did
    attributes:
      label: 做了什麼 / What did you do?
      description: Steps, short. / 簡短步驟
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: 看到什麼 / What did you see?
      description: Paste the screen text, a screenshot or the output. / 貼畫面、截圖或輸出
    validations:
      required: true
  - type: textarea
    id: want
    attributes:
      label: 想要什麼 / What did you expect?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / 作業系統
      placeholder: Windows 11 / macOS 14 / Ubuntu 24.04
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: v0.1.0 (or commit)
