name: Bug / 問題回報
description: Something broke or looks wrong. / 有東西壞了或怪怪的
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: v0.1.0 (or commit)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS / 作業系統
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode / 模式
      options: [listen, speak, meeting]
    validations:
      required: true
  - type: input
    id: langpair
    attributes:
      label: Language pair / 語言組合
      placeholder: ja -> zh-TW
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened / 發生了什麼
      description: Steps, short; paste screen text or a screenshot. / 簡短步驟，貼畫面文字或截圖
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected / 預期結果
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines (optional) / 日誌（選填）
      render: text
