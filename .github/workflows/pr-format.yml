name: pr-format
# #1640: rule-only PR format lint for PRs into dev (scripts/pr_format.py, rules sections 2 / 14), no AI.
# A collaborator PR that misses fix/N, Closes/Refs #N or the tlwu-usage line is closed with a one-line reason;
# an outside (fork) PR is never closed on format: it gets one friendly comment + `needs-format`, and is closed only
# after 7 days with no update (daily `--stale` run). pull_request_target checks out the base branch only and the
# script reads the PR through the API, so PR code never runs here.
on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, edited, synchronize, ready_for_review]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "check only this PR number (empty = stale sweep)"
        required: false
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: pr-format-${{ inputs.pr || github.event.pull_request.number || 'stale' }}
  cancel-in-progress: false
jobs:
  lint:
    if: github.repository == 'sunososobro-hub/tinglongwu'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          persist-credentials: false
          sparse-checkout: |
            scripts/pr_format.py
            scripts/merge_gate.py
          sparse-checkout-cone-mode: false
      - name: lint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY_PR: ${{ inputs.pr || github.event.pull_request.number || '' }}
        run: |
          if [ -n "$ONLY_PR" ]; then
            python -I scripts/pr_format.py --pr "$ONLY_PR" --apply
          else
            python -I scripts/pr_format.py --stale --apply
          fi
