name: eval-langs
# #642 (#619 part 2): per-language cloud eval. One job per pair listed in eval/languages.json (the matrix is built from
# that file by `python -m tlwu_eval.langmatrix matrix`); each job runs the CPU mini-eval on that pair's pinned FLEURS
# clips (Whisper small + Hy-MT2 1.8B Q4 on llama.cpp CPU, like eval.yml) and gates it against its
# eval/baseline.json "matrix" entry: chrF - margin and MT median budget (eval/tlwu_eval/gate.py). A pair whose pin file is
# missing is listed as unpinned in the summary and not run. Add a language = one line in eval/languages.json.
# Runs on PRs that touch the matrix config / gate / pins and on manual dispatch.
# #643 (#619 part 4): weekly schedule on dev. `weekly` gates every pair report (eval/tlwu_eval/weekly.py), `publish` writes
# langs/YYYY-MM-DD.json to the eval-results branch (the stats page renders the latest two), `alert` comments on #61
# when any pair FAILs. A dispatch with publish=true does the same (manual check of the weekly path).
#   weekly  : contents read  - verdict JSON + alert text
#   publish : contents write - the only job that pushes, to eval-results only
#   alert   : issues write   - the only job that touches issues
# #1747: a dispatch with asr=gigaam-v3 runs only ru->zh with GigaAM v3 (sherpa-onnx, CPU) instead of Whisper, to measure
# its ru WER on the same 20 pinned clips. The archive is checked against the sha256 pinned in eval/tlwu_eval/gigaam.py.
# Its line is reported, not gated (eval/baseline.json is Whisper's), and it never publishes.
on:
  pull_request:
    branches: [dev]
    paths: ['eval/languages.json', 'eval/baseline.json', 'eval/*pins*.json', 'eval/ci_smoke.json', 'eval/tlwu_eval/**',
            'scripts/bench/make_ci_smoke.py', '.github/workflows/eval-langs.yml']
  schedule:
    - cron: "17 20 * * 0"   # Monday 04:17 Asia/Taipei, after eval-nightly
  workflow_dispatch:
    inputs:
      publish:
        description: "#643: also write the weekly verdict to eval-results and alert #61 on FAIL (like the schedule)"
        type: boolean
        default: false
      pin_set:
        description: "dev: pin a clip set instead of running the eval (make_ci_smoke.py --set <set> --pin 20); the pin file is printed and uploaded for commit"
        type: choice
        options: [none, matrix, hi]
        default: none
      asr:
        description: "#1747: ASR engine to score. gigaam-v3 = GigaAM v3 on sherpa-onnx (CPU), runs ru->zh only, report-only"
        type: choice
        options: [whisper, gigaam-v3]
        default: whisper

permissions:
  contents: read

concurrency:
  group: eval-langs-${{ github.ref }}-${{ inputs.pin_set || 'none' }}  # a pin dispatch never cancels an eval run
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  TLWU_HYMT_TEMP: "0"  # greedy decoding: repeatable chrF run to run (same as eval.yml)
  PYTHONUTF8: "1"
  WHISPER: small
  PYTHONPATH: eval  # #1664: tlwu_eval lives in eval/; matrix + weekly jobs run it without pip install
  ASR: ${{ inputs.asr || 'whisper' }}  # #1747
  SHERPA_ONNX: "2.0.1"  # #1747: the version the mobile app ran GigaAM v3 on before #563 (mobile/pubspec.yaml)

jobs:
  # #642: the cloud sandboxes cannot reach huggingface.co, so pin files are made here and committed from the log/artifact.
  pin:
    if: github.event_name == 'workflow_dispatch' && inputs.pin_set != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pin ${{ inputs.pin_set }} (20 clips per language, FLEURS revision of eval/ci_smoke.json)
        env:
          PIN_SET: ${{ inputs.pin_set }}
        run: |
          REV=$(python -c "import json; print(json.load(open('eval/ci_smoke.json'))['revision'])")
          python scripts/bench/make_ci_smoke.py --set "$PIN_SET" --pin 20 --revision "$REV" --pins "pins_$PIN_SET.json"
          cat "pins_$PIN_SET.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pins-${{ inputs.pin_set }}
          path: pins_*.json

  matrix:
    if: github.event_name != 'workflow_dispatch' || inputs.pin_set == 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.m.outputs.jobs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}  # #643: schedules start on main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Pairs from eval/languages.json
        id: m
        run: |
          ONLY=""
          if [ "$ASR" = "gigaam-v3" ]; then ONLY="ru->zh"; fi  # #1747: GigaAM v3 is Russian-only
          python -m tlwu_eval.langmatrix matrix --only "$ONLY" > m.json
          cat m.json
          echo "jobs=$(cat m.json)" >> "$GITHUB_OUTPUT"
          python -c "import json; d=json.load(open('m.json')); print('## eval-langs (#642)\n\npairs: ' + ', '.join(j['pair'] for j in d['include']) + '\n\nunpinned (not run): ' + (', '.join(d['unpinned']) or 'none') + '\n\nblocked (not run): ' + (', '.join(d.get('blocked', [])) or 'none'))" >> "$GITHUB_STEP_SUMMARY"

  pair:
    needs: matrix
    name: ${{ matrix.pair }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false  # one red pair never cancels the others
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.jobs).include }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu + Hy-MT2 CPU engine
        run: |
          pip install -e .
          pip install -r requirements/requirements-llama-cpu.txt --only-binary=:all:
      - name: Paths
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/tlwu-models
          key: eval-langs-models-v1-${{ env.WHISPER }}-${{ hashFiles('src/system/tinglongwu_setup/manifest.json', 'src/system/tinglongwu_setup/downloader.py') }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ matrix.data }}
          key: eval-langs-data-v1-${{ hashFiles(matrix.pins, 'scripts/bench/make_ci_smoke.py') }}
      - name: Models (Hy-MT2 1.8B Q4 + Whisper ${{ env.WHISPER }})
        run: tlwu-setup --hymt --whisper "$WHISPER" --models-dir "$TLWU_MODELS"
      - name: "#1747 GigaAM v3 (sherpa-onnx ${{ env.SHERPA_ONNX }}, archive checked by sha256)"
        if: env.ASR == 'gigaam-v3'
        run: |
          pip install "sherpa-onnx==$SHERPA_ONNX" --only-binary=:all:
          read -r URL SHA NAME < <(python -c "from tlwu_eval import gigaam as g; print(g.ARCHIVE_URL, g.ARCHIVE_SHA256, g.ARCHIVE_NAME)")
          mkdir -p "$RUNNER_TEMP/gigaam"
          if [ ! -d "$RUNNER_TEMP/gigaam/$NAME" ]; then
            curl -fsSL --retry 3 -o giga.tar.bz2 "$URL"
            echo "$SHA  giga.tar.bz2" | sha256sum -c -
            tar xjf giga.tar.bz2 -C "$RUNNER_TEMP/gigaam"
            rm giga.tar.bz2
          fi
          echo "ASR_ARGS=--asr gigaam-v3 --gigaam-dir $RUNNER_TEMP/gigaam/$NAME" >> "$GITHUB_ENV"
      - name: Clips (FLEURS, pinned by sha256 in ${{ matrix.pins }})
        run: |
          if [ -f "${{ matrix.data }}/manifest.jsonl" ]; then echo "cached"; else
            python scripts/bench/make_ci_smoke.py --pins "${{ matrix.pins }}" --out "${{ matrix.data }}"; fi
      - name: "#968 speak noise gate: keyboard / mouse / fan noise send 0 lines, >= 9 of 10 zh clips are sent"
        if: matrix.pair == 'zh->en'
        run: |
          set +e
          python -m tlwu_eval.speak_noise --data "${{ matrix.data }}" --lang zh --speech 10 --min-speech 9 \
            --model "$WHISPER" --device cpu --models-dir "$TLWU_MODELS" --out speak_noise.json > speak_noise.txt
          rc=$?
          cat speak_noise.txt
          { echo "## speak noise gate (#968)"; echo; echo '```'; cat speak_noise.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Mini-eval ${{ matrix.pair }} (CPU, ${{ matrix.clips }} clips)
        run: |
          set +e
          python -m tlwu_eval --smoke --data "${{ matrix.data }}" --pairs "${{ matrix.pair }}" --clips "${{ matrix.clips }}" \
            --model "$WHISPER" --engine hymt2-cpu --device cpu --no-noise --models-dir "$TLWU_MODELS" $ASR_ARGS --out r.json
          rc=$?
          # 0 = PASS, 1 = the smoke's own whole-run budget missed (slow shared runner): the gate below decides. 2 = setup error.
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          test -s r.json
      - name: Gate vs eval/baseline.json matrix
        run: |
          set +e
          python -m tlwu_eval.langmatrix baseline "${{ matrix.pair }}" --out pair_baseline.json || exit 2
          python -m tlwu_eval.langmatrix summary r.json "${{ matrix.pair }}" > line.txt
          rc_line=$?
          python -m tlwu_eval --gate r.json --baseline pair_baseline.json > gate.md
          rc=$?
          cat line.txt gate.md
          { echo "## ${{ matrix.pair }} (ASR: $ASR)"; echo; cat line.txt; echo; cat gate.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ASR" != "whisper" ]; then exit 0; fi  # #1747: the baseline is Whisper's; a GigaAM run is report-only
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          exit "$rc_line"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: eval-langs-${{ matrix.src }}-${{ matrix.tgt }}
          path: |
            r.json
            gate.md
            line.txt
            speak_noise.json
            speak_noise.txt
          if-no-files-found: warn

  weekly:
    needs: [matrix, pair]
    if: always() && needs.matrix.result == 'success' && (github.event_name == 'schedule' || (inputs.publish && inputs.asr != 'gigaam-v3'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      fail: ${{ steps.alert.outputs.fail }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: eval-langs-*
          path: arts
      - name: Weekly verdict per language (#643)
        id: alert
        run: |
          mkdir -p arts
          python -m tlwu_eval.weekly collect arts --out langs.json --date "$(date -u +%F)" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python -m tlwu_eval.weekly alert langs.json --out alert.md
          { echo "## weekly verdict (#643)"; echo; echo '```'; cat langs.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-langs-weekly
          path: |
            langs.json
            alert.md
          if-no-files-found: warn

  publish:
    needs: weekly
    if: always() && needs.weekly.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # push to eval-results only
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eval-langs-weekly
      - name: Commit to eval-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          D=$(date -u +%F)
          git init -q repo && cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch --depth=1 origin eval-results 2>/dev/null; then git checkout -q -B eval-results FETCH_HEAD; else git checkout -q --orphan eval-results; fi
          mkdir -p langs
          cp ../langs.json "langs/$D.json"
          git add langs
          git commit -q -m "eval: weekly languages $D"
          git push origin HEAD:refs/heads/eval-results

  alert:
    needs: weekly
    if: always() && needs.weekly.outputs.fail == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eval-langs-weekly
      - name: Comment on #61
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh issue comment 61 --body-file alert.md
