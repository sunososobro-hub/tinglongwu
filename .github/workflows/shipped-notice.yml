name: shipped-notice
# Comments "Shipped in vX.Y.Z" on closed issues when a release containing their fix is published (no AI, #1504).
on:
  release:
    types: [published]
  schedule:
    # Daily catch-up: events created by GITHUB_TOKEN (release.yml publish) start no `release` run (#1504).
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      issues:
        description: "Issue numbers to backfill (comma list; empty = issues in the tag's range)"
        required: false
      tag:
        description: "Release tag to check against (default: latest release)"
        required: false

permissions:
  issues: write
  contents: read

concurrency:
  group: shipped-notice
  cancel-in-progress: false

jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Post notices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_ISSUES: ${{ inputs.issues }}
        run: |
          tag="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$tag" ]; then
            tag=$(python -I - <<'PY'
          import json, os, urllib.request
          r = urllib.request.Request("https://api.github.com/repos/" + os.environ["GH_REPO"] + "/releases/latest",
                                     headers={"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"]})
          print(json.load(urllib.request.urlopen(r))["tag_name"])
          PY
            )
          fi
          python -I scripts/shipped_notice.py --tag "$tag" --issues "$INPUT_ISSUES"
