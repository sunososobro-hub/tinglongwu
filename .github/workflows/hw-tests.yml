name: hw-tests

# Hardware-only checks on the owner's Windows PC (real audio devices, VB-CABLE, NVIDIA GPU) through a self-hosted runner
# labelled [self-hosted, windows, tlwu-hw]. Covers the hardware part of #6 #139 #279 #207 #311 #90 #186 #313 (see the
# step names). The Mac part of #8 stays with the owner.
# #1194: #894 (live mic accuracy), #4 (meeting ◀ Them labels) and #348 (another program's audio through loopback) run
# with pinned FLEURS speech (scripts/hw_live_checks.py); #4 and #348 play that speech on the real speakers (about
# 1.5 min). Same continue-on-error rule as #1157 below.
# #1157: the owner hand-tests of #966 #967 #968 run here too (scripts/hw_owner_checks.py). Those steps are
# continue-on-error until each one is green on a dev run (a started hw-tests run is never deferred, so an unproven
# step must not block a release snapshot); drop continue-on-error per step once its issue links a green run.
#
# SECURITY: a self-hosted runner runs whatever the workflow says, so this file never runs for pull requests (no
# pull_request / pull_request_target trigger) and only for a manual
# dispatch (people with write access) (#976: release-pr.yml dispatches it on this repo's release/vX.Y.Z snapshot branch). Do not add other triggers.
on:
  # #1266: no push trigger. Dev pushes queued behind each other on the single runner and delayed release snapshots;
  # hw-tests runs on release snapshots (release-pr.yml dispatch), nightly (hw-nightly.yml) and by hand.
  workflow_dispatch:
    inputs:
      hymt7b:
        description: "#279: also download Hy-MT2 7B (about 4.8 GB) and self-test it on the GPU"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # #976: one group per ref. A release/vX.Y.Z snapshot run (dispatched by release-pr.yml) is never replaced by a
  # pending dev-push run; the single tlwu-hw runner still takes one job at a time.
  group: hw-tests-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HW_CACHE: C:/actions-runner-tlwu/hw-cache

jobs:
  hw:
    if: github.repository == 'sunososobro-hub/tinglongwu' && github.event_name != 'pull_request'
    runs-on: [self-hosted, windows, tlwu-hw]
    timeout-minutes: 120  # #1194: + about 15 min of live checks (worst case 65)
    defaults:
      run:
        # Git Bash by 8.3 path (the runner splits the shell value at the first space, so no spaces allowed): plain `bash` on this PC resolves to WindowsApps/bash.exe (WSL), which cannot run the
        # runner's C:/ temp scripts, so every step failed (first run after #459).
        shell: 'C:/PROGRA~1/Git/bin/bash.exe --noprofile --norc -e -o pipefail {0}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Commit under test (shown in the run summary; nightly runs come from hw-nightly.yml, #681)
        run: |
          sha=$(git rev-parse HEAD)
          echo "tested commit: $sha ($GITHUB_EVENT_NAME)"
          echo "### hw-tests on commit \`$sha\` ($GITHUB_EVENT_NAME)" >> "$GITHUB_STEP_SUMMARY"

      # The owner's default speakers are restored by the last step even if a test fails or is cancelled.
      # Audio steps use Windows PowerShell directly so the restore never depends on bash working.
      - name: Remember the default audio output device
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/hw_audio_default.ps1 -Action Get
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $id, $name = "$out" -split '\|', 2
          Write-Output "default output: $name"
          [IO.File]::AppendAllText($env:GITHUB_ENV, "TLWU_HW_DEFAULT_ID=$id`n", (New-Object Text.UTF8Encoding($false)))

      - name: Hardware present (VB-CABLE, NVIDIA GPU)
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          powershell -NoProfile -Command "if (-not (Get-CimInstance Win32_SoundDevice | Where-Object Name -like '*VB-Audio*')) { Write-Error 'VB-CABLE is not installed'; exit 1 }"

      - name: Python venv (kept between runs) + tlwu with GPU extras
        run: |
          mkdir -p "$HW_CACHE"
          if [ ! -x "$HW_CACHE/venv/Scripts/python.exe" ]; then py -3.12 -m venv "$HW_CACHE/venv"; fi
          echo "$(cygpath -w "$HW_CACHE/venv/Scripts")" >> "$GITHUB_PATH"
          "$HW_CACHE/venv/Scripts/python.exe" -m pip install -q -e ".[dev]"
          "$HW_CACHE/venv/Scripts/python.exe" -m pip install -q -r requirements-gpu.txt
          "$HW_CACHE/venv/Scripts/python.exe" -m pip install -q -r requirements-llama-cuda.txt --only-binary=:all: || echo "::warning::llama-cpp CUDA wheel not installed; --device cuda MT falls back"
          echo "TLWU_MODELS=$HW_CACHE/models" >> "$GITHUB_ENV"

      - name: Models (smoke set) + Kokoro voice venv + Russian voice
        run: |
          tlwu-setup --whisper small --hymt --pair zh-en --pair en-zh --pair en-ru --pair ru-en --allow-unpinned --models-dir "$TLWU_MODELS"
          tlwu-setup --talk --talk-venv "$HW_CACHE/tts-kokoro" --talk-launcher "$RUNNER_TEMP/tlwu-talk.ps1" --models-dir "$TLWU_MODELS"
          tlwu-setup --vosk-tts-ru --models-dir "$TLWU_MODELS"
          echo "TLWU_KOKORO_PYTHON=$HW_CACHE/tts-kokoro/Scripts/python.exe" >> "$GITHUB_ENV"
          echo "TLWU_KOKORO_MODEL=$TLWU_MODELS/kokoro" >> "$GITHUB_ENV"
          TLWU_KOKORO_PYTHON="$HW_CACHE/tts-kokoro/Scripts/python.exe" TLWU_KOKORO_MODEL="$TLWU_MODELS/kokoro" \
            python scripts/ci_e2e.py zh-wav "$RUNNER_TEMP/zh.wav" --repeat 2

      - name: "#90 #139 tlwu --selftest on the real GPU (normal GPU machine must finish in < 60 s)"
        run: |
          start=$SECONDS
          python -m tinglongwu --selftest --device cuda
          took=$((SECONDS - start)); echo "selftest --device cuda took ${took} s"
          { echo "### #90 selftest cuda: ${took} s (limit 60)"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$took" -lt 60 ]

      - name: "#139 Hy-MT2 auto picks CUDA on an NVIDIA GPU"
        if: ${{ !cancelled() }}
        run: |
          python -c "from tinglongwu.device import resolve_device as r; d = r('auto', warn=print); print('device=' + d); assert d == 'cuda', d"
          python -m tinglongwu --file tinglongwu/data/selftest_en.wav --to zh --device auto --models-dir "$TLWU_MODELS"

      - name: "#6 #805 #207 #311-4 speak_selftest through VB-CABLE (en), records CABLE Output"
        if: ${{ !cancelled() }}
        run: |
          python scripts/speak_selftest.py --clip "$RUNNER_TEMP/zh.wav" --to en --models-dir "$TLWU_MODELS" \
            --tts-python "$TLWU_KOKORO_PYTHON" --tts-model "$TLWU_KOKORO_MODEL" --json "$RUNNER_TEMP/speak_en.json"
          { echo '### speak_selftest en (owner PC, VB-CABLE) - #6 #207 #186'; echo '```'; cat "$RUNNER_TEMP/speak_en.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "#968 keyboard noise through the speak pipeline sends 0 sentences (zh clip above sends >= 1)"
        if: ${{ !cancelled() }}
        continue-on-error: true  # #1157: until green on a dev run
        run: |
          python scripts/hw_owner_checks.py noise-clip "$RUNNER_TEMP/keyboard.wav"
          python scripts/speak_selftest.py --clip "$RUNNER_TEMP/keyboard.wav" --to en --models-dir "$TLWU_MODELS" \
            --tts-python "$TLWU_KOKORO_PYTHON" --tts-model "$TLWU_KOKORO_MODEL" --json "$RUNNER_TEMP/speak_noise.json" || true
          rc=0
          python scripts/hw_owner_checks.py noise --noise-json "$RUNNER_TEMP/speak_noise.json" \
            --speech-json "$RUNNER_TEMP/speak_en.json" > "$RUNNER_TEMP/check_968.txt" || rc=$?
          cat "$RUNNER_TEMP/check_968.txt"
          { echo "### $(cat "$RUNNER_TEMP/check_968.txt")"; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: "#311 item 4 speak_selftest --to ru: Russian voice reaches CABLE Input"
        if: ${{ !cancelled() }}
        run: |
          python scripts/speak_selftest.py --clip "$RUNNER_TEMP/zh.wav" --to ru --models-dir "$TLWU_MODELS" \
            --tts-python "$TLWU_KOKORO_PYTHON" --tts-model "$TLWU_KOKORO_MODEL" --json "$RUNNER_TEMP/speak_ru.json"
          { echo '### speak_selftest ru (owner PC, VB-CABLE) - #311'; echo '```'; cat "$RUNNER_TEMP/speak_ru.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "#1194 live-test clips: pinned FLEURS speech (sha256 checked), joined into the #894 / #4 / #348 clips"
        if: ${{ !cancelled() }}
        continue-on-error: true  # #1194: until green on a dev run
        run: |
          D="$HW_CACHE/live-fleurs-$(sha256sum eval/matrix_pins.json | cut -c1-16)"  # #1203: a changed pin file means a new folder
          [ -f "$D/manifest.jsonl" ] || python scripts/bench/make_ci_smoke.py --pins eval/matrix_pins.json --out "$D"
          python scripts/hw_live_checks.py clips --data "$D" --out "$RUNNER_TEMP/live"

      - name: "#894 5-min multi-speaker clip into CABLE Input, tlwu --mic on CABLE Output: WER <= 1.25x file (gap: report only)"
        if: ${{ !cancelled() }}
        continue-on-error: true  # #1194: until green on a dev run
        timeout-minutes: 30
        run: |
          rc=0
          # #1247: the subtitle gap is report only; median / max of the last 10 runs from the runner cache
          python scripts/hw_live_checks.py mic --clips "$RUNNER_TEMP/live" --models-dir "$TLWU_MODELS" \
            --gap-history "$HW_CACHE/gap_894_history.jsonl" > "$RUNNER_TEMP/check_894.txt" || rc=$?
          cat "$RUNNER_TEMP/check_894.txt"
          { echo "### $(grep -E '^(PASS|FAIL)' "$RUNNER_TEMP/check_894.txt")";
            { grep -E '^report: ' "$RUNNER_TEMP/check_894.txt" || true; } | sed 's/^report: /- /'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: "#4 meeting mode: mic = clip A (CABLE), system audio = clip B (speakers): >= 90% lines labelled right"
        if: ${{ !cancelled() }}
        continue-on-error: true  # #1194: until green on a dev run
        timeout-minutes: 20
        run: |
          rc=0
          python scripts/hw_live_checks.py meeting --clips "$RUNNER_TEMP/live" --models-dir "$TLWU_MODELS" > "$RUNNER_TEMP/check_4.txt" || rc=$?
          cat "$RUNNER_TEMP/check_4.txt"
          { echo "### $(grep -E '^(PASS|FAIL)' "$RUNNER_TEMP/check_4.txt")"; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: "#348 audio played by a separate process is captured by WASAPI loopback and transcribed"
        if: ${{ !cancelled() }}
        continue-on-error: true  # #1194: until green on a dev run
        timeout-minutes: 15
        run: |
          rc=0
          python scripts/hw_live_checks.py loopback --clips "$RUNNER_TEMP/live" --models-dir "$TLWU_MODELS" > "$RUNNER_TEMP/check_348.txt" || rc=$?
          cat "$RUNNER_TEMP/check_348.txt"
          { echo "### $(grep -E '^(PASS|FAIL)' "$RUNNER_TEMP/check_348.txt")"; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # #1247: the saved lines, log and mic_report.json (missed clips, where the longest gap is) of the live mic
      # check, so a FAIL can be read without the owner PC. Text only (no wavs, no models): a few hundred KB.
      # Mic-check files only, listed by name: meeting.* / loopback.* hold transcripts of real speaker / WASAPI
      # loopback capture on the owner PC and must not reach public-repo artifacts (Opus review on #1248).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: hw-live-checks
          path: |
            ${{ runner.temp }}/live/mic_file.jsonl
            ${{ runner.temp }}/live/mic_live.jsonl
            ${{ runner.temp }}/live/mic_live.log
            ${{ runner.temp }}/live/mic_report.json
            ${{ runner.temp }}/check_*.txt
          retention-days: 7
          if-no-files-found: ignore

      # #1408: WER of the owner's private recordings (folder from the runner env var TLWU_PRIVATE_EVAL_DIR, outside
      # the repo; NAME.wav + NAME.ref.txt). Prints numbers only (file index, duration, WER, change vs the previous
      # run); no file names or text reach the log, summary or artifacts. Informational: never fails the run.
      - name: "#1408 private recordings: WER per file vs the previous run (numbers only; SKIP when not set up)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 30
        run: python scripts/private_eval.py run --models-dir "$TLWU_MODELS"

      - name: "#313 tlwu doctor on the owner PC (real GPU, real audio devices)"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py doctor --to en --models-dir "$TLWU_MODELS" --expect-ok "speech model" "translation model" "voice (en)"

      - name: "#90 #8 tlwu --selftest on the CPU path (same check as the hosted runners)"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py selftest --models-dir "$TLWU_MODELS"

      # #966 #967: what a user's fresh install gets, not the kept venv: a new venv + `tlwu-setup --gpu` + the speak
      # setup into a temp dir. Multi-GB download, so only on dispatched dev runs (hw-nightly.yml, manual), never on
      # every push or on a release snapshot. RUNNER_TEMP is emptied by the runner before each job.
      - name: "#966 #967 fresh setup into a temp dir: auto -> cuda, no driver advice; Kokoro voice reaches CABLE Input"
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' }}
        continue-on-error: true  # #1157: until green on a dev run
        timeout-minutes: 45
        run: |
          D="$RUNNER_TEMP/fresh-setup"
          rm -rf "$D"; mkdir -p "$D"
          py -3.12 -m venv "$D/venv"
          FP="$D/venv/Scripts/python.exe"
          "$FP" -m pip install -q -e .
          "$FP" -m tinglongwu_setup --gpu
          # Hy-MT2 runtime: not in pyproject, so a fresh venv lacks it like a user's (same command as the kept venv)
          "$FP" -m pip install -q -r requirements-llama-cuda.txt --only-binary=:all: || echo "::warning::llama-cpp CUDA wheel not installed in the fresh venv"
          "$FP" -m tinglongwu_setup --whisper small --hymt --allow-unpinned --models-dir "$D/models"
          "$FP" -m tinglongwu_setup --talk --talk-venv "$D/tts-kokoro" --talk-launcher "$D/tlwu-talk.ps1" --models-dir "$D/models"
          "$FP" -m tinglongwu doctor --to en --models-dir "$D/models" > "$D/doctor.txt" 2>&1 || true
          cat "$D/doctor.txt"
          rc=0
          "$FP" scripts/hw_owner_checks.py gpu --doctor-log "$D/doctor.txt" > "$D/check.txt" || rc=1
          "$FP" scripts/hw_owner_checks.py kokoro --models-dir "$D/models" --tts-python "$D/tts-kokoro/Scripts/python.exe" >> "$D/check.txt" || rc=1
          if "$FP" scripts/speak_selftest.py --clip "$RUNNER_TEMP/zh.wav" --to en --models-dir "$D/models" \
              --tts-python "$D/tts-kokoro/Scripts/python.exe" --tts-model "$D/models/kokoro" --json "$D/speak_en.json"; then
            echo "PASS #967 speak_selftest en after fresh setup reaches CABLE Input" >> "$D/check.txt"
          else
            echo "FAIL #967 speak_selftest en after fresh setup (see the log above)" >> "$D/check.txt"; rc=1
          fi
          cat "$D/check.txt"
          { echo '### fresh setup (#966 #967)'; echo '```'; cat "$D/check.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: "#279 Hy-MT2 7B on the GPU (manual dispatch with hymt7b=true only)"
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.hymt7b }}
        run: |
          tlwu-setup --hymt7b --models-dir "$TLWU_MODELS"
          python -m tinglongwu --selftest --device cuda --engine hymt7b

      - name: Restore the default audio output device to the real speakers
        if: ${{ always() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/hw_audio_default.ps1 -Action RestoreSpeakers -Id "$env:TLWU_HW_DEFAULT_ID"
          $rc = $LASTEXITCODE
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/hw_audio_default.ps1 -Action Get
          exit $rc
