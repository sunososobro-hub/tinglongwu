name: eval-diarization
# #1256: speaker labels on an annotated multi-speaker conversation. scripts/bench/diarization_clip.py streams the
# first 8 readers of LibriSpeech test-clean (CC-BY 4.0, openslr.org/12), cuts their speech into 1-8 s pieces (a third
# of them 1-2 s, the short replies after a pause that got a new label in the owner's field test) and lays them out as
# meeting turns; scripts/eval_diarization.py feeds them in order through the SpeakerLabeler that `tlwu --speakers`
# uses (shipped CAM++ model) and fails when the labels a user sees are more than 1.5x the real speakers.
# Runs on GitHub-hosted CPU runners because the cloud agent sandbox cannot reach openslr or the model host.
# Only runs when this workflow, the clustering / embedding code or the eval scripts change, or by hand.
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/eval-diarization.yml
      - scripts/eval_diarization.py
      - scripts/bench/diarization_clip.py
      - src/core/tinglongwu/speakers.py
      - src/core/tinglongwu/speaker_embed.py
      - requirements/requirements-speaker.txt
      - src/system/tinglongwu_setup/manifest.json
      - src/system/tinglongwu_setup/downloader.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-diarization-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  PYTHONUTF8: "1"

jobs:
  labels:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu + speaker labels
        run: |
          pip install -e .
          pip install --require-hashes -r requirements/requirements-speaker.txt --only-binary=:all:
      - name: Paths
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/tlwu-models/speaker
            clip
          key: eval-diarization-v1-${{ hashFiles('src/system/tinglongwu_setup/manifest.json', 'src/system/tinglongwu_setup/downloader.py', 'scripts/bench/diarization_clip.py') }}
      - name: Speaker model (CAM++)
        run: tlwu-setup --speaker-model --models-dir "$TLWU_MODELS"
      - name: Annotated conversation (8 LibriSpeech speakers)
        run: |
          if [ ! -f clip/labels.csv ]; then
            python scripts/bench/diarization_clip.py --out clip --speakers 8; fi
      - name: Labels <= 1.5x speakers
        run: |
          set -o pipefail
          python scripts/eval_diarization.py clip clip/labels.csv --model-dir "$TLWU_MODELS" \
            --png diarization_eval.png --max-label-ratio 1.5 --min-speakers 8 \
            --dump-embeddings embeddings.npz --sweep | tee report.txt
      - name: Summary
        if: always()
        run: |
          { echo "## Speaker labels (#1256)"; echo; echo '```'
            if [ -f report.txt ]; then cat report.txt; else echo "no report"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diarization-eval
          path: |
            report.txt
            clip/labels.csv
            diarization_eval.png
            embeddings.npz
          if-no-files-found: warn
