name: eval-speak-ready
# #1741: speak-mode readiness on a GitHub-hosted CPU runner (no GPU), numbers only, never fails on a number.
# 10 paced runs of the same 20-sentence zh script through the speak pipeline (#434 latency records: speech end ->
# TTS first audio p50 / p95), 60 s silence + 60 s keyboard noise (lines sent, held/greyed) and zh -> en chrF.
# eval/tlwu_eval/speak_ready.py has the rules. The cloud agent sandbox cannot reach the model hosts, so it runs here.
# The report goes to the step summary and, for this repo's own branches, as one comment on issue #1741.
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/eval-speak-ready.yml
      - eval/tlwu_eval/speak_ready.py
  workflow_dispatch:
    inputs:
      runs:
        description: paced runs of the script
        default: "10"

permissions:
  contents: read
  issues: write

concurrency:
  group: eval-speak-ready-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  speak-ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tlwu + Hy-MT2 CPU engine
        run: |
          pip install -e .
          pip install -r requirements/requirements-llama-cpu.txt --only-binary=:all:
          echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/tlwu-models
          key: speak-ready-models-v1-linux-${{ hashFiles('src/system/tinglongwu_setup/manifest.json', 'src/system/tinglongwu_setup/downloader.py') }}
      - name: Models (Whisper small, Hy-MT2 zh-en) + Kokoro voice venv
        run: |
          tlwu-setup --whisper small --hymt --pair zh-en --allow-unpinned --models-dir "$TLWU_MODELS"
          tlwu-setup --talk --talk-venv "$HOME/tts-kokoro" --talk-launcher "$RUNNER_TEMP/tlwu-talk.ps1" --models-dir "$TLWU_MODELS"
      - name: Speak readiness report (CPU)
        run: |
          python -m tlwu_eval.speak_ready --runs "${{ inputs.runs || '10' }}" --models-dir "$TLWU_MODELS" \
            --kokoro-python "$HOME/tts-kokoro/bin/python" --kokoro-model "$TLWU_MODELS/kokoro" \
            --where "ubuntu-24.04 $(nproc) vCPU, ${GITHUB_SHA::7}, $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --json "$RUNNER_TEMP/speak_ready.json" --md "$RUNNER_TEMP/speak_ready.md"
      - name: Report to the step summary
        if: always()
        run: if [ -s "$RUNNER_TEMP/speak_ready.md" ]; then cat "$RUNNER_TEMP/speak_ready.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Post the report on #1741
        if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s "$RUNNER_TEMP/speak_ready.md" ] || exit 0
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/1741/comments" -F body=@"$RUNNER_TEMP/speak_ready.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: speak-ready
          path: ${{ runner.temp }}/speak_ready.*
          if-no-files-found: ignore
