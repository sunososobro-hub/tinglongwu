name: bench-cpu-ab
# #781 (#745 part 2): CPU-mode A/B on a GitHub-hosted CPU runner (no GPU). Runs scripts/bench/cpu_mode_ab.py on the
# #569 smoke set twice with --device cpu: A = tlwu_eval defaults (Whisper small, beam 5), B = --cpu-mode (the #780
# policy for this runner). The Markdown table + runner CPU / RAM go to the job summary and the `cpu-ab` artifact;
# docs/benchmarks.md is updated by hand from it. Read-only: never pushes, never touches issues.
on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/bench/cpu_mode_ab.py
      - scripts/bench/mt_cpu_threads.py
      - scripts/bench/meeting_replay.py
      - .github/workflows/bench-cpu-ab.yml
      - scripts/bench/mt_candidates.py
      - eval/matrix_pins.json
      - scripts/hw_live_checks.py
  workflow_dispatch:
    inputs:
      candidates:
        description: "#1319 mt-candidates job: comma list of scripts/bench/mt_candidates.py CANDIDATES (empty = all)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: bench-cpu-ab-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  TLWU_HYMT_TEMP: "0"
  PYTHONUTF8: "1"
  WHISPER: small

jobs:
  ab:
    if: github.repository == 'sunososobro-hub/tinglongwu'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu + Hy-MT2 CPU engine
        run: |
          pip install -e .
          pip install -r requirements-llama-cpu.txt --only-binary=:all:
      - name: Paths
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/tlwu-models
            eval_data/smoke
          key: eval-gate-v1-${{ env.WHISPER }}-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py', 'eval/ci_smoke.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: Models
        run: tlwu-setup --hymt --whisper "$WHISPER" --models-dir "$TLWU_MODELS"
      - name: Smoke clips
        run: |
          if [ -f eval_data/smoke/manifest.jsonl ]; then echo "cached"; else python scripts/bench/make_ci_smoke.py --out eval_data/smoke; fi
      - name: MT threads under live Whisper load (#1198)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ab
          pip install psutil==7.2.2
          python scripts/bench/mt_cpu_threads.py --data eval_data/smoke --models-dir "$TLWU_MODELS" \
            --plans old,cpu-mode,physical,mt-heavy | tee ab/mt_threads.md
          python scripts/bench/mt_cpu_threads.py --data eval_data/smoke --models-dir "$TLWU_MODELS" --plans old,cpu-mode --no-asr | tee ab/mt_threads_alone.md
      - name: MT threads under live-paced Whisper (#1198)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ab
          # each clip transcribed once its audio has arrived, like the app's final pass per segment
          python scripts/bench/mt_cpu_threads.py --data eval_data/smoke --models-dir "$TLWU_MODELS" \
            --plans cpu-mode,physical,mt-heavy --asr-load live | tee ab/mt_threads_live.md
      - name: Lower-bit Hy-MT2 GGUFs under live Whisper load (#1198 next cut)
        continue-on-error: true
        env:
          QUANTS: Q4_K_M,Q4_0,Q4_K_S,IQ4_XS,Q3_K_M,Q3_K_S,IQ3_M,Q2_K
        run: |
          set -o pipefail
          mkdir -p ab
          # download step does not import tinglongwu (its network guard blocks HF); bench files only, never shipped
          python scripts/bench/mt_cpu_threads.py --fetch-quants --quants "$QUANTS" --quant-dir "$HOME/bench-quants"
          # quants the repo lacks: made here with llama.cpp's quantizer from the best source (F16/Q8_0, else Q4_K_M)
          python scripts/bench/mt_cpu_threads.py --make-quants --quants "$QUANTS" --quant-dir "$HOME/bench-quants" \
            --models-dir "$TLWU_MODELS" || echo "some quants could not be made (see above)"
          python scripts/bench/mt_cpu_threads.py --data eval_data/smoke --models-dir "$TLWU_MODELS" --plans cpu-mode \
            --quants "$QUANTS" --quant-dir "$HOME/bench-quants" | tee ab/mt_quants.md
      - name: A/B (defaults vs CPU mode)
        run: |
          set -o pipefail
          mkdir -p ab
          python scripts/bench/cpu_mode_ab.py --run --data eval_data/smoke --out-dir ab \
            --base-args "--model $WHISPER --engine hymt2-cpu --models-dir $TLWU_MODELS" \
            --cpu-args "--engine hymt2-cpu --cpu-mode --models-dir $TLWU_MODELS" | tee ab/table.md
      # #745: the chrF limit re-measured on a larger set: the #642 matrix clips, 20 per pair (80 lines, not 20)
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: eval_data/matrix_pins
          key: eval-langs-data-v1-${{ hashFiles('eval/matrix_pins.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: A/B on 20 clips per pair (#745 chrF re-measure)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p ab/p20
          if [ ! -f eval_data/matrix_pins/manifest.jsonl ]; then
            python scripts/bench/make_ci_smoke.py --pins eval/matrix_pins.json --out eval_data/matrix_pins; fi
          SET="--pairs en->zh,ja->zh,ru->zh,zh->en --clips 20"
          python scripts/bench/cpu_mode_ab.py --run --data eval_data/matrix_pins --out-dir ab/p20 \
            --base-args "--model $WHISPER --engine hymt2-cpu --models-dir $TLWU_MODELS $SET" \
            --cpu-args "--engine hymt2-cpu --cpu-mode --models-dir $TLWU_MODELS $SET" | tee ab/table_p20.md
      - name: Summary
        if: always()
        run: |
          mkdir -p ab
          {
            echo "## CPU-mode A/B (#781)"
            echo
            echo "Runner: $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPU, $(free -g | awk '/^Mem:/{print $2}') GB RAM, commit ${GITHUB_SHA::7}"
            echo
            cat ab/table.md 2>/dev/null || echo "no table"
            echo
            echo "### A/B on 20 clips per pair (#745, eval/matrix_pins.json)"
            cat ab/table_p20.md 2>/dev/null || echo "no table"
            echo
            echo "### MT threads under live Whisper load (#1198)"
            cat ab/mt_threads.md 2>/dev/null || echo "no table"
            echo
            echo "Whisper paced like live audio (--asr-load live):"
            if [ -s ab/mt_threads_live.md ]; then cat ab/mt_threads_live.md; else echo "no table"; fi
            echo
            echo "MT alone:"
            cat ab/mt_threads_alone.md 2>/dev/null || echo "no table"
            echo
            echo "### Hy-MT2 quantizations, CPU-mode threads, under live Whisper load (#1198)"
            cat ab/mt_quants.md 2>/dev/null || echo "no table"
          } > ab/summary.md
          cat ab/summary.md | tee -a "$GITHUB_STEP_SUMMARY"   # also in the log: job summaries are not in the API
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: cpu-ab
          path: ab/
          if-no-files-found: warn

  # #1319 (#745 part 4): smaller MT models vs the shipped Hy-MT2 1.8B Q4_K_M on the same ASR lines (Whisper small,
  # CPU mode), 20 clips per pair of eval/matrix_pins.json: MT ms/line p50, end-to-end p50, chrF + bootstrap 95% CI,
  # COMET (wmt22-comet-da, own venv; n/a if that step fails). Bench only: candidates are never pinned or shipped.
  mt-candidates:
    if: github.repository == 'sunososobro-hub/tinglongwu'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu + Hy-MT2 CPU engine
        run: |
          pip install -e .
          pip install -r requirements-llama-cpu.txt --only-binary=:all:
      - name: Paths
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/tlwu-models
            eval_data/smoke
          key: eval-gate-v1-${{ env.WHISPER }}-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py', 'eval/ci_smoke.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: Models
        run: tlwu-setup --hymt --whisper "$WHISPER" --models-dir "$TLWU_MODELS"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: eval_data/matrix_pins
          key: eval-langs-data-v1-${{ hashFiles('eval/matrix_pins.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: Clips (20 per pair)
        run: |
          if [ ! -f eval_data/matrix_pins/manifest.jsonl ]; then
            python scripts/bench/make_ci_smoke.py --pins eval/matrix_pins.json --out eval_data/matrix_pins; fi
      - name: Candidate GGUFs
        env:
          CANDIDATES: ${{ inputs.candidates }}
        run: python scripts/bench/mt_candidates.py --fetch --dir cand --candidates "$CANDIDATES"
      - name: ASR once, then every MT model on the same lines
        env:
          CANDIDATES: ${{ inputs.candidates }}
        run: |
          python scripts/bench/mt_candidates.py --run --dir cand --candidates "$CANDIDATES" \
            --data eval_data/matrix_pins --models-dir "$TLWU_MODELS" --whisper "$WHISPER" --clips 20
      - name: COMET (own venv)
        continue-on-error: true
        run: |
          python -m venv "$HOME/comet-venv"
          # same venv recipe as eval-flores.yml (CPU torch first); torchmetrics still imports pkg_resources
          "$HOME/comet-venv/bin/pip" install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          "$HOME/comet-venv/bin/pip" install unbabel-comet==2.2.7 "setuptools<81"
          "$HOME/comet-venv/bin/python" scripts/bench/mt_candidates.py --comet --dir cand
      - name: Summary
        if: always()
        run: |
          set -o pipefail
          { echo "## MT candidates vs Hy-MT2 Q4_K_M on CPU (#1319)"; echo
            echo "Runner: $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPU, commit ${GITHUB_SHA::7}"; echo
            python scripts/bench/mt_candidates.py --table --dir cand || echo "no table"
          } | tee cand/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mt-candidates
          path: |
            cand/*.json
            cand/summary.md
          if-no-files-found: warn

  # #1264: real-time meeting replay. 30 min of pinned FLEURS ru clips (multi-speaker, CC-BY 4.0) fed to
  # `tlwu --file --paced` at 1x on this 4-vCPU runner, ru -> zh with Hy-MT2 CPU and speaker labels. Prints drops,
  # audio coverage, longest gap, lag p95 and the speaker-label count; field-test issues verify with this job.
  # #1253: two variants of the same recording, ASR + MT and ASR only (--transcript-only, speakers on in both), side by
  # side in the replay-ab job (drops with MT vs ASR only, MT delay held for ASR).
  replay:
    if: github.repository == 'sunososobro-hub/tinglongwu'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: asr-mt
            title: ASR + MT + speakers
            args: --to zh --engine hymt
            cpus: 4
            artifact: meeting-replay
          - variant: asr-only
            title: ASR only + speakers
            args: --transcript-only
            cpus: 4
            artifact: meeting-replay-asr-only
          # #1264 Acceptance ">0 drops on current dev": at 4 CPUs the replay has headroom (drops 0, lag p95
          # 2.6-8.1 s in runs 43884690127 / 43886111536 / 43893926386), so this variant halves the CPUs to load ASR
          # like a busy 2-core laptop. Not part of the replay-ab comparison.
          - variant: asr-mt-2cpu
            title: ASR + MT + speakers, 2 CPUs (stress)
            args: --to zh --engine hymt
            cpus: 2
            artifact: meeting-replay-2cpu
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu + Hy-MT2 CPU engine + speaker labels
        run: |
          pip install -e .
          pip install -r requirements-llama-cpu.txt --only-binary=:all:
          pip install --require-hashes -r requirements-speaker.txt --only-binary=:all:
      - name: Paths
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/tlwu-models
            eval_data/smoke
          key: eval-gate-v1-${{ env.WHISPER }}-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py', 'eval/ci_smoke.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: Models
        run: |
          tlwu-setup --hymt --whisper "$WHISPER" --models-dir "$TLWU_MODELS"
          tlwu-setup --speaker-model --models-dir "$TLWU_MODELS" || echo "no speaker model: labels n/a"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: eval_data/matrix_pins
          key: eval-langs-data-v1-${{ hashFiles('eval/matrix_pins.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: Recording (30 min, FLEURS ru)
        run: |
          if [ ! -f eval_data/matrix_pins/manifest.jsonl ]; then
            python scripts/bench/make_ci_smoke.py --pins eval/matrix_pins.json --out eval_data/matrix_pins; fi
          python scripts/bench/meeting_replay.py build --data eval_data/matrix_pins --lang ru --minutes 30 --out replay
      - name: Replay at 1x, ${{ matrix.cpus }} CPUs (${{ matrix.title }})
        timeout-minutes: 55
        env:
          ARGS: ${{ matrix.args }}
          CPUS: ${{ matrix.cpus }}
        run: |
          set -o pipefail
          SPK=""
          ls "$TLWU_MODELS"/speaker/*.onnx >/dev/null 2>&1 && SPK="--speakers"
          # shellcheck disable=SC2086 # ARGS is a word list from the matrix
          python scripts/bench/meeting_replay.py run --dir replay --cpus "$CPUS" $SPK -- \
            $ARGS --model "$WHISPER" | tee replay/summary.md
      - name: Summary
        if: always()
        env:
          TITLE: ${{ matrix.title }}
        run: |
          { echo "## Meeting replay (#1264): $TITLE"; echo
            echo "Runner: $(lscpu | sed -n 's/^Model name: *//p' | head -1), $(nproc) vCPU, commit ${GITHUB_SHA::7}"; echo
            if [ -f replay/replay.json ]; then python scripts/bench/meeting_replay.py report --dir replay; else echo "no replay"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: |
            replay/*.json
            replay/*.jsonl
            replay/*.log
            replay/*.md
            replay/t0.txt
            replay/rec/segments.jsonl
          if-no-files-found: warn

  # #1253 Acceptance: "dropped-segment count with MT on equals the ASR-only count; MT delay is shown, not hidden".
  replay-ab:
    # !cancelled(): runs after a failed variant (the summary says so) but not when a newer push cancelled the replay
    if: ${{ !cancelled() && github.repository == 'sunososobro-hub/tinglongwu' }}
    needs: replay
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meeting-replay
          path: ab/with-mt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: meeting-replay-asr-only
          path: ab/asr-only
      - name: A/B
        env:
          REPLAY_RESULT: ${{ needs.replay.result }}
        run: |
          set -o pipefail
          { echo "## Meeting replay A/B (#1253)"; echo
            if [ "$REPLAY_RESULT" != "success" ]; then
              echo "**warning: replay job result: $REPLAY_RESULT (a variant failed; read its own summary)**"; echo; fi
            python scripts/bench/meeting_replay.py compare --asr-only ab/asr-only --with-mt ab/with-mt --out ab/ab.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # #1247: the #894 hw-tests check also loses clips with `tlwu --file` (run 43917368834: file misses 16/31 clips,
  # WER 0.593, the same clips the live mic misses). This job runs that --file half on the same joined FLEURS clip on
  # a CPU runner (no audio devices needed) and lists, per missed clip, whether any line covers it and what tlwu wrote.
  live-file:
    if: github.repository == 'sunososobro-hub/tinglongwu'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu
        run: pip install -e .
      - name: Paths
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/tlwu-models
            eval_data/smoke
          key: eval-gate-v1-${{ env.WHISPER }}-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py', 'eval/ci_smoke.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: Models
        run: tlwu-setup --whisper "$WHISPER" --models-dir "$TLWU_MODELS"
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: eval_data/matrix_pins
          key: eval-langs-data-v1-${{ hashFiles('eval/matrix_pins.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: "#894 clip, --file only, per clip"
        run: |
          set -o pipefail
          if [ ! -f eval_data/matrix_pins/manifest.jsonl ]; then
            python scripts/bench/make_ci_smoke.py --pins eval/matrix_pins.json --out eval_data/matrix_pins; fi
          python scripts/hw_live_checks.py clips --data eval_data/matrix_pins --out live
          python scripts/hw_live_checks.py file --clips live --models-dir "$TLWU_MODELS" -- --model "$WHISPER" --device cpu \
            | tee live/file.txt
          { echo "## #1247 --file baseline of the #894 clip (CPU, $WHISPER)"; echo; echo '```'; cat live/file.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-file-1247
          path: |
            live/file_report.json
            live/file_only.jsonl
            live/file.txt
