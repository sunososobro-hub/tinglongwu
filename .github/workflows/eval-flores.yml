name: eval-flores
# #606: Hy-MT2-1.8B (the shipped Q4_K_M GGUF, llama.cpp on the CPU) on the full FLORES-200 devtest (1012 sentences)
# -> zho_Hant for rus/eng/jpn + kor/vie/tha/ind/spa/deu/fra (#656), chrF + COMET (Unbabel/wmt22-comet-da),
# the same metrics as docs/benchmarks.md.
# Runs on GitHub-hosted CPU runners because the cloud agent sandbox cannot reach the model / data hosts.
# Per-sentence JSON + summary are uploaded as the `flores-<src>` artifacts; the step summary has the table row.
# #1305: `matrix=6x6` runs the source x target language-pair matrix instead (en / ru / zh-Hans / zh-Hant / ja / ko,
# 30 directions, greedy, first 200 sentences unless `limit` is set): one job per source, five targets each, and a
# `table` job that writes the 6x6 `COMET / chrF` table (docs/benchmarks.md) to its step summary + `flores-6x6-table`.
# #1351: `variants` (card = shipped prompt + Q4_K_M, src = prompt names the source language, q8 = Q8_0 GGUF,
# 7b = the opt-in Hy-MT2-7B Q4_K_M from `tlwu-setup --hymt7b`, gemma3-12b / qwen3-8b = other open-weight families,
# bench only, OTHER_GGUF in scripts/bench/flores_cpu.py) adds a
# job per variant, `tgts` picks the targets (default zho_Hant), and every job writes the error breakdown of its 40
# lowest-COMET sentences (named entities, numbers, omissions, ...) to its step summary and log.
# Only runs when this workflow or the runner script changes, or by hand (workflow_dispatch, once on the default branch).
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/eval-flores.yml
      - scripts/bench/flores_cpu.py
  workflow_dispatch:
    inputs:
      limit:
        description: "first N sentences only (0 = all 1012)"
        default: "0"
      langs:
        description: "comma list of FLORES source codes (see LANGS in scripts/bench/flores_cpu.py)"
        default: "rus_Cyrl,eng_Latn,jpn_Jpan"
      temps:
        description: "comma list of Hy-MT2 temperatures (0 = greedy, 0.7 = model-card default)"
        default: "0"
      matrix:
        description: "6x6 = en/ru/zh-Hans/zh-Hant/ja/ko language-pair matrix (#1305; ignores langs/temps, limit 0 -> 200)"
        type: choice
        options: ["", "6x6"]
        default: ""
      variants:
        description: "comma list of experiment variants (#1351): card, src (prompt names the source language), q8 (Q8_0), 7b (Hy-MT2-7B), gemma3-12b, qwen3-8b"
        default: "card"
      tgts:
        description: "comma list of FLORES targets (#1351; default zho_Hant; ignored by matrix=6x6)"
        default: "zho_Hant"

permissions:
  contents: read

concurrency:
  group: eval-flores-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  PYTHONUTF8: "1"

jobs:
  plan:
    # #656: the matrix comes from the `langs` input (dispatch) or, on a PR, every direction the runner knows;
    # flores_cpu.py --matrix rejects anything that is not a known FLORES code
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      src: ${{ steps.m.outputs.src }}
      temp: ${{ steps.m.outputs.temp }}
      tgts: ${{ steps.m.outputs.tgts }}
      limit: ${{ steps.m.outputs.limit }}
      variant: ${{ steps.m.outputs.variant }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: m
        env:
          LANGS: ${{ inputs.langs || 'rus_Cyrl,eng_Latn,jpn_Jpan' }}
          TEMPS: ${{ inputs.temps || '0.7,0.2,0' }}
          MATRIX: ${{ inputs.matrix || '' }}
          LIMIT: ${{ inputs.limit || '0' }}
          VARIANTS: ${{ inputs.variants || 'card' }}
          TGTS: ${{ inputs.tgts || 'zho_Hant' }}
        run: |
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be a number" >&2; exit 1;; esac
          if [ "$MATRIX" = "6x6" ]; then
            echo "src=$(python3 scripts/bench/flores_cpu.py --matrix6)" >> "$GITHUB_OUTPUT"
            echo "tgts=$(python3 scripts/bench/flores_cpu.py --matrix6)" >> "$GITHUB_OUTPUT"
            echo 'temp=["0"]' >> "$GITHUB_OUTPUT"
            echo 'variant=["card"]' >> "$GITHUB_OUTPUT"
            [ "$LIMIT" = "0" ] && LIMIT=200
          else
            echo "src=$(python3 scripts/bench/flores_cpu.py --matrix "$LANGS")" >> "$GITHUB_OUTPUT"
            echo "tgts=$(python3 scripts/bench/flores_cpu.py --tgts "$TGTS")" >> "$GITHUB_OUTPUT"
            echo "temp=$(python3 scripts/bench/flores_cpu.py --temps "$TEMPS")" >> "$GITHUB_OUTPUT"
            echo "variant=$(python3 scripts/bench/flores_cpu.py --variants "$VARIANTS")" >> "$GITHUB_OUTPUT"
          fi
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"

  flores:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        src: ${{ fromJSON(needs.plan.outputs.src) }}
        temp: ${{ fromJSON(needs.plan.outputs.temp) }}
        variant: ${{ fromJSON(needs.plan.outputs.variant) }}
    env:
      SRC: ${{ matrix.src }}
      TEMP: ${{ matrix.temp }}
      VARIANT: ${{ matrix.variant }}
      TGTS: ${{ needs.plan.outputs.tgts }}
      LIMIT: ${{ needs.plan.outputs.limit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu + Hy-MT2 CPU engine + sacrebleu
        run: |
          pip install -e .
          pip install -r requirements-llama-cpu.txt --only-binary=:all:
          pip install sacrebleu==2.6.0
      - name: COMET venv (unbabel-comet pins numpy<2, so it cannot share the tlwu env)
        run: |
          python -m venv "$HOME/comet"
          "$HOME/comet/bin/pip" install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          "$HOME/comet/bin/pip" install unbabel-comet==2.2.7 sacrebleu==2.6.0
      - name: Paths
        run: |
          echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
          echo "BENCH=$HOME/bench" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/tlwu-models
            ~/bench/flores200_dataset
            ~/.cache/huggingface
          key: eval-flores-v2-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py') }}
      - name: Hy-MT2 1.8B + FLORES-200
        run: |
          tlwu-setup --hymt --models-dir "$TLWU_MODELS"
          python scripts/bench/fetch_data.py --out "$BENCH" --fleurs ""
          if [ "${{ matrix.variant }}" = "q8" ]; then python scripts/bench/flores_cpu.py --fetch-q8 "$TLWU_MODELS"; fi
          if [ "${{ matrix.variant }}" = "7b" ]; then
            # the 4.8 GB 7B GGUF and its manifest entry live in their own uncached models dir; the cached
            # $TLWU_MODELS only gets a symlink, so the shared actions cache stays at the 1.8B size and a restored
            # manifest can never claim a 7B that is not on this runner
            tlwu-setup --hymt7b --models-dir "$HOME/tlwu-models-7b"
            ln -sfn "$HOME/tlwu-models-7b/hymt2-7b" "$TLWU_MODELS/hymt2-7b"
          fi
          case "${{ matrix.variant }}" in
            gemma3-12b|qwen3-8b)
              # #1351 r3: other-family GGUF, uncached like the 7B (the cached dir only gets a symlink)
              python scripts/bench/flores_cpu.py --fetch-gguf "$HOME/tlwu-models-gguf" "${{ matrix.variant }}"
              ln -sfn "$HOME/tlwu-models-gguf/bench-${{ matrix.variant }}" "$TLWU_MODELS/bench-${{ matrix.variant }}"
              ;;
          esac
      - name: Translate (CPU, Hy-MT2 temperature from the matrix; 0 = greedy, repeatable)
        run: |
          for TGT in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["TGTS"])))'); do
            [ "$TGT" = "$SRC" ] && continue
            python scripts/bench/flores_cpu.py --data "$BENCH/flores200_dataset" --src "$SRC" --tgt "$TGT" \
              --out out --limit "$LIMIT" --no-comet --temp "$TEMP" --variant "$VARIANT"
          done
      - name: Score chrF + COMET (CPU)
        run: |
          for TGT in $(python3 -c 'import json, os; print(" ".join(json.loads(os.environ["TGTS"])))'); do
            [ "$TGT" = "$SRC" ] && continue
            "$HOME/comet/bin/python" scripts/bench/flores_cpu.py --data "$BENCH/flores200_dataset" \
              --src "$SRC" --tgt "$TGT" --out out --limit "$LIMIT" --score-only
          done
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print("| pair | variant | temp | n | chrF | COMET | U+FFFD lines | median s/sentence | p90 s | CPU |")
          print("|---|---|---|---|---|---|---|---|---|---|")
          for p in sorted(pathlib.Path("out").glob("*.summary.json")):
              s = json.loads(p.read_text("utf-8"))
              print(f"| {s['pair']} | {s.get('variant', 'card')} | {s.get('temperature')} | {s['n']} | {s['chrF']} | "
                    f"{s.get('COMET')} | {s.get('fffd_lines')} | {s['median_s']} | {s['p90_s']} | {s['cpu']} |")
          EOF
      - name: Error breakdown of the 40 lowest-COMET sentences (#1351)
        run: python3 scripts/bench/flores_cpu.py --breakdown out 40 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: flores-${{ matrix.src }}-t${{ matrix.temp }}${{ matrix.variant != 'card' && format('-{0}', matrix.variant) || '' }}
          path: out/
          if-no-files-found: warn

  table:
    # #1305: the 6x6 COMET / chrF table from every source job's summaries (rows = source, columns = target)
    needs: [plan, flores]
    if: ${{ always() && inputs.matrix == '6x6' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: flores-*
          path: arts
      - name: 6x6 table
        run: |
          {
            echo "### MT language-pair matrix (COMET / chrF), run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA::7}"
            echo
            python3 scripts/bench/flores_cpu.py --table arts
            echo
            echo "### Traffic lights with the Google reference (#1352)"
            echo
            python3 scripts/bench/matrix_lights.py arts
          } | tee table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flores-6x6-table
          path: table.md
      - name: 20 lowest-COMET sentences per direction (#1346)
        run: |
          python3 scripts/bench/flores_cpu.py --worst arts 20 worst.json
          test "$(wc -c < worst.json)" -lt 1000000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flores-6x6-worst
          path: worst.json

  publish:
    # #1346: keep the worst sentences on the `eval-results` branch (Actions artifacts expire); pushes there only
    needs: [table, flores]
    if: ${{ inputs.matrix == '6x6' && github.event_name == 'workflow_dispatch' && needs.table.result == 'success' && needs.flores.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # push to eval-results only
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: flores-6x6-worst
      - name: Commit to eval-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          D=$(date -u +%F)
          git init -q repo && cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch --depth=1 origin eval-results 2>/dev/null; then git checkout -q -B eval-results FETCH_HEAD; else git checkout -q --orphan eval-results; fi
          mkdir -p flores
          cp ../worst.json "flores/${D}-${GITHUB_RUN_ID}.json"
          git add flores
          if git diff --cached --quiet; then echo "already published"; exit 0; fi
          git commit -q -m "eval: flores worst sentences ${D} run ${GITHUB_RUN_ID}"
          git push origin HEAD:refs/heads/eval-results
