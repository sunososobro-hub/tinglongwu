name: topic-bakeoff
# #1378 (restart of #595 / #610): CPU-only bake-off of small instruct GGUF models for offline meeting topic notes.
# One job per candidate on a GitHub-hosted 4 vCPU runner: scripts/topic_bakeoff.py runs the app's own topic prompt
# (tinglongwu.topics) on 25 fixed segments (10 zh / 10 en / 5 ru) and times a ~5-minute topic with the app's thread
# count while 2 cores are kept busy (ASR + MT). The `table` job merges every candidate's --out JSON into one table
# (step summary + `topic-bakeoff` artifact); docs/benchmarks.md is updated by hand from it. Model files are fetched
# here for the bench only, never bundled. Read-only: never pushes, never touches issues.
on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/topic_bakeoff.py
      - .github/workflows/topic-bakeoff.yml
  workflow_dispatch:
    inputs:
      candidates:
        description: "comma list of scripts/topic_bakeoff.py CANDIDATES (empty = all)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: topic-bakeoff-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  PYTHONUTF8: "1"

jobs:
  plan:
    if: github.repository == 'sunososobro-hub/tinglongwu'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      names: ${{ steps.n.outputs.names }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: n
        env:
          CANDIDATES: ${{ inputs.candidates || '' }}
        run: |
          echo "names=$(python3 -c 'import json, os, sys; sys.path.insert(0, "scripts"); import topic_bakeoff as t; print(json.dumps(t.parse_names(os.environ["CANDIDATES"])))')" >> "$GITHUB_OUTPUT"

  bench:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.plan.outputs.names) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tlwu + llama.cpp CPU engine
        run: |
          pip install -e .
          pip install -r requirements/requirements-llama-cpu.txt --only-binary=:all:
          pip install psutil==7.2.2
      - name: Candidate GGUF (bench only, before tinglongwu's network guard)
        run: python scripts/topic_bakeoff.py --fetch "${{ matrix.name }}" --dir cand
      - name: Bake-off (app threads, 2 cores busy)
        run: |
          set -o pipefail
          mkdir -p out
          GGUF=$(find "cand/${{ matrix.name }}" -name '*.gguf' | head -1)
          python scripts/topic_bakeoff.py --model "${{ matrix.name }}=$GGUF" --busy 2 \
            --machine "GitHub 4 vCPU ($(lscpu | sed -n 's/^Model name: *//p' | head -1))" \
            --out "out/${{ matrix.name }}.json" | tee -a "$GITHUB_STEP_SUMMARY"
          cp "cand/${{ matrix.name }}/source.json" "out/${{ matrix.name }}.source.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: topic-bakeoff-${{ matrix.name }}
          path: out/
          if-no-files-found: warn

  table:
    needs: bench
    if: always() && needs.bench.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: topic-bakeoff-*
          path: out
          merge-multiple: true
      - name: Table
        run: |
          set -o pipefail
          { echo "## Topic notes bake-off (#1378)"; echo; echo "commit ${GITHUB_SHA::7}, run ${GITHUB_RUN_ID}"; echo
            python3 -c 'import sys; sys.path.insert(0, "scripts"); import topic_bakeoff as t, glob; t.main(["--results", *sorted(f for f in glob.glob("out/*.json") if not f.endswith(".source.json"))])'
            echo; echo "Sources:"; cat out/*.source.json; echo
          } | tee out/summary.md | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: topic-bakeoff
          path: out/
