name: eval-nightly
# #571 (#340 part 4): nightly CPU mini-eval (same smoke as eval.yml / #570). Results go to the `eval-results` branch
# (results/YYYY-MM-DD.json + history.jsonl), never gh-pages (rebuilt hourly by stats-dashboard.yml) and never dev/main.
# A chrF drop below baseline - margin opens (or comments on) the issue "[eval] nightly chrF drop".
#   eval    : contents read  - runs the smoke, computes the alert text (scripts/eval_nightly.py)
#   publish : contents write - the only job that pushes, to eval-results only
#   alert   : issues write   - the only job that touches issues
on:
  schedule:
    - cron: "37 19 * * *"   # 03:37 Asia/Taipei, after hw-nightly
  workflow_dispatch:

permissions: {}

concurrency:
  group: eval-nightly
  cancel-in-progress: false

env:
  TLWU_NO_UPDATE: "1"
  TLWU_HYMT_TEMP: "0"
  PYTHONUTF8: "1"
  WHISPER: small

jobs:
  eval:
    if: github.repository == 'sunososobro-hub/tinglongwu'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      drop: ${{ steps.alert.outputs.drop }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu + Hy-MT2 CPU engine
        run: |
          pip install -e .
          pip install -r requirements-llama-cpu.txt --only-binary=:all:
      - name: Paths
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/tlwu-models
            eval_data/smoke
          key: eval-gate-v1-${{ env.WHISPER }}-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py', 'eval/ci_smoke.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: Models
        run: tlwu-setup --hymt --whisper "$WHISPER" --models-dir "$TLWU_MODELS"
      - name: Smoke clips
        run: |
          if [ -f eval_data/smoke/manifest.jsonl ]; then echo "cached"; else python scripts/bench/make_ci_smoke.py --out eval_data/smoke; fi
      - name: Previous history (eval-results branch, if it exists)
        run: |
          git fetch --depth=1 "https://github.com/${{ github.repository }}.git" eval-results 2>/dev/null \
            && git show FETCH_HEAD:history.jsonl > history.jsonl || : > history.jsonl
      - name: Mini-eval (CPU)
        run: |
          set +e
          python -m tlwu_eval --smoke --data eval_data/smoke --clips 5 --model "$WHISPER" --engine hymt2-cpu \
            --device cpu --no-noise --models-dir "$TLWU_MODELS" --out r.json --history history.jsonl
          rc=$?
          # 1 = the smoke's own time budget missed on a slow runner: this job tracks quality, so keep going
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          test -s r.json
      - name: Alert text
        id: alert
        run: python scripts/eval_nightly.py r.json --baseline eval/baseline.json --out alert.md --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-nightly
          path: |
            r.json
            history.jsonl
            alert.md
          if-no-files-found: warn

  publish:
    needs: eval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # push to eval-results only
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eval-nightly
      - name: Commit to eval-results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          D=$(date -u +%F)
          git init -q repo && cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch --depth=1 origin eval-results 2>/dev/null; then git checkout -q -B eval-results FETCH_HEAD; else git checkout -q --orphan eval-results; fi
          mkdir -p results
          cp ../r.json "results/$D.json"
          cp ../history.jsonl history.jsonl
          git add results history.jsonl
          git commit -q -m "eval: nightly $D"
          git push origin HEAD:refs/heads/eval-results

  alert:
    needs: eval
    if: needs.eval.outputs.drop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: eval-nightly
      - name: Open or comment on the alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          T="[eval] nightly chrF drop"
          N=$(gh issue list --state open --search "\"$T\" in:title" --json number,title --jq "[.[] | select(.title == \"$T\")][0].number // empty")
          if [ -n "$N" ]; then gh issue comment "$N" --body-file alert.md
          else gh issue create --title "$T" --body-file alert.md; fi
