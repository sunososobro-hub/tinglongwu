name: e2e
# End-to-end checks on GitHub-hosted runners for issues that used to wait on a hands-on test (status:needs-test).
# Real models (smoke set: Whisper small + Hy-MT2 1.8B on the CPU + OPUS + Kokoro), real processes, real audio files;
# ubuntu also gets a real PulseAudio server (null sink = speakers, its monitor = microphone) and Xvfb + openbox.
# The issue each step covers is in its name. What still needs real hardware (GPU, microphone, a real call) is listed
# in docs: see the PR that added this file.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  TLWU_UI_LANG: en
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (audio server, virtual display, window manager)
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends \
              libsndfile1 libpulse0 pulseaudio pulseaudio-utils xvfb openbox xdotool x11-utils && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu + Hy-MT2 CPU engine
        run: |
          pip install -e ".[dev]" python-xlib==0.33
          pip install -r requirements-llama-cpu.txt --only-binary=:all:
      - name: Models dir
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/tlwu-models
          key: e2e-models-v3-linux-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py') }}
      - name: Models (smoke set) + Kokoro voice venv
        run: |
          tlwu-setup --whisper small --hymt --pair zh-en --pair en-zh --pair en-ru --pair ru-en --allow-unpinned --models-dir "$TLWU_MODELS"
          tlwu-setup --talk --talk-venv "$HOME/tts-kokoro" --talk-launcher "$RUNNER_TEMP/tlwu-talk.ps1" --models-dir "$TLWU_MODELS"
          echo "TLWU_KOKORO_PYTHON=$HOME/tts-kokoro/bin/python" >> "$GITHUB_ENV"
          echo "TLWU_KOKORO_MODEL=$TLWU_MODELS/kokoro" >> "$GITHUB_ENV"
          TLWU_KOKORO_PYTHON="$(grep TLWU_KOKORO_PYTHON "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" TLWU_KOKORO_MODEL="$TLWU_MODELS/kokoro" \
            python scripts/ci_e2e.py zh-wav "$RUNNER_TEMP/zh16k.wav"
      - name: PulseAudio with a null sink (speakers) whose monitor is a capture source
        run: |
          pulseaudio -D --exit-idle-time=-1
          for i in $(seq 20); do pactl info >/dev/null 2>&1 && break; sleep 0.5; done
          pactl load-module module-null-sink sink_name=e2e_speaker sink_properties=device.description=E2E-Speaker
          pactl set-default-sink e2e_speaker
          pactl list short sources
      - name: "#90 tlwu --selftest on the CPU (real models)"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py selftest --models-dir "$TLWU_MODELS"
      - name: "#89 #90 old NVIDIA driver (fake nvidia-smi 457.49): update-driver advice, CPU downgrade"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py gpu-old --models-dir "$TLWU_MODELS"
      - name: "#313 tlwu doctor on a real machine: every problem has a fix line"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py doctor --to en --models-dir "$TLWU_MODELS" --expect-ok "speech model" "translation model" "voice (en)"
      - name: "#5 Ctrl+C (SIGINT to the process group) in listen and speak: no traceback"
        if: ${{ !cancelled() }}
        run: |
          python scripts/ci_e2e.py ctrlc --mode listen --models-dir "$TLWU_MODELS"
          python scripts/ci_e2e.py ctrlc --mode speak --models-dir "$TLWU_MODELS"
      - name: "#192 #186 #5 speak mode with mic = 'Monitor of E2E-Speaker', clip played into the sink, Ctrl+C"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py monitor-live --models-dir "$TLWU_MODELS"
      - name: "#213 #207 speak_selftest.py on Linux (records the tlwu_mic virtual mic)"
        if: ${{ !cancelled() }}
        run: |
          python scripts/ci_e2e.py zh-wav "$RUNNER_TEMP/zh.wav" --repeat 2
          python scripts/speak_selftest.py --clip "$RUNNER_TEMP/zh.wav" --to en --models-dir "$TLWU_MODELS" \
            --tts-python "$TLWU_KOKORO_PYTHON" --tts-model "$TLWU_KOKORO_MODEL" --json "$RUNNER_TEMP/speak.json"
          cat "$RUNNER_TEMP/speak.json"
          { echo '### speak_selftest (Linux runner CPU)'; echo '```'; cat "$RUNNER_TEMP/speak.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: "#258 scripts/linux_offline_run.sh for real (sudo unshare + setpriv): no network, still translates"
        if: ${{ !cancelled() }}
        run: |
          shellcheck scripts/linux_offline_run.sh
          if scripts/linux_offline_run.sh "$(command -v python)" -I -c "import socket; socket.create_connection(('1.1.1.1', 443), timeout=5)"; then
            echo "FAIL: network reachable inside linux_offline_run.sh"; exit 1
          fi
          echo "PASS: no network inside"
          scripts/linux_offline_run.sh "$(command -v python)" -c "import os, sys; assert os.getuid() != 0, 'runs as root'; print('PASS: runs as uid', os.getuid())"
          scripts/linux_offline_run.sh "$(command -v python)" -m tinglongwu --file tinglongwu/data/selftest_en.wav --to zh \
            --device cpu --models-dir "$TLWU_MODELS" --save "$RUNNER_TEMP/offline.jsonl"
          python -c "import json,sys; r=[json.loads(x) for x in open(sys.argv[1], encoding='utf-8') if x.strip()]; g=[x for x in r if x.get('dst')]; print(len(g), 'translated lines', g[:1]); sys.exit(0 if g else 1)" "$RUNNER_TEMP/offline.jsonl"
      - name: "#7 firewall_test.py: listen / speak / meeting with the network cut (network namespace)"
        if: ${{ !cancelled() }}
        run: |
          # Ubuntu 24.04 denies unprivileged user namespaces by default (AppArmor); firewall_test uses `unshare -n -r`
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python scripts/firewall_test.py --listen-wav tinglongwu/data/selftest_en.wav --speak-wav "$RUNNER_TEMP/zh16k.wav" \
            --compute cpu --tts-python "$TLWU_KOKORO_PYTHON" --tts-model "$TLWU_KOKORO_MODEL"
      - name: "#85 #322 #270 GUI tests on a real X display (they skip without one)"
        if: ${{ !cancelled() }}
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          set -o pipefail  # pytest's exit code, not tee's
          export DISPLAY=:99
          export APPDATA="$RUNNER_TEMP/gui-appdata"  # earlier steps wrote ~/.config/tinglongwu/gui.json; start clean
          for i in $(seq 20); do xdpyinfo >/dev/null 2>&1 && break; sleep 0.5; done
          openbox >/dev/null 2>&1 &
          sleep 1
          python -m pytest -q -rs -p no:cacheprovider tests/test_gui.py tests/test_gui_live_settings_85.py tests/test_overlay_322.py \
            tests/test_overlay_speak_322.py tests/test_gui_icon.py tests/test_focus_langs.py | tee "$RUNNER_TEMP/gui.txt"
          if grep -qi "skipped.*display" "$RUNNER_TEMP/gui.txt"; then echo "FAIL: GUI tests skipped (no display)"; exit 1; fi
      - name: "#322 overlay stays above a fullscreen window (openbox), line < 100 ms, settings persist"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py overlay-stack

  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tlwu + Hy-MT2 CPU engine
        run: |
          pip install -e ".[dev]"
          pip install -r requirements-llama-cpu.txt --only-binary=:all:
      - name: Models dir
        run: echo "TLWU_MODELS=$(cygpath -m "$HOME/tlwu-models")" >> "$GITHUB_ENV"   # C:/... form: env values reach native python as-is
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/tlwu-models
          key: e2e-models-v3-windows-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py') }}
      - name: Models (smoke set) + Kokoro voice venv + opt-in Russian voice (#311)
        run: |
          tlwu-setup --whisper small --hymt --pair zh-en --pair en-zh --pair en-ru --pair ru-en --allow-unpinned --models-dir "$TLWU_MODELS"
          tlwu-setup --talk --talk-venv "$(cygpath -m "$HOME/tts-kokoro")" --talk-launcher "$RUNNER_TEMP/tlwu-talk.ps1" --models-dir "$TLWU_MODELS"
          tlwu-setup --vosk-tts-ru --models-dir "$TLWU_MODELS"
          echo "TLWU_KOKORO_PYTHON=$(cygpath -m "$HOME/tts-kokoro/Scripts/python.exe")" >> "$GITHUB_ENV"
          echo "TLWU_KOKORO_MODEL=$TLWU_MODELS/kokoro" >> "$GITHUB_ENV"
          TLWU_KOKORO_PYTHON="$(grep TLWU_KOKORO_PYTHON "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" TLWU_KOKORO_MODEL="$TLWU_MODELS/kokoro" \
            python scripts/ci_e2e.py zh-wav "$RUNNER_TEMP/zh16k.wav"
      - name: "#90 tlwu --selftest on the CPU (real models)"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py selftest --models-dir "$TLWU_MODELS"
      - name: "#89 #90 old NVIDIA driver (fake nvidia-smi.exe 457.49): installer + runtime + self-test advice"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py gpu-old --models-dir "$TLWU_MODELS"
      - name: "#313 tlwu doctor on a clean Windows: every problem has a fix line"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py doctor --to ru --models-dir "$TLWU_MODELS" --expect-ok "speech model" "translation model" "voice (ru)"
      - name: "#5 Ctrl+C (real CTRL_C_EVENT on a console) in listen and speak: no traceback, no leftover TTS worker"
        if: ${{ !cancelled() }}
        run: |
          python scripts/ci_e2e.py ctrlc --mode listen --models-dir "$TLWU_MODELS"
          python scripts/ci_e2e.py ctrlc --mode speak --models-dir "$TLWU_MODELS"
      - name: "#311 speak --to ru speaks Russian after tlwu-setup --vosk-tts-ru, no extra flags"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py speak-ru --models-dir "$TLWU_MODELS"
      - name: "#322 overlay stays above a fullscreen window on the Windows desktop (z-order, WS_EX_TOPMOST)"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py overlay-stack
      - name: "#7 firewall_test.py: real Windows Firewall outbound block (runner is admin)"
        if: ${{ !cancelled() }}
        run: |
          python scripts/firewall_test.py --listen-wav tinglongwu/data/selftest_en.wav --speak-wav "$RUNNER_TEMP/zh16k.wav" \
            --compute cpu --tts-python "$TLWU_KOKORO_PYTHON" --tts-model "$TLWU_KOKORO_MODEL"

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tlwu + Hy-MT2 CPU engine
        run: |
          pip install -e ".[dev]"
          # what mac_install.sh does first; on 2026-11-12 the index's macOS arm64 wheel of 0.3.36 is a corrupt zip
          # (zlib "invalid block type"), so fall back to building the PyPI sdist (cmake, ~6 min)
          pip install --no-cache-dir -r requirements-llama-cpu.txt             || pip install --no-cache-dir --no-binary llama-cpp-python "$(grep -E '^llama-cpp-python==' requirements-llama-cpu.txt)"
      - name: Models dir
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/tlwu-models
          key: e2e-models-v3-macos-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py') }}
      - name: Models (smoke set) + Kokoro voice venv
        run: |
          tlwu-setup --whisper small --hymt --pair zh-en --pair en-zh --pair en-ru --pair ru-en --allow-unpinned --models-dir "$TLWU_MODELS"
          tlwu-setup --talk --talk-venv "$HOME/tts-kokoro" --talk-launcher "$RUNNER_TEMP/tlwu-talk.ps1" --models-dir "$TLWU_MODELS"
          echo "TLWU_KOKORO_PYTHON=$HOME/tts-kokoro/bin/python" >> "$GITHUB_ENV"
          echo "TLWU_KOKORO_MODEL=$TLWU_MODELS/kokoro" >> "$GITHUB_ENV"
          TLWU_KOKORO_PYTHON="$(grep TLWU_KOKORO_PYTHON "$GITHUB_ENV" | tail -1 | cut -d= -f2-)" TLWU_KOKORO_MODEL="$TLWU_MODELS/kokoro" \
            python scripts/ci_e2e.py zh-wav "$RUNNER_TEMP/zh16k.wav"
      - name: "#8 tlwu --selftest on macOS (real models)"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py selftest --models-dir "$TLWU_MODELS"
      - name: "#8 listen + speak (Kokoro voice) + meeting modes on audio files"
        if: ${{ !cancelled() }}
        run: |
          python scripts/ci_e2e.py modes --listen-wav tinglongwu/data/selftest_en.wav --speak-wav "$RUNNER_TEMP/zh16k.wav"
      - name: "#8 #5 Ctrl+C on macOS in listen and speak: no traceback"
        if: ${{ !cancelled() }}
        run: |
          python scripts/ci_e2e.py ctrlc --mode listen --models-dir "$TLWU_MODELS"
          python scripts/ci_e2e.py ctrlc --mode speak --models-dir "$TLWU_MODELS"
      - name: "#313 tlwu doctor on macOS"
        if: ${{ !cancelled() }}
        run: python scripts/ci_e2e.py doctor --to en --models-dir "$TLWU_MODELS" --expect-ok "speech model" "translation model" "voice (en)"
