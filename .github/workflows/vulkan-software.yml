name: vulkan-software
# #1195: functional check of the Linux Vulkan llama.cpp pack on a software Vulkan driver (Mesa lavapipe). Builds the pack
# like release.yml `vulkan-pack-linux`, runs Hy-MT2 on the CPU build and on the pack, and fails unless the Vulkan run
# really used the `vulkan` backend and its output is within chrF -2 of the CPU output (scripts/vulkan_parity.py).
# Speed is printed, never gated. Not part of any release gate. ASR half: the pinned whisper.cpp Vulkan build (#783,
# like release.yml `whisper-vulkan`) is added to the pack; Whisper small transcribes the en CI smoke clips through
# asr_vulkan.select_recognizer on the CPU (faster-whisper) and on Vulkan (whisper.cpp), and the job fails unless the
# Vulkan run really used `vulkan` and its CER is within +0.02 of the CPU run (vulkan_parity.py compare-asr).
on:
  workflow_dispatch:
  pull_request:   # #1195: a change to the parity check itself proves itself on its own PR
    branches: [dev]
    paths:
      - .github/workflows/vulkan-software.yml
      - scripts/vulkan_parity.py
      - scripts/build_whisper_vulkan.py
      - scripts/whisper_vulkan/**
  schedule:
    - cron: "41 20 * * 0"   # weekly, Sunday 04:41 Asia/Taipei

permissions: {}

concurrency:
  group: vulkan-software
  cancel-in-progress: false

env:
  TLWU_NO_UPDATE: "1"
  TLWU_HYMT_TEMP: "0"
  PYTHONUTF8: "1"

jobs:
  parity:
    if: github.repository == 'sunososobro-hub/tinglongwu'
    runs-on: ubuntu-24.04
    timeout-minutes: 75   # llama.cpp + whisper.cpp Vulkan builds (~20 + ~10 min) and lavapipe ASR
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'dev' }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Vulkan build tools + Mesa lavapipe + system libraries
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          # spirv-headers: ggml-vulkan's find_package(SPIRV-Headers CONFIG REQUIRED) (#1195)
          sudo apt-get install -y -qq libvulkan-dev glslc glslang-tools spirv-headers mesa-vulkan-drivers vulkan-tools libsndfile1 libpulse0
      - name: Install tlwu + the CPU llama.cpp build
        run: |
          pip install -e .
          pip install -r requirements/requirements-llama-cpu.txt --only-binary=:all:
      - name: Build the Vulkan pack (same pin as the CPU build)
        timeout-minutes: 20
        run: |
          pin=$(sed -n 's/^llama-cpp-python==\([^ #]*\).*/\1/p' requirements/requirements-llama-cpu.txt)
          [ -n "$pin" ] || { echo "no llama-cpp-python pin"; exit 1; }
          CMAKE_ARGS="-DGGML_VULKAN=on -DGGML_NATIVE=off" FORCE_CMAKE=1 \
            python -m pip install "llama-cpp-python==$pin" --no-binary llama-cpp-python --no-cache-dir --target "$RUNNER_TEMP/vk-site"
          ver=$(python -c "import tinglongwu; print(tinglongwu.__version__)")
          python scripts/make_vulkan_pack.py --lib "$RUNNER_TEMP/vk-site/llama_cpp/lib" --version "$ver" --out "$RUNNER_TEMP/vk-dist"
          mkdir -p "$RUNNER_TEMP/vk-pack"
          unzip -q "$RUNNER_TEMP/vk-dist/tlwu-vulkan-pack-linux-$ver.zip" -d "$RUNNER_TEMP/vk-pack"
          GGML_VK_VISIBLE_DEVICES=0 python scripts/make_vulkan_pack.py --smoke "$RUNNER_TEMP/vk-dist/tlwu-vulkan-pack-linux-$ver.zip"
          echo "VK_ZIP=$RUNNER_TEMP/vk-dist/tlwu-vulkan-pack-linux-$ver.zip" >> "$GITHUB_ENV"
      - name: Build whisper.cpp (pinned commit) with GGML_VULKAN=on and add it to the pack under whisper/ (#783)
        timeout-minutes: 20
        env:
          GGML_VK_VISIBLE_DEVICES: "0"
        run: |
          python scripts/build_whisper_vulkan.py --out "$RUNNER_TEMP/whisper-out" --smoke "$RUNNER_TEMP/whisper-out"
          python scripts/make_vulkan_pack.py --add-whisper "$VK_ZIP" --whisper "$RUNNER_TEMP/whisper-out"
          unzip -q -o "$VK_ZIP" -d "$RUNNER_TEMP/vk-pack"
          ls -l "$RUNNER_TEMP/vk-pack/whisper"
      - name: Paths
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/tlwu-models
            eval_data/smoke
          key: vulkan-software-v2-${{ hashFiles('src/system/tinglongwu_setup/manifest.json', 'src/system/tinglongwu_setup/downloader.py', 'eval/ci_smoke.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: Models (Hy-MT2, Whisper small for faster-whisper and whisper.cpp) + CI smoke clips
        run: |
          tlwu-setup --hymt --whisper small --whisper-cpp small --models-dir "$TLWU_MODELS"
          if [ -f eval_data/smoke/manifest.jsonl ]; then echo "smoke clips cached"; else python scripts/bench/make_ci_smoke.py --out eval_data/smoke; fi
      - name: Hy-MT2 on the CPU build
        env:
          TLWU_DEVICE: cpu
        run: python scripts/vulkan_parity.py translate --models-dir "$TLWU_MODELS" --out cpu.json
      - name: Hy-MT2 on the Vulkan pack (lavapipe)
        env:
          TLWU_DEVICE: vulkan
          TLWU_VULKAN_PACK: ${{ runner.temp }}/vk-pack
          GGML_VK_VISIBLE_DEVICES: "0"   # ggml-vulkan skips CPU-type devices (lavapipe) unless listed explicitly
        run: python scripts/vulkan_parity.py translate --models-dir "$TLWU_MODELS" --out vulkan.json
      - name: Compare (backend must be vulkan, chrF within -2 of CPU)
        shell: bash   # pipefail: a failing compare must not be masked by tee
        run: python scripts/vulkan_parity.py compare cpu.json vulkan.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Whisper small on the CPU (faster-whisper)
        if: ${{ !cancelled() }}
        env:
          TLWU_DEVICE: cpu
        run: python scripts/vulkan_parity.py transcribe --models-dir "$TLWU_MODELS" --data eval_data/smoke --langs en --out asr_cpu.json
      - name: Whisper small on the Vulkan pack (whisper.cpp, lavapipe)
        if: ${{ !cancelled() }}
        env:
          TLWU_DEVICE: vulkan
          TLWU_VULKAN_PACK: ${{ runner.temp }}/vk-pack
          GGML_VK_VISIBLE_DEVICES: "0"
        run: python scripts/vulkan_parity.py transcribe --models-dir "$TLWU_MODELS" --data eval_data/smoke --langs en --out asr_vulkan.json
      - name: Compare ASR (backend must be vulkan, CER within +0.02 of CPU)
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/vulkan_parity.py compare-asr asr_cpu.json asr_vulkan.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vulkan-software
          path: |
            cpu.json
            vulkan.json
            asr_cpu.json
            asr_vulkan.json
          if-no-files-found: warn
