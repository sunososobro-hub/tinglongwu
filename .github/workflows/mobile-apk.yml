name: mobile-apk
# Builds the Android preview APK (arm64) so the app can be installed from a phone, no computer needed.
# On push to dev (or a manual run on dev) the APK is published to the rolling pre-release `mobile-latest`:
# the tag is moved to the built commit and the APK asset is replaced. Other assets on that release
# (the models zip) are kept. It is never marked Latest and never touches v* tags/releases (release.yml).
on:
  push:
    branches: [dev]
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]
  pull_request:
    branches: [dev]
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]
  workflow_dispatch:

permissions: {}

env:
  FLUTTER_VERSION: "3.47.6"
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  LLAMA_COMMIT: afeebe103bd99cda8f5dfaefcabadf890db7fda7
  APK_NAME: tinglongwu-mobile-arm64.apk

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (pinned NDK + cmake for the llama.cpp AAR)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
      - name: Cache the self-built llama.cpp AAR
        id: aar
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/aar-cache
          key: llama-aar-${{ env.LLAMA_COMMIT }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('mobile/tool/build_llama_android.sh') }}
      - name: Build llama.cpp AAR from source (cache miss only)
        if: steps.aar.outputs.cache-hit != 'true'
        run: |
          TLWU_BUILD_ROOT="$RUNNER_TEMP/llama" bash tool/build_llama_android.sh
          mkdir -p ~/aar-cache && cp native/llama-cpp-dart-selfbuilt.aar ~/aar-cache/
      - name: Use the CI-built AAR (not the committed binary)
        run: |
          cp ~/aar-cache/llama-cpp-dart-selfbuilt.aar native/llama-cpp-dart-selfbuilt.aar
          sha256sum native/llama-cpp-dart-selfbuilt.aar
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Without a release key, keep the same debug key between runs so a new preview installs over the
      # old one (Android refuses an update signed by a different key, and uninstalling deletes models).
      - name: Keep the CI debug signing key between runs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.android/debug.keystore
          key: mobile-debug-keystore-v1
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Release key from secrets (optional; falls back to debug signing)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TLWU_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "TLWU_SIGNING=release key" >> "$GITHUB_ENV"
          else
            echo "::notice::ANDROID_KEYSTORE_B64 not set: APK is debug-signed (CI debug key)"
            echo "TLWU_SIGNING=CI debug key (no release key configured)" >> "$GITHUB_ENV"
          fi
      - name: Build release APK (arm64)
        env:
          TLWU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TLWU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TLWU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # build number = run number, so every preview has a higher versionCode and installs as an update
        run: flutter build apk --release --target-platform android-arm64 --build-number ${{ github.run_number }}
      - name: Check the APK (no INTERNET permission, signer)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/perms.txt"
          if grep -q "android.permission.INTERNET" "$RUNNER_TEMP/perms.txt"; then echo "APK requests INTERNET"; exit 1; fi
          "$BT/apksigner" verify --print-certs "$APK" | grep -i "SHA-256" | head -1
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/$APK_NAME"
          (cd "$RUNNER_TEMP/out" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" && cat "$APK_NAME.sha256")
          echo "$TLWU_SIGNING" > "$RUNNER_TEMP/out/signing.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-apk
          path: ${{ runner.temp }}/out/
          retention-days: 14

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: mobile-latest-release
      cancel-in-progress: false
    permissions:
      contents: write   # move the mobile-latest tag and replace the APK asset
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-apk
          path: out
      - name: Publish to the rolling pre-release mobile-latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: mobile-latest
          TITLE: tinglongWu mobile (preview)
        run: |
          set -euo pipefail
          SIGNING=$(cat out/signing.txt); APK_SHA=$(cut -d' ' -f1 "out/$APK_NAME.sha256")
          cat > notes.md <<EOF
          Rolling preview of the Android app (arm64), rebuilt from \`dev\` on every change under \`mobile/\`.
          This is not a versioned release; it is replaced each time.

          **On the phone:** download \`$APK_NAME\` below, open it, allow "install unknown apps" for your browser,
          install. Then download \`tlwu-mobile-models.zip\` (if listed below) and use **Import models** in the app.
          Full steps: [mobile/README.md](https://github.com/$GH_REPO/blob/dev/mobile/README.md).

          - commit: $SHA
          - APK SHA256: \`$APK_SHA\`
          - signed with: $SIGNING
          EOF
          # Move (or create) the tag; only refs/tags/mobile-latest is touched.
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --prerelease --latest=false
            gh release upload "$TAG" "out/$APK_NAME" "out/$APK_NAME.sha256" --clobber
          else
            gh release create "$TAG" "out/$APK_NAME" "out/$APK_NAME.sha256" --verify-tag \
              --title "$TITLE" --notes-file notes.md --prerelease --latest=false
          fi
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
