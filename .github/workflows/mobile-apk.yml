name: mobile-apk
# Builds the Android preview APK (arm64) so the app can be installed from a phone, no computer needed.
# On push to dev (or a manual run on dev) the APK is published to the rolling pre-release `mobile-latest`:
# the tag is moved to the built commit and the APK asset is replaced. The release carries only the APK
# and the models zip (hashes live in the body); stray .sha256 assets are deleted; the models zip is rebuilt from official sources only when assets/models_manifest.json
# changes. It is never marked Latest and never touches v* tags/releases (release.yml).
# The same job also builds the Google Play AAB: the models ride in two fast-follow Play Asset Delivery
# packs (tool/fill_asset_packs.py) that Play downloads right after install. On dev pushes the AAB is kept as an artifact and, when the
# PLAY_SA_JSON secret and the release key exist, uploaded to the Play internal track.
# #1621 phone preview: same-repo PRs touching mobile/** also upload to the internal track (fork PRs never do).
# Runner: set the repo variable MOBILE_RUNNER=tlwu-mobile to build on the owner's home Windows runner
# [self-hosted, windows, tlwu-mobile] (warm Gradle/pub/Flutter/NDK/AAR caches on its persistent disk; Git Bash steps).
# The label can sit on the same machine as the hw runner (tlwu-hw): the two jobs then just queue one after the other.
# Unset (or any other value) = ubuntu-24.04, unchanged. Fork PRs always use ubuntu-24.04 (never the home machine).
# Limitation: GitHub cannot fall back after a queue timeout, so if the home runner is off, clear MOBILE_RUNNER.
# Windows prerequisites on that machine: Flutter, Android SDK (%LOCALAPPDATA%\Android\Sdk, or ANDROID_HOME), Git for
# Windows (bash, awk, sha256sum, base64) + `unzip`, Python (`python`; a python3 shim is added per job).
on:
  push:
    branches: [dev]
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]
  pull_request:
    branches: [dev]
    paths: ["mobile/**", ".github/workflows/mobile-apk.yml"]
  workflow_dispatch:

permissions: {}

env:
  FLUTTER_VERSION: "3.47.6"
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.22.1"
  LLAMA_COMMIT: afeebe103bd99cda8f5dfaefcabadf890db7fda7
  APK_NAME: tinglongwu-mobile-arm64.apk

jobs:
  build:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MOBILE_RUNNER == 'tlwu-mobile' && '["self-hosted","windows","tlwu-mobile"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      HAS_PLAY: ${{ secrets.PLAY_SA_JSON != '' && secrets.ANDROID_KEYSTORE_B64 != '' }}
    defaults:
      run:
        shell: bash   # -eo pipefail: a failing aapt/apksigner in a pipe fails the step
        working-directory: mobile
    steps:
      - name: Start clock
        working-directory: .   # mobile/ does not exist before checkout
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Windows runner prep (SDK location, tool check, python3 shim)
        if: runner.os == 'Windows'
        run: |
          SDK="${ANDROID_HOME:-$(cygpath -u "$LOCALAPPDATA")/Android/Sdk}"
          [ -d "$SDK" ] || { echo "Android SDK not found at $SDK (set ANDROID_HOME on the runner)"; exit 1; }
          echo "ANDROID_HOME=$(cygpath -m "$SDK")" >> "$GITHUB_ENV"
          for t in unzip awk sha256sum base64 python; do command -v "$t" > /dev/null || { echo "missing tool on the runner: $t"; exit 1; }; done
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/bin/python3"
          cygpath -m "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Decide Play upload (dev push or same-repo PR; never fork PRs)
        id: plan
        run: python3 -I ../scripts/mobile_upload_plan.py "$EVENT" "$REF" "$REPO" "$HEAD_REPO" "$HAS_PLAY" >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK packages (pinned NDK + cmake for the llama.cpp AAR)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -e "$SDKM" ] || SDKM="$SDKM.bat"
          # idempotent on a persistent disk: skip when both are already installed
          if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ] && [ -d "$ANDROID_HOME/cmake/$CMAKE_VERSION" ]; then
            echo "NDK $NDK_VERSION + cmake $CMAKE_VERSION already installed"
          else
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" --install "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" > /dev/null
          fi
      - name: Cache the self-built llama.cpp AAR
        id: aar
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/aar-cache
          key: llama-aar-${{ env.LLAMA_COMMIT }}-ndk${{ env.NDK_VERSION }}-${{ hashFiles('mobile/tool/build_llama_android.sh') }}
      - name: Build llama.cpp AAR from source (cache miss only)
        if: steps.aar.outputs.cache-hit != 'true'
        run: |
          TLWU_BUILD_ROOT="$RUNNER_TEMP/llama" bash tool/build_llama_android.sh
          mkdir -p ~/aar-cache && cp native/llama-cpp-dart-selfbuilt.aar ~/aar-cache/
      - name: Use the CI-built AAR (not the committed binary)
        run: |
          cp ~/aar-cache/llama-cpp-dart-selfbuilt.aar native/llama-cpp-dart-selfbuilt.aar
          sha256sum native/llama-cpp-dart-selfbuilt.aar
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 ../scripts/check_mobile_network.py --mobile-dir .   # #1567: network APIs only in the pack downloader
      - run: flutter analyze
      - run: flutter test
      - name: Release key from secrets (optional; falls back to debug signing)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TLWU_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "TLWU_SIGNING=release key" >> "$GITHUB_ENV"
          else
            # A fresh throwaway debug key per run: a signing key must never sit in the Actions cache,
            # which pull-request jobs can read. Updates then need an uninstall until the secrets exist.
            echo "::notice::ANDROID_KEYSTORE_B64 not set: APK is signed with a throwaway debug key"
            echo "TLWU_SIGNING=throwaway CI debug key (no release key configured yet; uninstall the old preview before installing this one)" >> "$GITHUB_ENV"
          fi
      - name: Build release APK (arm64)
        env:
          TLWU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TLWU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TLWU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # versionName = X.Y.Z-dev.<run> (#1534): shown in Settings > About, so a tester can tell builds apart
        # build number = run number, so every preview has a higher versionCode and installs as an update
        run: flutter build apk --release --target-platform android-arm64 --build-number ${{ github.run_number }} --build-name "$(python3 -I tool/mobile_version.py dev ${{ github.run_number }})"
      - name: Cache the models for the Play asset packs (keyed by the manifest)
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/models-cache
          key: play-models-${{ hashFiles('mobile/assets/models_manifest.json', 'mobile/tool/fetch_models.sh') }}
      - name: Fill the Play asset packs (official sources, checked against the manifest)
        run: |
          if [ ! -d ~/models-cache/models ]; then bash tool/fetch_models.sh ~/models-cache; fi
          python3 -I tool/fill_asset_packs.py ~/models-cache/models
          df -h . | tail -1
      - name: Build release AAB (Google Play)
        env:
          TLWU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TLWU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TLWU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --target-platform android-arm64 --build-number ${{ github.run_number }} --build-name "$(python3 -I tool/mobile_version.py dev ${{ github.run_number }})"
      - name: Check the AAB (packs present + fast-follow + sizes, INTERNET only, base under 200 MB, target API >= 36)
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          ls -l "$AAB"
          unzip -l "$AAB" | grep -E " (models_asr|models_llm)/assets/" | tee "$RUNNER_TEMP/packs.txt"
          TOTAL=0
          for p in models_asr models_llm; do
            grep -q " $p/assets/" "$RUNNER_TEMP/packs.txt" || { echo "pack $p missing"; exit 1; }
            # proto manifest keeps the delivery element name (fast-follow / on-demand / install-time) as a string
            unzip -p "$AAB" "$p/manifest/AndroidManifest.xml" > "$RUNNER_TEMP/$p.xml"
            grep -aq "fast-follow" "$RUNNER_TEMP/$p.xml" || { echo "pack $p is not fast-follow"; exit 1; }
            if grep -aqE "on-demand|install-time" "$RUNNER_TEMP/$p.xml"; then echo "pack $p has another delivery type"; exit 1; fi
            N=$(awk -v p="$p/assets/" 'index($4, p) == 1 {s += $1} END {print s+0}' "$RUNNER_TEMP/packs.txt")
            echo "$p: $N bytes"
            [ "$N" -le $((1536 << 20)) ] || { echo "pack $p over Play's 1.5 GB per-pack limit"; exit 1; }
            TOTAL=$((TOTAL + N))
          done
          [ "$TOTAL" -le $((4 << 30)) ] || { echo "packs over Play's 4 GB fast-follow total"; exit 1; }
          # proto manifest keeps permission names as plain UTF-8 strings; INTERNET is the only network permission (#1567)
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/base.xml"
          grep -aqE "android.permission.INTERNET([^A-Za-z0-9_]|$)" "$RUNNER_TEMP/base.xml" || { echo "AAB lacks INTERNET (pack download)"; exit 1; }
          if grep -aoE "android.permission.(ACCESS_NETWORK_STATE|CHANGE_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE|NEARBY_WIFI_DEVICES|CHANGE_WIFI_MULTICAST_STATE)" "$RUNNER_TEMP/base.xml"; then echo "AAB requests another network permission"; exit 1; fi
          BASE=$(unzip -Zl "$AAB" | awk '$NF ~ /^base\// {s += $6} END {print s+0}')
          echo "base module compressed bytes: $BASE"
          [ "$BASE" -lt $((200 << 20)) ] || { echo "base module over 200 MB"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          TSDK=$("$BT/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "targetSdk $TSDK"
          [ "${TSDK:-0}" -ge 36 ] || { echo "Google Play needs targetSdk >= 36"; exit 1; }
          mkdir -p "$RUNNER_TEMP/aab" && mv "$AAB" "$RUNNER_TEMP/aab/tinglongwu-mobile.aab"
      - name: Check the APK (INTERNET is the only network permission, signer)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump permissions "$APK" | tee "$RUNNER_TEMP/perms.txt"
          grep -qE "android.permission.INTERNET([^A-Za-z0-9_]|$)" "$RUNNER_TEMP/perms.txt" || { echo "APK lacks INTERNET (pack download)"; exit 1; }
          if grep -qE "android.permission.(ACCESS_NETWORK_STATE|CHANGE_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_WIFI_STATE|NEARBY_WIFI_DEVICES|CHANGE_WIFI_MULTICAST_STATE)" "$RUNNER_TEMP/perms.txt"; then echo "APK requests another network permission"; exit 1; fi
          SIGNER="$BT/apksigner"; [ -e "$SIGNER" ] || SIGNER="$BT/apksigner.bat"
          "$SIGNER" verify --print-certs "$APK" | grep -i "SHA-256" | head -1
          rm -f "$RUNNER_TEMP/release.jks"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$APK" "$RUNNER_TEMP/out/$APK_NAME"
          (cd "$RUNNER_TEMP/out" && sha256sum "$APK_NAME" > "$APK_NAME.sha256" && cat "$APK_NAME.sha256")   # build-internal; not uploaded to the release
          echo "$TLWU_SIGNING" > "$RUNNER_TEMP/out/signing.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-apk
          path: ${{ runner.temp }}/out/
          retention-days: 14
      # The first AAB of a new Play app must be uploaded by hand in Play Console: take it from here.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name != 'pull_request'
        with:
          name: mobile-aab
          path: ${{ runner.temp }}/aab/
          retention-days: 7
          compression-level: 0
      - name: Upload to Google Play (internal track)
        if: steps.plan.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SA_JSON }}
          packageName: com.tinglongwu.mobile
          releaseFiles: ${{ runner.temp }}/aab/tinglongwu-mobile.aab
          track: internal
          # "draft" until the app has had its first release in Play Console; then set the repo
          # variable PLAY_RELEASE_STATUS=completed so internal testers get builds automatically.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
      - name: Build minutes (#1621)
        if: always()
        run: |
          M=$(( ($(date +%s) - BUILD_START) / 60 ))
          echo "### mobile build: ${M} min on runner \`${{ runner.name }}\` (${{ runner.environment }}), upload=${{ steps.plan.outputs.upload }}, versionCode=${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: mobile-latest-release
      cancel-in-progress: false
    permissions:
      contents: write   # move the mobile-latest tag and replace the APK asset
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mobile-apk
          path: out
      - name: Publish to the rolling pre-release mobile-latest
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: mobile-latest
          TITLE: tinglongWu mobile (preview)
          ZIP: tlwu-mobile-models.zip
        run: |
          set -euo pipefail
          SIGNING=$(cat out/signing.txt); APK_SHA=$(cut -d' ' -f1 "out/$APK_NAME.sha256")
          BASE="https://github.com/$GH_REPO/releases/download/$TAG"
          OLD_BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)
          # Carry over the models zip hash + manifest marker (kept in the body, not as .sha256 assets).
          ZIP_SHA=$(printf '%s\n' "$OLD_BODY" | sed -n 's/^- models zip SHA256: `\([0-9a-f]*\)`.*/\1/p' | head -1 || true)
          MANIFEST=$(printf '%s\n' "$OLD_BODY" | sed -n 's/.*<!-- tlwu-manifest:\([0-9a-f]*\) -->.*/\1/p' | head -1 || true)
          if [ -z "$MANIFEST" ] && gh release download "$TAG" -p "$ZIP.sha256" -O "$RUNNER_TEMP/old.sha256" 2>/dev/null; then
            ZIP_SHA=$(sed -n '1s/ .*//p' "$RUNNER_TEMP/old.sha256")
            MANIFEST=$(sed -n 's/^manifest //p' "$RUNNER_TEMP/old.sha256" | head -1)
          fi
          # optional pack markers (tool/make_packs.py stale/mark) survive the rewrite of the notes
          PACK_MARKS=$(printf '%s\n' "$OLD_BODY" | grep -o '<!-- tlwu-pack:[A-Za-z0-9_-]*:[0-9a-f]* -->' || true)
          cat > notes.md <<EOF
          **1. Install the app:** [$APK_NAME]($BASE/$APK_NAME)

          **2. Get the translation pack (1.4 GB, once):** [$ZIP]($BASE/$ZIP)

          Open the app, tap **Import models**, pick the zip.

          Installed from Google Play instead? Nothing to import: Play downloads the models right after install.

          <details>
          <summary>Details</summary>

          Rolling preview of the Android app (arm64), rebuilt from \`dev\` on every change under \`mobile/\`.
          This is a preview, not a versioned release; it is replaced each time.
          Full steps: [mobile/README.md](https://github.com/$GH_REPO/blob/dev/mobile/README.md)

          - commit: $SHA
          - signed with: $SIGNING
          - APK SHA256: \`$APK_SHA\`
          - models zip SHA256: \`$ZIP_SHA\`
          - optional 對話翻譯 packs (Import models): [tlwu-voice-en.zip]($BASE/tlwu-voice-en.zip), [tlwu-voice-ru.zip]($BASE/tlwu-voice-ru.zip), [tlwu-mobile-lang-ru.zip]($BASE/tlwu-mobile-lang-ru.zip)
          <!-- tlwu-manifest:$MANIFEST -->

          </details>
          EOF
          # Never replace a newer preview with an older run (lower versionCode = not installable as an
          # update). The published run number is kept in the release notes; checked under the lock above.
          RUN=${{ github.run_number }}
          PUBLISHED=$(gh release view "$TAG" --json body --jq .body 2>/dev/null | sed -n 's/.*<!-- tlwu-run:\([0-9]*\) -->.*/\1/p' | head -1 || true)
          if [ -n "$PUBLISHED" ] && [ "$RUN" -lt "$PUBLISHED" ]; then
            echo "::notice::mobile-latest already has run $PUBLISHED (newer than $RUN); not publishing"
            echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "<!-- tlwu-run:$RUN -->" >> notes.md
          [ -z "$PACK_MARKS" ] || printf '%s\n' "$PACK_MARKS" >> notes.md
          # Move (or create) the tag; only refs/tags/mobile-latest is touched.
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" > /dev/null
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # assets first, then the notes (which carry the run marker), so a failed upload is retried
            gh release upload "$TAG" "out/$APK_NAME" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$TAG" "out/$APK_NAME" --verify-tag \
              --title "$TITLE" --notes-file notes.md --prerelease --latest=false
          fi
          # drop the old separate .sha256 assets only after the notes (which now carry the hashes) are saved
          gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".sha256"))' | while read -r n; do
            gh release delete-asset "$TAG" "$n" --yes
          done
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[].name)'
      - name: Models zip on mobile-latest (rebuilt from official sources only when the manifest changes)
        if: steps.apk.outputs.stale != 'true'   # an older run must not replace a newer bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: mobile-latest
        run: |
          set -euo pipefail
          Z=tlwu-mobile-models.zip; W="$RUNNER_TEMP/models"
          MH=$(sha256sum mobile/assets/models_manifest.json | cut -d' ' -f1)
          gh release view "$TAG" --json body,assets --jq '.body' > "$RUNNER_TEMP/body.md"
          HAVE_ZIP=$(gh release view "$TAG" --json assets --jq "[.assets[].name | select(. == \"$Z\")] | length")
          if [ "$HAVE_ZIP" = 1 ] && grep -q "<!-- tlwu-manifest:$MH -->" "$RUNNER_TEMP/body.md"; then
            echo "$Z is up to date (manifest $MH)"; exit 0
          fi
          bash mobile/tool/fetch_models.sh "$W"
          python3 -I mobile/tool/make_models_zip.py "$W/models" "$W/licenses" "$RUNNER_TEMP/$Z"
          ZSHA=$(sha256sum "$RUNNER_TEMP/$Z" | cut -d' ' -f1)
          gh release upload "$TAG" "$RUNNER_TEMP/$Z" --clobber
          # record hash + manifest in the body (marks the zip current), after the zip is uploaded
          sed -i -e "s/^- models zip SHA256: .*/- models zip SHA256: \`$ZSHA\`/"                  -e "s/<!-- tlwu-manifest:[0-9a-f]* -->/<!-- tlwu-manifest:$MH -->/" "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          gh release view "$TAG" --json assets --jq '.assets[] | .name + " " + (.size|tostring)'
      - name: Optional packs on mobile-latest (voice-en / voice-ru / lang-ru, rebuilt only when their voice_packs.json entry changes)
        if: steps.apk.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: mobile-latest
        run: |
          set -euo pipefail
          gh release view "$TAG" --json body --jq '.body' > "$RUNNER_TEMP/body.md"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          # shellcheck disable=SC2086
          STALE=$(python3 -I mobile/tool/make_packs.py stale "$RUNNER_TEMP/body.md" $ASSETS)
          if [ -z "$STALE" ]; then echo "optional packs are up to date"; exit 0; fi
          echo "rebuilding: $STALE"
          # shellcheck disable=SC2086
          python3 -I mobile/tool/make_packs.py "$RUNNER_TEMP/packsrc" "$RUNNER_TEMP/packs" $STALE
          gh release upload "$TAG" "$RUNNER_TEMP"/packs/tlwu-*.zip --clobber
          # markers after the upload, so a failed upload is retried on the next run
          gh release view "$TAG" --json body --jq '.body' > "$RUNNER_TEMP/body.md"
          # shellcheck disable=SC2086
          python3 -I mobile/tool/make_packs.py mark "$RUNNER_TEMP/body.md" $STALE
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/body.md"
          gh release view "$TAG" --json assets --jq '.assets[] | .name + " " + (.size|tostring)'
