name: mobile-release
# Mobile release lane (#1534), part 2: DRY RUN ONLY. Prints which internal build, versionName and notes
# would be promoted to Play production. It never calls the Play API; promotion and the staged rollout
# are a later part. Kill switch: repo variable MOBILE_AUTO_RELEASE must be 'true' for the plan to pass.
# Part 3 (#1598): `lane` job = the mobile good tag. On a release/vX.Y.Z snapshot it runs flutter analyze +
# flutter test, then scripts/mobile_lane.py decides tag `mobile-vX.Y.Z` + Play track `alpha`. Independent of the
# desktop lanes (nothing here is a required check of vX.Y.Z). Production is never automatic. The AAB build/upload
# step is the next part: until it exists the aab gate is reported as `not-built`, so no tag is created and nothing
# is uploaded (decision is printed only).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Lane job: only print the decision (no tag, no upload)"
        type: boolean
        default: true
  push:
    branches: ["release/v*"]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  actions: read

jobs:
  plan:
    if: github.event_name != 'push' && !startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Plan (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
          MOBILE_AUTO_RELEASE: ${{ vars.MOBILE_AUTO_RELEASE }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/mobile-apk.yml/runs?branch=dev&status=completed&per_page=30" > "$RUNNER_TEMP/runs.json"
          cd mobile
          set +e
          python3 -I tool/mobile_release_plan.py "$RUNNER_TEMP/runs.json" --auto "${MOBILE_AUTO_RELEASE:-false}" --head-sha "$(git rev-parse HEAD)"
          rc=$?
          [ "$rc" -le 1 ] || { echo "planner error (exit $rc)"; exit "$rc"; }
          echo "dry run only: nothing was promoted (exit $rc: 0 = would promote, 1 = blocked)"

  lane:
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # push the mobile-vX.Y.Z tag (skipped on dry runs)
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true
      - run: flutter pub get
      - id: analyze
        continue-on-error: true
        run: flutter analyze
      - id: test
        continue-on-error: true
        run: flutter test
      - name: Decide the mobile lane
        id: decide
        env:
          BRANCH: ${{ github.ref_name }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TEST: ${{ steps.test.outcome }}
        run: |
          [[ "$BRANCH" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad branch"; exit 1; }
          last="$(git tag --list 'mobile-v*' --sort=-v:refname | head -1)"
          flag=""; [ "$DRY" = "true" ] && flag="--dry-run"
          set +e
          python3 -I ../scripts/mobile_lane.py --branch "$BRANCH" --analyze "$ANALYZE" --test "$TEST" \
            --aab not-built --last-tag "$last" $flag
          rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
          echo "AAB build + alpha upload + tag come with the next part; nothing was tagged or uploaded."
