name: llama-wheel-mac
# #1356 (parent #1341): the pinned llama-cpp-python has no usable macOS arm64 wheel upstream (#420: the index wheel is
# a corrupt zip), so every Mac install compiled the sdist (145-211 s). This workflow compiles that sdist once, on a
# GitHub Apple Silicon runner, checks the wheel in a clean venv and publishes it with SHA256SUMS.txt on the
# pre-release `wheels-llama-cpp-python-<version>`. `tlwu_install_llama` (scripts/tlwu_common.sh) takes it from there
# and still builds from source when it is missing or does not verify.
#   - The version is the pin in requirements/requirements-llama-cpu.txt, read through scripts/tlwu_common.sh (the installer reads
#     the same functions); the tag prefix and the checksum file name live there too.
#   - A pre-release with a non-`v` tag: never `latest`, not a version release, ignored by the release lane
#     (scripts/release_notes.py reads `v*` tags only).
#   - Runs when the pin (or this file) changes and on workflow_dispatch. A wheel that is already published is kept
#     (its SHA256 stays stable); `force` on a dispatch rebuilds and replaces it.
# Nothing waits for this workflow: no merge or release depends on it.
on:
  push:
    paths: ['requirements/requirements-llama-cpu.txt', '.github/workflows/llama-wheel-mac.yml']
  workflow_dispatch:
    inputs:
      force:
        description: "rebuild and replace the wheel even when this version is already published"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: llama-wheel-mac-${{ github.ref }}
  cancel-in-progress: false

env:
  REQ: requirements/requirements-llama-cpu.txt
  # Wheel tag macosx_11_0_arm64 (as the upstream wheel): installs on macOS 11+, not only on the runner's macOS.
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  # The installer's source build uses llama.cpp's defaults (Metal on, CPU flags of the machine it runs on). A wheel
  # for every Apple Silicon Mac cannot use "this machine": fix the CPU baseline at the M1 instead of -mcpu=native.
  WHEEL_CMAKE_ARGS: "-DGGML_NATIVE=OFF -DCMAKE_C_FLAGS=-mcpu=apple-m1 -DCMAKE_CXX_FLAGS=-mcpu=apple-m1"
  WHEEL_PLATFORM_TAG: macosx_11_0_arm64

jobs:
  build:
    runs-on: macos-latest   # Apple Silicon (arm64)
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Plan (pin from the requirements file; skip a version that is already published)
        id: plan
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          . scripts/tlwu_common.sh
          [ "$(uname -m)" = arm64 ] || { echo "::error::runner is $(uname -m), not arm64"; exit 1; }
          pin="$(tlwu_llama_pin "$REQ")"; version="$(tlwu_llama_version "$REQ")"; tag="$(tlwu_llama_wheel_tag "$REQ")"
          [ -n "$pin" ] && [ -n "$version" ] || { echo "::error::no $TLWU_LLAMA_PKG pin in $REQ"; exit 1; }
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$TLWU_LLAMA_WHEEL_SUMS"
          build=true
          if [ "$FORCE" != "true" ] && curl -fsSL --retry 2 -o "$RUNNER_TEMP/published.txt" "$url" \
              && grep -q "$WHEEL_PLATFORM_TAG.whl" "$RUNNER_TEMP/published.txt"; then
            build=false
            echo "already published, kept: $(cat "$RUNNER_TEMP/published.txt")" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          { echo "pin=$pin"; echo "version=$version"; echo "tag=$tag"; echo "build=$build"; echo "sums=$TLWU_LLAMA_WHEEL_SUMS"; } >> "$GITHUB_OUTPUT"
          echo "pin=$pin tag=$tag build=$build"
      - name: Build the wheel from the PyPI sdist
        if: steps.plan.outputs.build == 'true'
        env:
          PIN: ${{ steps.plan.outputs.pin }}
        run: |
          set -euo pipefail
          . scripts/tlwu_common.sh
          python -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install -q --upgrade pip
          t0=$SECONDS
          CMAKE_ARGS="$WHEEL_CMAKE_ARGS" CMAKE_BUILD_PARALLEL_LEVEL="$(tlwu_ncpu)" \
            "$RUNNER_TEMP/build-venv/bin/python" -m pip wheel --no-deps --no-binary "$TLWU_LLAMA_PKG" -w dist "$PIN"
          echo "build: $((SECONDS - t0)) s" | tee -a "$GITHUB_STEP_SUMMARY"
          ls -l dist
          n=$(ls dist/*.whl | wc -l | tr -d ' ')
          [ "$n" = 1 ] || { echo "::error::expected 1 wheel, got $n"; exit 1; }
          ls dist/*"-$WHEEL_PLATFORM_TAG.whl" >/dev/null || { echo "::error::wheel is not tagged $WHEEL_PLATFORM_TAG"; exit 1; }
      - name: Verify (zip intact, installs and imports in a clean venv, Metal build, what the installer does)
        if: steps.plan.outputs.build == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SUMS: ${{ steps.plan.outputs.sums }}
        run: |
          set -euo pipefail
          . scripts/tlwu_common.sh
          whl="$(ls dist/*.whl)"
          python -c "import sys, zipfile; bad = zipfile.ZipFile(sys.argv[1]).testzip(); sys.exit(f'corrupt member: {bad}' if bad else 0)" "$whl"   # 420
          ( cd dist && shasum -a 256 -- *.whl > "$SUMS" && cat "$SUMS" )
          # 1) plain pip in a clean venv
          python -m venv "$RUNNER_TEMP/clean-venv"
          "$RUNNER_TEMP/clean-venv/bin/python" -m pip install -q --upgrade pip
          "$RUNNER_TEMP/clean-venv/bin/python" -m pip install "$whl"
          ( cd "$RUNNER_TEMP" && VERSION="$VERSION" "$RUNNER_TEMP/clean-venv/bin/python" - <<'PY'
          import os
          import llama_cpp
          assert llama_cpp.__version__ == os.environ["VERSION"], llama_cpp.__version__
          info = llama_cpp.llama_print_system_info().decode()
          print(info)
          assert llama_cpp.llama_supports_gpu_offload(), "not a Metal build"
          print("PASS: import, version", llama_cpp.__version__, "Metal offload available")
          PY
          )
          # 2) the installer's own function against these files (file:// instead of the release URL)
          tag="$(tlwu_llama_wheel_tag "$REQ")"
          mkdir -p "$RUNNER_TEMP/rel/$tag" && cp dist/*.whl "dist/$SUMS" "$RUNNER_TEMP/rel/$tag/"
          python -m venv "$RUNNER_TEMP/installer-venv"
          TLWU_LLAMA_WHEEL_BASE="file://$RUNNER_TEMP/rel" tlwu_install_llama_prebuilt "$RUNNER_TEMP/installer-venv/bin/python" "$REQ"
          "$RUNNER_TEMP/installer-venv/bin/python" -m pip show "$TLWU_LLAMA_PKG" | grep -i '^version'
          {
            echo "### llama-cpp-python $VERSION wheel (macOS arm64)"
            echo '```'
            cat "dist/$SUMS"
            echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET CMAKE_ARGS=$WHEEL_CMAKE_ARGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.plan.outputs.build == 'true'
        with:
          name: llama-wheel-mac-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write   # the pre-release, its tag and its assets
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: llama-wheel-mac-arm64
          path: dist
      - name: Publish on the pre-release (never `latest`)
        run: |
          set -euo pipefail
          ( cd dist && sha256sum -c -- *.txt )
          {
            echo "Prebuilt \`llama-cpp-python\` wheel for the macOS (Apple Silicon) installer. **Not an app release.**"
            echo
            echo "Built from the PyPI sdist of the version pinned in \`requirements/requirements-llama-cpu.txt\` by \`llama-wheel-mac.yml\`:"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (commit \`${GITHUB_SHA::7}\`)."
            echo "\`MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET\`, \`CMAKE_ARGS=$WHEEL_CMAKE_ARGS\` (Metal on, CPU baseline Apple M1)."
            echo "\`mac_install.sh\` downloads the wheel, checks it against \`SHA256SUMS.txt\` and builds from source when that fails."
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.whl
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.txt
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md --prerelease --latest=false
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$TAG (installer dependency, not an app release)" --notes-file notes.md dist/*.whl dist/*.txt
          fi
          echo "published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
