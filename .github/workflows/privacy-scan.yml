name: privacy-scan
# #1405: keep personal data and secrets out of this public repo. Built-in patterns (emails, phones, IDs, card
# numbers, API keys) need no secret; the optional repo secret TLWU_DENYLIST adds private words. The list is passed
# only as an env var to scripts/privacy_scan.py, which never prints, caches or uploads it or any matched value.
# PR code is never checked out or run here: the PR job reads the diff through the API with the BASE branch's script.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issues:
    types: [opened, edited]
  schedule:
    - cron: "7,37 * * * *"   # #1551: comments of every author start no per-event run; this schedule scans them (last 90 min)
  workflow_dispatch:
    inputs:
      sweep:
        description: "One-time sweep: tracked files + every issue/PR body and comment (prints counts and links only)"
        type: boolean
        default: false

permissions: {}

jobs:
  privacy-scan:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write   # only to post the `privacy-scan` result on the PR head (its check run lands on the base)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (base branch, not the PR head)
        with:
          persist-credentials: false
      - name: Added lines of the PR (fails on a hit; built-in patterns only when TLWU_DENYLIST is not set)
        env:
          TLWU_DENYLIST_TEXT: ${{ secrets.TLWU_DENYLIST }}
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # the result also goes to a commit status `privacy-scan` on the PR head: ci.yml `test` waits for it on fork PRs
        run: python scripts/privacy_scan.py pr --pr "$PR" --report-status privacy-scan
      - name: PR title and body (masked in place on a hit)
        if: always() && (github.event.action == 'opened' || github.event.action == 'edited')
        env:
          TLWU_DENYLIST_TEXT: ${{ secrets.TLWU_DENYLIST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/privacy_scan.py event --name pull_request_target --path "$GITHUB_EVENT_PATH"

  privacy-event:
    # #1551: only issue bodies keep a per-event scan; comments (any author) are swept by the scheduled `privacy-recent` run
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Hide or mask a hit
        env:
          TLWU_DENYLIST_TEXT: ${{ secrets.TLWU_DENYLIST }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: python scripts/privacy_scan.py event --name "$EVENT" --path "$GITHUB_EVENT_PATH"

  privacy-recent:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.sweep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan comments created or edited in the last 90 minutes (one dropped scheduled run is still covered)
        env:
          TLWU_DENYLIST_TEXT: ${{ secrets.TLWU_DENYLIST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/privacy_scan.py recent --minutes 90

  privacy-sweep:
    if: github.event_name == 'workflow_dispatch' && inputs.sweep
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Sweep
        env:
          TLWU_DENYLIST_TEXT: ${{ secrets.TLWU_DENYLIST }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/privacy_scan.py sweep
