name: extension-spike
# #1158 (Chrome extension part 1, parent #711): browser-size ASR + MT candidates in headless Chromium (WASM, CPU),
# on the 20 CI smoke clips (eval/ci_smoke.json). scripts/bench/extension_spike.py writes the table: download size,
# load time, per-utterance ASR+MT latency median/p90, chrF per pair next to the desktop baseline, ASR CER/WER.
# Runs on GitHub-hosted runners because the cloud agent sandbox cannot reach the model hub.
# Only runs when the spike changes, or by hand (workflow_dispatch, once on the default branch). Not a merge gate.
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/extension-spike.yml
      - scripts/bench/extension_spike.py
      - web/extension/spike/**
  workflow_dispatch:
    inputs:
      limit:
        description: "first N clips per language (0 = all 5)"
        default: "0"

permissions:
  contents: read

concurrency:
  group: extension-spike-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  PYTHONUTF8: "1"
  LIMIT: ${{ inputs.limit || '0' }}

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        asr: [whisper-tiny, whisper-base, whisper-small]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu (zh_convert, smoke clip tool) + Playwright
        run: |
          pip install -e .
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: transformers.js + ONNX Runtime Web (local, like an extension)
        working-directory: web/extension/spike
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: eval_data/smoke
          key: smoke-clips-v1-${{ hashFiles('eval/ci_smoke.json', 'scripts/bench/make_ci_smoke.py') }}
      - name: Smoke clips (FLEURS, pinned by sha256 in eval/ci_smoke.json)
        run: |
          if [ -f eval_data/smoke/manifest.jsonl ]; then echo "cached"; else python scripts/bench/make_ci_smoke.py --out eval_data/smoke; fi
      - name: Run spike (${{ matrix.asr }} + every MT candidate)
        run: |
          python scripts/bench/extension_spike.py --data eval_data/smoke --asr "${{ matrix.asr }}" --limit "$LIMIT" \
            --runner "GitHub ubuntu-24.04 ($(nproc) vCPU)" --out "spike-${{ matrix.asr }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-${{ matrix.asr }}
          path: spike-${{ matrix.asr }}.json
          if-no-files-found: warn

  report:
    needs: spike
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: spike-*
          merge-multiple: true
      - name: Table
        run: |
          python3 scripts/bench/extension_spike.py --merge spike-*.json --md spike.md --json spike.json
          { echo "## Chrome extension spike (#1158)"; echo; cat spike.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-spike-report
          path: |
            spike.md
            spike.json
