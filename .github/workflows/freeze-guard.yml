name: freeze-guard
# #953: while a release freeze is on (rules section 14), a PR into dev fails this check unless its body says
# `release-fix`, so the "every check green" merge rule stops mergers mechanically. Runs the base-branch script
# (never PR head code). Limit: the result is computed when the PR event fires; re-run it (or push) after a
# freeze starts or ends.
on:
  pull_request_target:
    branches: [dev]
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  freeze-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: release freeze?
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python scripts/release_freeze.py check --pr "$PR"
