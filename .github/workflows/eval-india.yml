name: eval-india
# #620: Indian speakers -> Chinese subtitles. Same Whisper + Hy-MT2-1.8B (Q4_K_M, llama.cpp) on the CPU for
# FLEURS en_us (US English), FLEURS hi_in (Hindi, the same FLoRes sentences; direct hi->zh and pivot hi->en->zh)
# and Svarah (Indian-accented English). Runs on GitHub-hosted CPU runners because the cloud agent sandbox cannot
# reach the model / data hosts. Per-clip JSON + the report table are uploaded as artifacts; the step summary has it.
# Only runs when this workflow or the runner script changes, or by hand (workflow_dispatch, once on the default branch).
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/eval-india.yml
      - scripts/bench/india_eval.py
  workflow_dispatch:
    inputs:
      n:
        description: "clips per group"
        default: "50"
      whisper:
        description: "Whisper size"
        default: "large-v3-turbo"

permissions:
  contents: read

concurrency:
  group: eval-india-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  TLWU_HYMT_TEMP: "0"  # greedy: repeatable numbers
  PYTHONUTF8: "1"
  N: ${{ inputs.n || '50' }}
  WHISPER: ${{ inputs.whisper || 'large-v3-turbo' }}

jobs:
  group:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [en, hi, svarah]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu + Hy-MT2 CPU engine + pyarrow
        run: |
          pip install -e .
          pip install -r requirements-llama-cpu.txt --only-binary=:all:
          pip install pyarrow==18.1.0
      - name: Paths
        run: |
          echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
          echo "DATA=$HOME/india" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/tlwu-models
          key: eval-india-models-v1-${{ env.WHISPER }}-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py') }}
      - name: Models (Hy-MT2 1.8B + Whisper)
        run: tlwu-setup --hymt --whisper "$WHISPER" --models-dir "$TLWU_MODELS"
      - name: Fetch clips
        run: python scripts/bench/india_eval.py fetch --group ${{ matrix.group }} --data "$DATA" --n "$N"
      - name: ASR + MT (CPU)
        run: python scripts/bench/india_eval.py run --group ${{ matrix.group }} --data "$DATA" --out out --whisper "$WHISPER"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: india-${{ matrix.group }}
          path: out/
          if-no-files-found: warn

  report:
    needs: group
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install sacrebleu==2.6.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: india-*
          path: out
          merge-multiple: true
      - name: Report
        run: |
          python scripts/bench/india_eval.py report out | tee report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          cp report.md out/report.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: india-report
          path: out/
