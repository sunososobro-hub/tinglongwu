name: close-on-merge
# Close the issue a merged fix/N PR says it closes (`Closes #N`); merges into dev never auto-close (no AI, #1733).
# pull_request_target so fork PRs get a write token; it checks out the BASE branch only and never runs PR code.
on:
  pull_request_target:
    types: [closed]
    branches: [dev]

permissions:
  issues: write
  contents: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: dev  # base code only; this file itself runs from main (pull_request_target)
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Close linked issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python -I scripts/close_on_merge.py
