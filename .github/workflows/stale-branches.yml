name: stale-branches
# #344: delete branches whose PRs are all closed/merged, and old branches with no PR and nothing beyond dev.
# Rules live in scripts/stale_branches.py (main, dev, gh-pages, open-PR and status:doing lock branches are kept).
on:
  schedule:
    - cron: "41 3 * * 1"   # weekly, Monday 03:41 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "only list what would be deleted"
        type: boolean
        default: true

permissions:
  contents: write        # delete branch refs
  pull-requests: read
  issues: read

concurrency:
  group: stale-branches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEEP: ""   # allowlist: comma-separated extra branch names never to delete
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Prune stale branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          python scripts/stale_branches.py --repo "${{ github.repository }}" --keep "$KEEP" \
            $([ "$DRY" = "true" ] && echo --dry-run)
