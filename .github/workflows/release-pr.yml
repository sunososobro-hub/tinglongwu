name: release-pr
# #414: when `ci` passes on a push to dev, open (or update) the one dev -> main release PR with generated notes.
# Merging that PR is the owner's single release action; release.yml then builds and publishes.
# workflow_run runs the workflow file from the default branch; it checks out dev (trusted: merged work only),
# never PR head code. Needs the repo setting "Allow GitHub Actions to create and approve pull requests" to create
# the PR; without it the job prints the PR it would open into the job summary and fails.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "only write the PR title/body into the job summary"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: read   # the thanks list reads issue authors
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'dev' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Is dev ahead of main?
        id: diff
        run: |
          git fetch --no-tags origin main dev
          n=$(git rev-list --count origin/main..origin/dev)
          echo "ahead=$n" >> "$GITHUB_OUTPUT"
          echo "dev is $n commit(s) ahead of main" >> "$GITHUB_STEP_SUMMARY"
      - name: Title and notes
        if: steps.diff.outputs.ahead != '0'
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          existing=$(gh pr list --base main --head dev --state open --json number,title --jq '.[0] // empty')
          num=$(jq -r '.number // empty' <<<"$existing")
          title=$(jq -r '.title // empty' <<<"$existing")
          # keep a version the owner typed into the title; otherwise the next one
          ver=$(python scripts/release_notes.py version --title "$title")
          python scripts/release_notes.py notes --version "$ver" --out notes.md
          {
            echo
            echo "---"
            echo "Merging this PR releases \`$ver\` (edit the title to change the version). The \`release\` workflow"
            echo "then tags \`main\`, builds the Windows zip on windows-latest (CPU-only runner), runs check_dist_dlls,"
            echo "\`--smoke\` and \`--selftest\`, and publishes the GitHub Release (latest)."
            echo "If you tested the GPU build of this commit on your PC, add the label \`gpu-validated-locally\` before merging."
            echo
            echo "Generated by release-pr.yml (#414) from dev $(git rev-parse --short HEAD)."
          } >> notes.md
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "title=release: $ver" >> "$GITHUB_OUTPUT"
          { echo "### release: $ver (PR ${num:-new})"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the release PR
        if: steps.diff.outputs.ahead != '0' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ steps.notes.outputs.num }}
          TITLE: ${{ steps.notes.outputs.title }}
        run: |
          if [ -n "$NUM" ]; then
            gh pr edit "$NUM" --title "$TITLE" --body-file notes.md
          else
            gh pr create --base main --head dev --title "$TITLE" --body-file notes.md
          fi
