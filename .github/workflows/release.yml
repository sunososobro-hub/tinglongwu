name: release
# #414 one-click release: auto-release.yml merges the `release: vX.Y.Z` PR (opened by release-pr.yml), then
#   plan              : only a merged release PR publishes: head `release/vX.Y.Z` (#976 snapshot of the dev bump
#                       commit) or, during the #976 transition, the legacy `dev`. Its title must be
#                       v<tinglongwu.__version__>, a tag that exists already must point at this commit, and every
#                       REQUIRED_CHECKS workflow (ci, e2e, windows-build, hw-tests, audio-routing) must be green on the
#                       PR's head commit = the snapshot head, newest run per workflow (scripts/release_notes.py plan).
#                       Other pushes: nothing.
#   windows           : build tinglongwu-win64.zip, the slim core (#762: build_windows.py --core, CPU llama, no
#                       cuda_libs/), then scripts/release_check.py (core budget: <= 300 MB, no CUDA files) and
#                       release/packaging/release_check.py on the zip: < 2 GiB, check_dist_dlls, llama CPU
#                       instructions (no AVX-512), --smoke, --selftest; render the release notes; report the
#                       job time against scripts/release_check.py CORE_JOB_BUDGET_MIN (a warning, never a failure)
#   vulkan-pack       : parallel to windows (#800): compile llama-cpp-python with GGML_VULKAN=on (same pin as the CPU build),
#                       pack llama_cpp/lib with scripts/make_vulkan_pack.py as tlwu-vulkan-pack-<version>.zip, check that
#                       mt_backend.vulkan_pack_dir() accepts it. continue-on-error and capped at the core job budget: the
#                       optional pack never blocks or delays a release (a timeout only drops the asset)
#   vulkan-pack-linux : (#1198) the same on ubuntu-24.04: GGML_VULKAN=on build -> tlwu-vulkan-pack-linux-<version>.zip
#                       (libllama.so + libggml-vulkan.so, glibc >= 2.39), then make_vulkan_pack.py --smoke lists the
#                       Vulkan devices under Mesa lavapipe (a software GPU). Same budget / continue-on-error rules
#   gpu-pack          : (#764, parallel with windows: needs plan only) build tinglongwu-gpu-pack.zip + its
#                       .manifest.json from the CUDA wheels, no Nuitka (build_windows.py --gpu-pack-only, #763);
#                       scripts/release_check.py --gpu-pack checks it against its manifest and the release tag
#   release           : tag main, create a draft Release with the core zip, the GPU pack + manifest, the Vulkan pack (when built), install scripts
#                       and SHA256SUMS.txt; report the release wall time against RELEASE_BUDGET_MIN (a warning);
#                       #26: GitHub build provenance (actions/attest-build-provenance) for every published asset
#   windows-installer : build the setup wizard from the core zip (#772: --core-dir; also on a dry run, with its
#                       size vs WIZARD_MAX_MB), attest its provenance (#26), attach it and publish (it becomes `latest`)
# workflow_dispatch = dry run on any branch: plan + build + every check + notes in the summary, never a tag/Release.
# #589: workflow_dispatch on main with publish=true (sent by auto-release.yml after it merged the release PR with the
# workflow token, which fires no push) is treated like that push: same plan gates, then build and publish.
# Pre-release tag (#112): pushing vX.Y.Z-suffix (e.g. v1.2.3-beta.1) on a commit on main or dev publishes a
# pre-release (never `latest`) through the same jobs. Its version must equal __version__ and ci, e2e, windows-build
# and hw-tests must be green on the tagged commit. A plain vX.Y.Z tag starts nothing; only the release PR makes one.
on:
  push:
    branches: [main]
    tags: ["v*-*"]   # pre-release tags only (#112); see the branch check in plan
  workflow_dispatch:
    inputs:
      publish:
        description: "on main only: publish the merged release PR at the main tip (auto-release.yml); else a dry run"
        type: boolean
        default: false

permissions: {}

concurrency:
  # one publish at a time; dry runs queue apart so a pending release run is never replaced by a dry run
  # only a publishing dispatch (publish=true on main, as plan() decides) shares the publish group
  group: release-${{ github.event_name == 'workflow_dispatch' && !(inputs.publish && github.ref == 'refs/heads/main') && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # which PR this main commit belongs to
      actions: read         # required workflow runs on the released commit
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
      pr: ${{ steps.plan.outputs.pr }}
      head: ${{ steps.plan.outputs.head }}
      hw_run: ${{ steps.plan.outputs.hw_run }}
      hw_deferred: ${{ steps.plan.outputs.hw_deferred }}   # #848
      platforms: ${{ steps.plan.outputs.platforms }}   # #1596: e.g. "mac=ok linux=skip"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag format and branch check (vX.Y.Z must be on main; a vX.Y.Z-suffix pre-release may be on main or dev)
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
          # a pre-release (v1.2.3-beta.1) is cut from dev before dev is merged to main (#112); it is
          # created with --prerelease below, so it never becomes `latest`. Plain vX.Y.Z stays main-only.
          branches=(main); [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]] && branches=(main dev)
          git fetch --no-tags origin "${branches[@]}"
          on=
          for b in "${branches[@]}"; do git merge-base --is-ancestor "$GITHUB_SHA" "origin/$b" && on=$b && break; done
          [ -n "$on" ] || { echo "tag $TAG is not on ${branches[*]}"; exit 1; }
          echo "tag $TAG is on $on"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          python scripts/release_notes.py plan > plan.txt
          cat plan.txt >> "$GITHUB_OUTPUT"
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: read   # release notes: merged PRs, thanks list, What's new of the release PR
      issues: read
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Build folders outside the checkout (absolute; upload-artifact rejects '..' in paths)
        shell: pwsh
        run: |
          "TLWU_BUILD_ROOT=$env:RUNNER_TEMP\tlwu-build" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # first step = job start, for the job time line at the end (#762)
          "TLWU_JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # tags: the notes list changes since the previous one
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runtime layer cache (restore)
        id: runtime
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}\tlwu-build\runtime
          # #923: the same key as windows-build.yml (one cache family for the runtime layer: Python + third-party
          # packages + tlwu.exe). A run reads caches of its own branch and of the default branch (main), so a release
          # on main restores the layer of the previous release. build_windows.py compares the restored layer's recorded
          # key with runtime_layer.key() and rebuilds it on a mismatch; the release checks below then test the zip.
          key: tlwu-runtime-${{ runner.os }}-py312-lite-${{ hashFiles('requirements*.txt', 'release/packaging/build_windows.py', 'release/packaging/runtime_layer.py', 'release/packaging/launcher/**', 'release/packaging/stubs/**', 'src/ui/tinglongwu/gui/assets/tinglongwu.ico') }}
      - name: Build the slim core zip (--core, CPU llama, no cuda_libs/; GPU libraries ship apart, see issue 740)
        shell: pwsh
        run: |
          python release\packaging\build_windows.py --core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Core zip budget (scripts/release_check.py, MAX_CORE_MB, no CUDA files)
        shell: pwsh
        run: |
          python scripts\release_check.py "$env:TLWU_BUILD_ROOT\dist\tinglongwu-win64.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: App layer zip check (#945; manifest size + sha256, version == tag, no runtime files, < 15 MB)
        shell: pwsh
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python scripts\release_check.py --app-layer "$env:TLWU_BUILD_ROOT\dist\tinglongwu-app-layer.zip" --tag $env:TAG
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Release checks on the zip (size, check_dist_dlls, llama CPU instructions, --smoke, --selftest)
        shell: pwsh
        run: |
          python release\packaging\release_check.py "$env:TLWU_BUILD_ROOT\dist\tinglongwu-win64.zip" --work "$env:RUNNER_TEMP\rc" --report "$env:TLWU_BUILD_ROOT\dist\release-check.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # saved only after the release checks passed: a layer that fails them is never kept for the next release
      - name: Runtime layer cache (save the rebuilt layer, releases on main only; dry runs on other branches save nothing, #888)
        if: steps.runtime.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}\tlwu-build\runtime
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - name: Release notes (also the dry run's summary)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PR: ${{ needs.plan.outputs.pr }}
          HW_RUN: ${{ needs.plan.outputs.hw_run }}
          HW_DEFERRED: ${{ needs.plan.outputs.hw_deferred }}   # #848: the notes say "hardware checks deferred"
          PLATFORMS: ${{ needs.plan.outputs.platforms }}   # #1596: shipped / skipped per platform
          HEAD: ${{ needs.plan.outputs.head }}
          DIST: ${{ runner.temp }}\tlwu-build\dist
        run: |
          set -euo pipefail
          # Download, support/contributors block and What's new from the single source (docs/support.json)
          python scripts/render_support.py --notes "$TAG" > base.md
          # #722: release/packaging/packs.json (scripts/make_pack_manifest.py) adds the optional-pack size table
          # python opens the D:\ paths in DIST and appends the notes to the job summary
          python scripts/release_notes.py notes --version "$TAG" --base base.md --pr "$PR" \
            --verification "$DIST/release-check.md" --hw-run "$HW_RUN" --head "$HEAD" \
            --packs-manifest release/packaging/packs.json --platforms "$PLATFORMS" --out "$DIST/notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-win64
          path: |
            ${{ runner.temp }}\tlwu-build\dist\tinglongwu-win64.zip
            ${{ runner.temp }}\tlwu-build\dist\tinglongwu-win64.zip.sha256
            ${{ runner.temp }}\tlwu-build\dist\tinglongwu-app-layer.zip
            ${{ runner.temp }}\tlwu-build\dist\tinglongwu-app-layer.zip.manifest.json
            ${{ runner.temp }}\tlwu-build\dist\notes.md
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
      - name: Job time against the core budget (scripts/release_check.py CORE_JOB_BUDGET_MIN; a warning, not a gate)
        if: always() && env.TLWU_JOB_START != ''
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts\release_check.py --job-start $env:TLWU_JOB_START

  gpu-pack:
    # #764 (part 3 of #740): the GPU pack is only cuda_libs/ (CUDA 12 runtime DLLs from the nvidia-*-cu12 wheels +
    # ggml-cuda.dll), so it needs no Nuitka and runs beside `windows` instead of after it: never on the critical
    # path. Same commit and same tag as the core zip; the manifest url names that tag (release_check.py checks it).
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Output folder outside the checkout (absolute; upload-artifact rejects '..' in paths)
        shell: pwsh
        run: |
          "GPU_OUT=$env:RUNNER_TEMP\gpu-pack" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Reuse the previous release's GPU pack when its pinned wheels did not change (#765; budget GPU_PACK_REUSE_BUDGET_MIN = 3 min)
        id: reuse
        shell: pwsh
        timeout-minutes: 3   # = scripts/gpu_pack_reuse.py GPU_PACK_REUSE_BUDGET_MIN
        continue-on-error: true   # a failed or timed-out reuse falls through to the build steps
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          $lines = python scripts\gpu_pack_reuse.py --repo "$env:GITHUB_REPOSITORY" --tag $env:TAG --out "$env:GPU_OUT"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lines
          $reused = ($lines | Where-Object { $_ -like 'reused=*' }) -replace '^reused=', ''
          "reused=$reused" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          ($lines | Where-Object { $_ -like 'summary=*' }) -replace '^summary=', '' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: GPU pack venv (CUDA llama-cpp-python, CUDA 12 wheels incl. nvrtc; no requirements.txt, no Nuitka)
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\gpu-venv"
          $py = "$env:RUNNER_TEMP\gpu-venv\Scripts\python.exe"
          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE) { exit 1 }
          & $py -m pip install -r requirements-llama-cuda.txt --only-binary=:all:
          if ($LASTEXITCODE) { exit 1 }
          # cuda_nvrtc: cuDNN runtime-compiled engines (build_windows.CUDA_WHEELS needs its bin folder)
          & $py -m pip install -r requirements-gpu.txt nvidia-cuda-nvrtc-cu12==12.9.86
          if ($LASTEXITCODE) { exit 1 }
          "GPU_PY=$py" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build the GPU pack (build_windows.py --gpu-pack-only; the manifest url names this release's tag)
        if: steps.reuse.outputs.reused != 'true'
        shell: pwsh
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/tinglongwu-gpu-pack.zip"
          & $env:GPU_PY release\packaging\build_windows.py --gpu-pack-only --out "$env:GPU_OUT" --url $url
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: GPU pack check (manifest size + sha256, CUDA DLLs, same tag as the core zip; size in the summary)
        shell: pwsh
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python scripts\release_check.py --gpu-pack "$env:GPU_OUT\tinglongwu-gpu-pack.zip" --tag $env:TAG
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gpu-pack
          path: |
            ${{ runner.temp }}\gpu-pack\tinglongwu-gpu-pack.zip
            ${{ runner.temp }}\gpu-pack\tinglongwu-gpu-pack.zip.manifest.json
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  vulkan-pack:
    # #800: optional Vulkan llama.cpp pack for AMD / Intel / NVIDIA GPUs without CUDA (mt_backend CUDA > Vulkan > CPU).
    # Runs next to `windows` and `release` waits for it, so its timeout is the core job budget
    # (scripts/release_check.py CORE_JOB_BUDGET_MIN = 20): a slow Vulkan compile only drops the asset, never delays a
    # release past the budget. A failure, timeout or skip is not a release failure: `release` runs on `!cancelled()`
    # with only `windows` / `gpu-pack` required, and attaches the pack when the artifact exists.
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 20   # = CORE_JOB_BUDGET_MIN (tests/test_make_vulkan_pack_800.py keeps them equal)
    continue-on-error: true
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      VULKAN_SDK_VERSION: "1.4.309.0"   # LunarG SDK for glslc + the Vulkan headers/loader import lib
      # SHA-256 of that installer (#1107): printed identically by the "Skip while ..." step of three release runs on
      # windows-latest, 2026-11-15 (runs 43678960157, 43707611409, 43735366365). Empty = the job skips every build
      # step (green, no artifact). When VULKAN_SDK_VERSION changes, empty this, run once and pin the printed hash.
      VULKAN_SDK_SHA256: "48b132169b64fe65cdb0f20970195335a65354e73f1ea5373032c2a8bbad4297"
    steps:
      - name: Skip while the Vulkan SDK installer hash is not pinned (the release ships without the pack)
        id: pin
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK_SHA256) {
            Write-Output "::notice::VULKAN_SDK_SHA256 is not pinned yet: no Vulkan pack in this run"
            "skip=true" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
            if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {   # print the hash to pin; never run the installer
              $exe = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
              curl.exe -fsSL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
              if (-not $LASTEXITCODE) { Write-Output "Vulkan SDK installer SHA-256: $((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())" }
            }
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.pin.outputs.skip != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.pin.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Vulkan SDK
        if: steps.pin.outputs.skip != 'true'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe -fsSL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          if ($LASTEXITCODE) { exit 1 }
          # the installer's headers / glslc build the DLLs we ship: nothing runs it until its hash matches the pin
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Output "Vulkan SDK installer SHA-256: $hash"
          if ($hash -ne $env:VULKAN_SDK_SHA256) { Write-Output "::error::Vulkan SDK installer SHA-256 $hash does not match the pin '$env:VULKAN_SDK_SHA256'"; exit 1 }
          & $exe --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE) { exit 1 }
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: SPIRV-Headers (ggml-vulkan needs its CMake config; the 1.4.309.0 SDK does not ship it, #1195)
        if: steps.pin.outputs.skip != 'true'
        shell: pwsh
        env:
          SPIRV_HEADERS_SHA: "09913f088a1197aba4aefd300a876b2ebbaa3391"   # KhronosGroup/SPIRV-Headers tag vulkan-sdk-1.4.309.0
        run: |
          $src = "$env:RUNNER_TEMP\SPIRV-Headers"
          $prefix = "$env:RUNNER_TEMP\spirv-headers-prefix"
          git init -q $src
          git -C $src fetch -q --depth 1 https://github.com/KhronosGroup/SPIRV-Headers $env:SPIRV_HEADERS_SHA
          if ($LASTEXITCODE) { exit 1 }
          git -C $src checkout -q FETCH_HEAD
          if ((git -C $src rev-parse HEAD) -ne $env:SPIRV_HEADERS_SHA) { Write-Output "::error::SPIRV-Headers checkout is not the pinned commit"; exit 1 }
          cmake -S $src -B "$src\build" -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          if ($LASTEXITCODE) { exit 1 }
          cmake --install "$src\build" --prefix $prefix
          if ($LASTEXITCODE) { exit 1 }
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Compile llama-cpp-python with GGML_VULKAN=on (same pin as requirements-llama-cpu.txt)
        if: steps.pin.outputs.skip != 'true'
        shell: pwsh
        run: |
          $pin = (Select-String -Path requirements-llama-cpu.txt -Pattern '^llama-cpp-python==(.+)$').Matches[0].Groups[1].Value.Trim()
          $env:CMAKE_ARGS = "-DGGML_VULKAN=on -DGGML_NATIVE=off"   # AVX2 baseline, not the runner's CPU (no AVX-512, #74)
          $env:FORCE_CMAKE = "1"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE) { exit 1 }
          python -m pip install "llama-cpp-python==$pin" --no-binary llama-cpp-python --no-cache-dir --target "$env:RUNNER_TEMP\vk-site"
          if ($LASTEXITCODE) { exit 1 }
      - name: Pack llama_cpp/lib as tlwu-vulkan-pack-<version>.zip and check the layout
        if: steps.pin.outputs.skip != 'true'
        shell: pwsh
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          $ver = $env:TAG.TrimStart('v')
          if (-not $ver) { $ver = (python -c "import tinglongwu; print(tinglongwu.__version__)").Trim() }   # a dry run may plan no tag
          python scripts\make_vulkan_pack.py --lib "$env:RUNNER_TEMP\vk-site\llama_cpp\lib" --version $ver --out "$env:RUNNER_TEMP\vk-dist"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip = "$env:RUNNER_TEMP\vk-dist\tlwu-vulkan-pack-$ver.zip"
          $out = python scripts\make_vulkan_pack.py --check $zip
          $code = $LASTEXITCODE
          $out | Write-Host
          "### Vulkan pack layout" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $out | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($code) { exit $code }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.pin.outputs.skip != 'true'
        with:
          name: vulkan-pack
          path: ${{ runner.temp }}\vk-dist\tlwu-vulkan-pack-*.zip
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  vulkan-pack-linux:
    # #1198: Linux Vulkan llama.cpp pack for AMD / Intel iGPU laptops (`tlwu-setup --vulkan-pack` on Linux takes it).
    # Same rules as vulkan-pack: capped at CORE_JOB_BUDGET_MIN, continue-on-error, never gates or delays a release.
    # Built on ubuntu-24.04 (its glslc / Vulkan headers build ggml-vulkan; the pack needs glibc >= 2.39).
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # = CORE_JOB_BUDGET_MIN (tests/test_vulkan_pack_linux_1198.py keeps them equal)
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Vulkan build tools (Ubuntu archive) + Mesa lavapipe for the smoke check
        run: |
          sudo apt-get update -qq
          # spirv-headers: ggml-vulkan's find_package(SPIRV-Headers CONFIG REQUIRED) (#1195)
          sudo apt-get install -y -qq libvulkan-dev glslc spirv-headers mesa-vulkan-drivers
      - name: Compile llama-cpp-python with GGML_VULKAN=on (same pin as requirements-llama-cpu.txt)
        run: |
          pin=$(sed -n 's/^llama-cpp-python==\([^ #]*\).*/\1/p' requirements-llama-cpu.txt)
          [ -n "$pin" ] || { echo "no llama-cpp-python pin"; exit 1; }
          python -m pip install --upgrade pip
          CMAKE_ARGS="-DGGML_VULKAN=on -DGGML_NATIVE=off" FORCE_CMAKE=1 \
            python -m pip install "llama-cpp-python==$pin" --no-binary llama-cpp-python --no-cache-dir --target "$RUNNER_TEMP/vk-site"
      - name: Pack llama_cpp/lib as tlwu-vulkan-pack-linux-<version>.zip, check the layout, list the lavapipe device
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          GGML_VK_VISIBLE_DEVICES: "0"   # ggml-vulkan skips CPU-type devices (lavapipe) unless listed explicitly
        run: |
          set -o pipefail
          ver="${TAG#v}"
          [ -n "$ver" ] || ver=$(python -c "import tinglongwu; print(tinglongwu.__version__)")   # a dry run may plan no tag
          python scripts/make_vulkan_pack.py --lib "$RUNNER_TEMP/vk-site/llama_cpp/lib" --version "$ver" --out "$RUNNER_TEMP/vk-dist"
          zip="$RUNNER_TEMP/vk-dist/tlwu-vulkan-pack-linux-$ver.zip"
          {
            echo "### Linux Vulkan pack layout"; echo '```'
            python scripts/make_vulkan_pack.py --check "$zip"
            python scripts/make_vulkan_pack.py --smoke "$zip"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulkan-pack-linux
          path: ${{ runner.temp }}/vk-dist/tlwu-vulkan-pack-linux-*.zip
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  whisper-vulkan:
    # #783: whisper.cpp publishes no Vulkan binaries, so build the pinned commit (scripts/build_whisper_vulkan.py) with
    # GGML_VULKAN=on into one static tlwu-whisper library; `release` adds it under whisper/ in the matching Vulkan pack
    # zip. Parallel to vulkan-pack, same rules: capped at CORE_JOB_BUDGET_MIN, continue-on-error, never gates a release.
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, plat: windows}
          - {os: ubuntu-24.04, plat: linux}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # = CORE_JOB_BUDGET_MIN (tests/test_whisper_vulkan_783.py keeps them equal)
    continue-on-error: true
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      VULKAN_SDK_VERSION: "1.4.309.0"   # = vulkan-pack (tests/test_whisper_vulkan_783.py keeps both pins equal)
      VULKAN_SDK_SHA256: "48b132169b64fe65cdb0f20970195335a65354e73f1ea5373032c2a8bbad4297"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Vulkan SDK (Windows; same pinned installer hash as vulkan-pack)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          curl.exe -fsSL -o $exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          if ($LASTEXITCODE) { exit 1 }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VULKAN_SDK_SHA256) { Write-Output "::error::Vulkan SDK installer SHA-256 $hash does not match the pin"; exit 1 }
          & $exe --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE) { exit 1 }
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: SPIRV-Headers (Windows; same pin as vulkan-pack, #1195)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SPIRV_HEADERS_SHA: "09913f088a1197aba4aefd300a876b2ebbaa3391"   # KhronosGroup/SPIRV-Headers tag vulkan-sdk-1.4.309.0
        run: |
          $src = "$env:RUNNER_TEMP\SPIRV-Headers"
          $prefix = "$env:RUNNER_TEMP\spirv-headers-prefix"
          git init -q $src
          git -C $src fetch -q --depth 1 https://github.com/KhronosGroup/SPIRV-Headers $env:SPIRV_HEADERS_SHA
          if ($LASTEXITCODE) { exit 1 }
          git -C $src checkout -q FETCH_HEAD
          if ((git -C $src rev-parse HEAD) -ne $env:SPIRV_HEADERS_SHA) { exit 1 }
          cmake -S $src -B "$src\build" -DSPIRV_HEADERS_ENABLE_TESTS=OFF
          if ($LASTEXITCODE) { exit 1 }
          cmake --install "$src\build" --prefix $prefix
          if ($LASTEXITCODE) { exit 1 }
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Vulkan build tools + Mesa lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev glslc spirv-headers mesa-vulkan-drivers
      - name: Build whisper.cpp (pinned commit) with GGML_VULKAN=on into tlwu-whisper
        shell: bash
        run: |
          python -m pip install -q "numpy==$(sed -n 's/^numpy==\([^ #;]*\).*/\1/p' requirements.lock.txt | head -1)"
          python scripts/build_whisper_vulkan.py --out "$RUNNER_TEMP/whisper-out"
      - name: Smoke - transcribe 1 s through the app's ctypes loader on Mesa lavapipe (Linux)
        if: runner.os == 'Linux'
        shell: bash   # -o pipefail: a failed smoke must fail the step, not be hidden by tee
        env:
          GGML_VK_VISIBLE_DEVICES: "0"   # ggml-vulkan skips CPU-type devices (lavapipe) unless listed explicitly
        run: python scripts/build_whisper_vulkan.py --smoke "$RUNNER_TEMP/whisper-out" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whisper-vulkan-${{ matrix.plat }}
          path: ${{ runner.temp }}/whisper-out
          if-no-files-found: error

  release:
    needs: [plan, windows, gpu-pack, vulkan-pack, vulkan-pack-linux, whisper-vulkan]
    # #800: the optional Vulkan pack never gates a release: run even when vulkan-pack failed, timed out or was skipped
    # (only `windows` and `gpu-pack` must succeed, as before; `vulkan-pack` stays in needs for ordering)
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && needs.windows.result == 'success' && needs.gpu-pack.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # only this job and windows-installer may create the tag and the Release
      actions: read     # #764: the run's job start times, for the release wall time
      id-token: write       # #26: build provenance (Sigstore OIDC) for the assets; only this job and windows-installer
      attestations: write   # #26: store the provenance attestations on this repo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-win64
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-gpu-pack
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true   # #800: no artifact = the Vulkan pack job failed or was skipped; the release ships without it
        with:
          name: vulkan-pack
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true   # #1198: no artifact = the Linux Vulkan pack job failed or was skipped
        with:
          name: vulkan-pack-linux
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true   # #783: no artifact = the whisper.cpp Vulkan build failed; the packs ship without ASR
        with:
          pattern: whisper-vulkan-*
          path: whisper
      - name: Add the whisper.cpp Vulkan ASR build to each Vulkan pack under whisper/ (#783; before SHA256SUMS)
        continue-on-error: true   # add_whisper rewrites the zip atomically: a failure leaves the llama-only pack
        run: |
          for f in dist/tlwu-vulkan-pack-*.zip; do
            [ -f "$f" ] || continue
            case "$f" in *-linux-*) plat=linux ;; *) plat=windows ;; esac
            if [ -d "whisper/whisper-vulkan-$plat" ]; then
              python3 scripts/make_vulkan_pack.py --add-whisper "$f" --whisper "whisper/whisper-vulkan-$plat"
            else
              echo "::warning::no whisper.cpp Vulkan build for $plat: $f ships without Vulkan ASR"
            fi
          done
      - name: GPU pack check again after the artifact hop (manifest size + sha256, same tag as the core zip)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 scripts/release_check.py --gpu-pack dist/tinglongwu-gpu-pack.zip --tag "$TAG"
      - name: App layer zip check again after the artifact hop (#945)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 scripts/release_check.py --app-layer dist/tinglongwu-app-layer.zip --tag "$TAG"
      - name: Build install assets (Windows gets the tag; #1596 macOS / Linux get their last-good marker tag)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/mac_install.sh dist/mac_install.sh
          cp scripts/bootstrap_windows.ps1 dist/install.ps1
          sed -i "s/__TLWU_REF__/$TAG/g" dist/install.ps1
          sed -i "s/__TLWU_REF__/linux-ok/g" dist/install.sh
          sed -i "s/__TLWU_REF__/mac-ok/g" dist/mac_install.sh
          if grep -q "__TLWU_REF__" dist/install.sh dist/mac_install.sh dist/install.ps1; then exit 1; fi   # nothing may keep the placeholder
          grep -q '"linux-ok"' dist/install.sh
          grep -q '"mac-ok"' dist/mac_install.sh
          bash -n dist/install.sh
          bash -n dist/mac_install.sh
          cd dist
          sha256sum -c tinglongwu-win64.zip.sha256   # the zip release_check.py tested
          [ "$(stat -c %s tinglongwu-win64.zip)" -lt 2147483648 ] || { echo "zip over the 2 GiB asset limit"; exit 1; }
          sha256sum tinglongwu-win64.zip tinglongwu-app-layer.zip tinglongwu-app-layer.zip.manifest.json \
            tinglongwu-gpu-pack.zip tinglongwu-gpu-pack.zip.manifest.json \
            install.sh mac_install.sh install.ps1 > SHA256SUMS.txt
          for f in tlwu-vulkan-pack-*.zip; do   # #800: listed next to the core zip when the pack was built
            [ -f "$f" ] && sha256sum "$f" >> SHA256SUMS.txt || echo "::warning::no Vulkan pack in this release"
          done
          sha256sum -c SHA256SUMS.txt
      - name: List the release assets to attest (#26; the Vulkan pack only when it was built)
        id: attest-list
        shell: bash
        run: |
          set -euo pipefail
          # an unmatched glob would fail the attest step and drop provenance for every asset, so list existing files only
          {
            echo "paths<<TLWU_ATTEST_EOF"
            for f in dist/tinglongwu-win64.zip dist/tinglongwu-app-layer.zip dist/tinglongwu-app-layer.zip.manifest.json \
                     dist/tinglongwu-gpu-pack.zip dist/tinglongwu-gpu-pack.zip.manifest.json \
                     dist/install.sh dist/mac_install.sh dist/install.ps1 dist/tlwu-vulkan-pack-*.zip; do
              if [ -f "$f" ]; then echo "$f"; fi
            done
            echo "TLWU_ATTEST_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build provenance for the release assets (#26; verify with `gh attestation verify <file> -R <repo>`)
        continue-on-error: true   # provenance is additive: an attestation outage never blocks the release
        # GitHub-owned action on its major tag: an unresolvable `uses:` fails the whole job at "Set up job", where
        # continue-on-error does not apply, and the commit SHA of v2 could not be verified from this repo (#26 review)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.attest-list.outputs.paths }}
      - name: Tag the released commit (an existing tag must already point at it)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null; then
            at=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
            [ "$at" = "$GITHUB_SHA" ] || { echo "tag $TAG exists at $at, not at $GITHUB_SHA; not releasing"; exit 1; }
          fi
      - name: Move the per-platform marker tags (#1596; mac-ok / linux-ok follow a platform only when its jobs passed)
        if: needs.plan.outputs.pr != ''   # a release PR, not a pre-release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          set -euo pipefail
          git fetch --quiet --force --tags origin
          python3 scripts/release_notes.py markers --version "$TAG" --platforms "$PLATFORMS" > moves.txt
          cat moves.txt >> "$GITHUB_STEP_SUMMARY"
          while read -r marker target; do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$target" --jq .sha)
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$marker" -f sha="$sha" -F force=true >/dev/null ||
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$marker" -f sha="$sha" >/dev/null
            echo "$marker -> $target ($sha)"
          done < moves.txt
      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # Draft first: it becomes `latest` only when windows-installer publishes it, after the wizard that the
          # README links is attached. Only a tag with a suffix (v1.2.3-beta.1) is a pre-release (#478: 0.x stays
          # latest). A re-run (draft exists) only replaces the files.
          pre=(); [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || pre=(--prerelease)
          vulkan=(); for f in dist/tlwu-vulkan-pack-*.zip; do [ -f "$f" ] && vulkan+=("$f"); done   # #800
          files=(dist/tinglongwu-win64.zip dist/tinglongwu-app-layer.zip dist/tinglongwu-app-layer.zip.manifest.json
                 dist/tinglongwu-gpu-pack.zip dist/tinglongwu-gpu-pack.zip.manifest.json
                 dist/install.sh dist/mac_install.sh dist/install.ps1 dist/SHA256SUMS.txt "${vulkan[@]}")
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            # never rewrite a published release: its SHA256SUMS.txt and wizard are what users verify against
            [ "$draft" = true ] || { echo "release $TAG is already published; not touching it"; exit 1; }
            # #800 / #1198: a retry must not leave an older Vulkan pack (Windows or Linux) that this run did not build:
            # SHA256SUMS.txt is replaced below and would no longer list it. Packs in this upload are replaced by --clobber.
            stale=$(gh release view "$TAG" --json assets -q '.assets[].name' | grep '^tlwu-vulkan-pack-' || true)
            for a in $stale; do
              [ -f "dist/$a" ] || gh release delete-asset "$TAG" "$a" -y
            done
            gh release upload "$TAG" "${files[@]}" --clobber
            gh release edit "$TAG" --notes-file dist/notes.md   # the notes describe the files just attached
          else
            gh release create "$TAG" "${files[@]}" --draft "${pre[@]}" --verify-tag --notes-file dist/notes.md --title "$TAG"
          fi
      - name: Release wall time (first job start -> release created) against RELEASE_BUDGET_MIN (a warning, not a gate)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" \
            --jq '[.jobs[].started_at | select(. != null)] | min')
          python3 scripts/release_check.py --release-start "$(date -d "$start" +%s)"

  windows-installer:
    # Attach the setup wizard under its versioned name and under the fixed name
    # tinglongwu-setup.exe, which the README links via releases/latest/download.
    # #772: the wizard wraps the same prebuilt core as the release zip (release-win64 artifact from `windows`), so it
    # also runs on a dry run (build + size, no upload); on a publish it still waits for `release` (draft exists).
    needs: [plan, windows, release]
    if: >-
      always() && needs.windows.result == 'success' &&
      (needs.release.result == 'success' || needs.plan.outputs.publish != 'true')
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write   # #639: dispatch install-test.yml after publishing
      id-token: write       # #26: build provenance for the setup wizard (publish only)
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-win64
          path: ${{ runner.temp }}\release-win64
      - name: Unpack the core zip (the zip's top folder tlwu\ holds tlwu.exe)
        shell: powershell
        run: |
          $zip = "$env:RUNNER_TEMP\release-win64\tinglongwu-win64.zip"
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\core" -Force
          if (-not (Test-Path "$env:RUNNER_TEMP\core\tlwu\tlwu.exe")) { throw "tlwu.exe not at the top of the core zip" }
      - name: Build the wizard from the release's core (build_installer.py --core-dir, #767)
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          python release\installer\build_installer.py --core-dir "$env:RUNNER_TEMP\core\tlwu"
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Wizard size against WIZARD_MAX_MB (release/installer/build_installer.py; a warning, not a gate)
        shell: powershell
        run: |
          $exe = Get-ChildItem dist\installer\tinglongwu-setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "no tinglongwu-setup-*.exe in dist\installer" }
          python release\installer\build_installer.py --size-report $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "size report failed" }
      - name: Name tinglongwu-setup.exe and add both wizard names to the release's SHA256SUMS.txt (publish only)
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist/installer
          exe="tinglongwu-setup-${TAG#v}.exe"   # named after tinglongwu.__version__, which must match the tag
          [ -f "$exe" ] || { echo "expected $exe (set __version__ in src/core/tinglongwu/__init__.py to ${TAG#v}); got: $(ls)"; exit 1; }
          cp "$exe" tinglongwu-setup.exe
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O all.txt
          grep -v ' tinglongwu-setup' all.txt > SHA256SUMS.txt || true   # a re-run replaces the wizard lines
          for f in "$exe" tinglongwu-setup.exe; do   # Git Bash prints "hash *file"; keep the "hash  file" format
            echo "$(sha256sum "$f" | cut -d' ' -f1)  $f" >> SHA256SUMS.txt
          done
      - name: Sign the final SHA256SUMS.txt for the self-updater (#1348; no secret = unsigned, a notice)
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        env:
          TLWU_SUMS_SIGNING_KEY: ${{ secrets.TLWU_SUMS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          rm -f dist/installer/SHA256SUMS.txt.sig   # never upload a stale signature
          python scripts/sign_sums.py sign dist/installer/SHA256SUMS.txt
      - name: Build provenance for the setup wizard and the final SHA256SUMS.txt (#26; tinglongwu-setup.exe = same bytes)
        if: needs.plan.outputs.publish == 'true'
        continue-on-error: true   # provenance is additive: an attestation outage never blocks the release
        uses: actions/attest-build-provenance@v2   # see the release job: major tag, resolves for sure
        with:
          subject-path: |
            dist/installer/tinglongwu-setup-*.exe
            dist/installer/SHA256SUMS.txt
      - name: Upload tinglongwu-setup-<ver>.exe, tinglongwu-setup.exe and SHA256SUMS.txt, publish
        if: needs.plan.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist/installer
          exe="tinglongwu-setup-${TAG#v}.exe"   # written by the step above
          [ -f tinglongwu-setup.exe ] && [ -f SHA256SUMS.txt ] || { echo "wizard copy or SHA256SUMS.txt missing: $(ls)"; exit 1; }
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$exe" tinglongwu-setup.exe SHA256SUMS.txt --clobber
          if [ -f SHA256SUMS.txt.sig ]; then   # #1348: signed by the step above
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" SHA256SUMS.txt.sig --clobber
          else   # a re-run without the key must not leave a signature of an older SHA256SUMS.txt
            gh release delete-asset "$TAG" SHA256SUMS.txt.sig -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          fi
          # What's new comes from docs/whats_new.md (or a release PR edit); without it the notes keep the TODO line
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body | grep -q 'TODO:'; then
            echo "::notice::$TAG stays a draft: fill in What's new, then run: gh release edit $TAG --draft=false"
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
            # #639: a publish by github.token fires no `release` event, so start the install test explicitly
            gh workflow run install-test.yml -R "$GITHUB_REPOSITORY" --ref dev -f release_tag="$TAG"
          fi
