name: release
# Runs when a version tag is pushed. A vX.Y.Z tag must point at a commit on main; a pre-release
# tag (vX.Y.Z-suffix) may also point at a commit on dev.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only this job may create the Release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Tag format and branch check (vX.Y.Z must be on main; a vX.Y.Z-suffix pre-release may be on main or dev)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
          # a pre-release (v1.2.3-beta.1) is cut from dev before dev is merged to main (#112); it is
          # created with --prerelease below, so it never becomes `latest`. Plain vX.Y.Z stays main-only.
          branches=(main); [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]] && branches=(main dev)
          git fetch --no-tags origin "${branches[@]}"
          on=
          for b in "${branches[@]}"; do git merge-base --is-ancestor "$GITHUB_SHA" "origin/$b" && on=$b && break; done
          [ -n "$on" ] || { echo "tag $TAG is not on ${branches[*]}"; exit 1; }
          echo "tag $TAG is on $on"
      - name: Build install assets (embed the tag so each script installs the version it was released with)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp scripts/install.sh dist/install.sh
          cp scripts/mac_install.sh dist/mac_install.sh
          cp scripts/bootstrap_windows.ps1 dist/install.ps1
          sed -i "s/__TLWU_REF__/$TAG/g" dist/install.sh dist/mac_install.sh dist/install.ps1
          ! grep -q "__TLWU_REF__" dist/*   # nothing may keep the placeholder
          grep -q "\"$TAG\"" dist/install.sh
          bash -n dist/install.sh
          bash -n dist/mac_install.sh
          cd dist && sha256sum install.sh mac_install.sh install.ps1 > SHA256SUMS.txt
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Draft first: it becomes `latest` only when windows-installer publishes it, after the wizard
          # that the README links is attached. A tag with a suffix (v1.2.3-beta.1) is a pre-release,
          # which never becomes `latest`. A re-run (release already exists) only replaces the files.
          pre=(); [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || pre=(--prerelease)
          files=(dist/install.sh dist/mac_install.sh dist/install.ps1 dist/SHA256SUMS.txt)
          if draft=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            # never rewrite a published release: its SHA256SUMS.txt and wizard are what users verify against
            [ "$draft" = true ] || { echo "release $TAG is already published; not touching it"; exit 1; }
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            # notes start from the single source (docs/support.json + .all-contributorsrc): Download, the
            # README's support/contributors block, a What's new placeholder; GitHub's changelog is appended
            python3 scripts/render_support.py --notes "$TAG" > dist/notes.md
            gh release create "$TAG" "${files[@]}" --draft "${pre[@]}" \
              --verify-tag --notes-file dist/notes.md --generate-notes --title "$TAG"
          fi

  windows-installer:
    # Attach the setup wizard under its versioned name and under the fixed name
    # tinglongwu-setup.exe, which the README links via releases/latest/download.
    needs: release
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the wizard
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          python installer\build_installer.py
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Upload tinglongwu-setup-<ver>.exe and tinglongwu-setup.exe, add both to SHA256SUMS.txt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist/installer
          exe="tinglongwu-setup-${TAG#v}.exe"   # named after tinglongwu.__version__, which must match the tag
          [ -f "$exe" ] || { echo "expected $exe (set __version__ in tinglongwu/__init__.py to ${TAG#v}); got: $(ls)"; exit 1; }
          cp "$exe" tinglongwu-setup.exe
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS.txt -O all.txt
          grep -v ' tinglongwu-setup' all.txt > SHA256SUMS.txt || true   # a re-run replaces the wizard lines
          for f in "$exe" tinglongwu-setup.exe; do   # Git Bash prints "hash *file"; keep the "hash  file" format
            echo "$(sha256sum "$f" | cut -d' ' -f1)  $f" >> SHA256SUMS.txt
          done
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$exe" tinglongwu-setup.exe SHA256SUMS.txt --clobber
          # only now can it become `latest`, and only once a maintainer has replaced the What's new TODO
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json body -q .body | grep -q 'TODO:'; then
            echo "::notice::$TAG stays a draft: fill in What's new and the developer section, then run: gh release edit $TAG --draft=false"
          else
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false
          fi
