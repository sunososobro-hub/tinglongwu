name: triage
# Rule-based triage on issues.opened, no AI (owner 2026-11-18). Replaces the W-easy event routine: issues
# opened by AI agents did not wake it, and one AI run per issue cost too much quota.
# Rules live in scripts/triage_issue.py (.agent/tlwu_rules.md sections 10/12/15). Undecidable -> needs-triage.
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts/triage_issue.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I scripts/triage_issue.py
