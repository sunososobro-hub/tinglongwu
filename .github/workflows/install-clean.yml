name: install-clean
# A Windows PC with NO Python at all (#67), installed the two ways a non-technical user does it:
#   install-bat:   double-click install.bat (install.ps1 must fetch Python 3.12 itself, per-user, no admin)
#   installer-exe: the Inno Setup wizard tinglongwu-setup-<ver>.exe, run silently (#69)
# windows-latest ships Python, so each job first takes every Python off PATH and the py launcher away, and checks
# that neither `python` nor `py` resolves any more. Models are skipped (TLWU_SKIP_MODELS) to keep the jobs short;
# the model download itself is covered by install-test.yml and e2e.yml.
on:
  push:
    branches: [dev, 'release/v*']   # #1016: the release snapshot must have a green speak-smoke
    paths: ['scripts/**', 'install.*', 'release/installer/**', 'pyproject.toml', 'requirements*.txt', '.github/scripts/**', '.github/workflows/install-clean.yml']
  # #1547: no pull_request run (Windows/macOS runners); dev push, snapshot dispatch and schedule cover it
  workflow_dispatch:
    inputs:
      tag:
        description: "#934: release tag whose tinglongwu-setup.exe the windows ttfs job installs (default: latest)"
        required: false
        default: ""
  schedule:
    - cron: '23 3 * * 1'   # #775: weekly time-to-first-subtitle numbers

permissions:
  contents: read

# #934: a manual dispatch (e.g. tag=v0.3.4 and tag=v0.3.5 for the before/after pair) gets its own group per tag and
# is never cancelled; before, both dispatches and any dev push shared one group and cancelled each other.
concurrency:
  group: install-clean-${{ github.ref }}-${{ github.event_name }}-${{ github.event.inputs.tag }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  TLWU_NO_UPDATE: "1"
  TLWU_UI_LANG: en
  TLWU_SKIP_MODELS: "1"

jobs:
  install-bat:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: "#67 no Python on this PC, then double-click install.bat"
        shell: powershell
        run: |
          . .\.github\scripts\hide_python.ps1
          $target = Join-Path $env:LOCALAPPDATA 'Programs\Python\Python312\python.exe'
          if (Test-Path $target) { throw "per-user Python already present: $target" }
          # as a double-click does: cmd runs the .bat; `pause` at the end reads NUL and returns
          cmd /c "install.bat < NUL 2>&1" | Tee-Object -FilePath "$env:RUNNER_TEMP\install.log"
          $rc = $LASTEXITCODE   # install.bat passes on install.ps1's exit code
          if ($rc -ne 0) { throw "FAIL: install.bat exit $rc" }
          if (-not (Test-Path $target)) { throw "FAIL: install.ps1 did not install Python 3.12 per-user at $target" }
          Write-Host "PASS: Python installed by the installer: $(& $target --version)"
          $cfg = Get-Content .venv\pyvenv.cfg -Raw
          if ($cfg -notmatch [regex]::Escape((Split-Path $target))) { throw "FAIL: .venv is not based on the new Python:`n$cfg" }
          & .venv\Scripts\python.exe -c "import tinglongwu, llama_cpp; print('PASS: import ok')"
          if ($LASTEXITCODE -ne 0) { throw "FAIL: import" }
          $h = & .venv\Scripts\tlwu.exe --help   # read it all: closing the pipe early fails the exe
          if ($LASTEXITCODE -ne 0) { throw "FAIL: tlwu --help" }
          Write-Host "PASS #67: install.bat on a PC without Python"

  installer-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the wizard (developer side, needs Python + Inno Setup)
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          python release\installer\build_installer.py
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Get-ChildItem dist\installer\*.exe
      - name: "#69 #67 no Python on this PC, run the wizard silently, then use and uninstall the app"
        shell: powershell
        run: |
          . .\.github\scripts\hide_python.ps1
          $exe = (Get-ChildItem dist\installer\tinglongwu-setup-*.exe | Select-Object -First 1).FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs\tinglongWu'
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          Get-Content "$app\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "FAIL: wizard exit $($p.ExitCode)" }
          $done = (Get-Content "$app\install.done" -ErrorAction SilentlyContinue | Out-String).Trim()
          if ($done -ne '0') { throw "FAIL: install.ps1 inside the wizard ended with '$done'" }
          $py = Join-Path $env:LOCALAPPDATA 'Programs\Python\Python312\python.exe'
          if (-not (Test-Path $py)) { throw "FAIL: the wizard did not provision Python" }
          if (-not (Test-Path "$app\.venv\Scripts\tlwu-gui.exe")) { throw "FAIL: no tlwu-gui.exe" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*tinglongWu*.lnk'
          if (-not $lnk) { throw "FAIL: no Start-menu shortcut" }
          Write-Host "PASS: shortcuts: $($lnk.Name -join ', ')"
          $h = & "$app\.venv\Scripts\tlwu.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "FAIL: tlwu --help" }
          $un = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          if (-not $un) { throw "FAIL: no uninstaller" }
          $u = Start-Process -FilePath $un.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 5
          if ($u.ExitCode -ne 0 -or (Test-Path "$app\.venv\Scripts\tlwu-gui.exe")) { throw "FAIL: uninstall (exit $($u.ExitCode))" }
          Write-Host "PASS #69: wizard installs on a PC without Python, app runs, uninstall works"

  # #775 (parent #674): install start -> first subtitle on Linux and macOS, models NOT skipped for this job's setup step.
  # It measures only: the number never fails the job, a crash / no subtitle / timeout does. Not run on pull requests.
  ttfs:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, runner: ubuntu-24.04}
          - {os: macos, runner: macos-latest}   # #1060: the macos-14 image is retired ("not supported"), every run was cancelled
          - {os: windows, runner: windows-latest}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Audio libs (Linux)
        if: matrix.os == 'linux'
        run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libsndfile1 libpulse0
      - name: "#934 download the released setup exe, run it silently, time to first subtitle"
        if: matrix.os == 'windows'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TLWU_TAG: ${{ github.event.inputs.tag }}
          PYTHONUTF8: "1"
        run: |
          Remove-Item Env:TLWU_SKIP_MODELS -ErrorAction SilentlyContinue   # the wizard downloads the models too
          $dl = Join-Path $env:RUNNER_TEMP 'dl'
          New-Item -ItemType Directory -Force $dl | Out-Null
          $tagArgs = @(); if ($env:TLWU_TAG) { $tagArgs = @($env:TLWU_TAG) }
          gh release download @tagArgs --repo $env:GITHUB_REPOSITORY --pattern 'tinglongwu-setup.exe' --dir $dl
          if ($LASTEXITCODE -ne 0) { throw "FAIL: could not download tinglongwu-setup.exe ($env:TLWU_TAG)" }
          python scripts/ttfs_ci.py --os windows --dir "$env:RUNNER_TEMP\tlwu" --setup-exe "$dl\tinglongwu-setup.exe" --out ttfs.json --summary $env:GITHUB_STEP_SUMMARY
          exit $LASTEXITCODE
      - name: "#775 time install -> first subtitle"
        if: matrix.os != 'windows'
        run: |
          git checkout -B ci-ttfs
          export TLWU_REPO="$GITHUB_WORKSPACE" TLWU_REF=ci-ttfs TLWU_BRANCH=ci-ttfs
          unset TLWU_SKIP_MODELS   # the workflow default skips models; only the install step of ttfs_ci.py sets it
          python scripts/ttfs_ci.py --os "${{ matrix.os }}" --dir "$RUNNER_TEMP/tlwu" --out ttfs.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ttfs-${{ matrix.os }}
          path: |
            ttfs.json
            ttfs_output.log
            setup_time.json
          retention-days: 90
          if-no-files-found: ignore

  # #1342: first run on Windows - the wizard fetches Whisper only (`--default-listen --defer-mt`, #1359); listening
  # starts with --mt-pending (as the GUI does, #1375) and shows source subtitles; the Hy-MT2 download (the GUI's
  # `tlwu-setup --default-listen` child, #1358) is held until the first source line, then runs; translated lines must
  # follow in the same session without a restart. scripts/mt_handover_ci.py judges it (tests/test_mt_handover_ci_1342.py).
  # The clip is fed with --file --paced (live clock); device capture itself is covered by audio-routing.yml.
  # Not on pull requests: it downloads ~1.6 GB of models.
  mt-handover:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tlwu + Hy-MT2 CPU engine (as e2e.yml)
        shell: bash
        run: |
          pip install -e .
          pip install -r requirements-llama-cpu.txt --only-binary=:all:
          echo "TLWU_MODELS=$(cygpath -m "$RUNNER_TEMP/tlwu-models")" >> "$GITHUB_ENV"
      - name: "#1359 what the wizard fetches: Whisper only"
        shell: bash
        run: |
          unset TLWU_SKIP_MODELS
          tlwu-setup --default-listen --defer-mt --models-dir "$TLWU_MODELS"
      - name: "#1342 source subtitles first, translation joins when Hy-MT2 lands, no restart"
        shell: bash
        run: |
          unset TLWU_SKIP_MODELS
          python scripts/mt_handover_ci.py --models-dir "$TLWU_MODELS" \
            --land-cmd "tlwu-setup --default-listen" \
            --timeout 1200 --log "$RUNNER_TEMP/mt_handover.log" --out "$RUNNER_TEMP/mt_handover.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mt-handover
          path: |
            ${{ runner.temp }}/mt_handover.json
            ${{ runner.temp }}/mt_handover.log
          if-no-files-found: ignore

  # #974: the real user path for 我來說 on a clean Windows VM: setup exe (core layout, silent) -> one speak press
  # (tlwu.exe speak-smoke: My language zh, Other side en, the voice install offer answered yes) -> English voice on
  # VB-CABLE "CABLE Output" (what Meet hears) within 30 s. Fails on a missing voice, a wrong pair or a silent cable.
  # workflow_dispatch with `tag`: that release's tinglongwu-setup.exe instead of a build of this commit.
  # Not on pull requests (like ttfs): it downloads ~2 GB of models; dev pushes (paths above), the weekly run and
  # workflow_dispatch run it.
  speak-smoke:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      VBCABLE_URL: https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip   # = audio-routing.yml
      VBCABLE_SHA256: b950e39f01af1d04ea623c8f6d8eb9b6ea5c477c637295fabf20631c85116bfb
    steps:
      - name: Reject a release tag on a release snapshot
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        run: |
          echo "::error::tag tests that release's installer, not this snapshot; dispatch without tag"
          exit 1
      - name: Build path (as windows-build.yml)
        shell: bash
        run: echo "TLWU_BUILD_ROOT=$RUNNER_TEMP\\tlwu-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Windows audio service + microphone consent + VB-CABLE (same steps as audio-routing.yml)
        shell: pwsh
        run: |
          foreach ($s in 'AudioEndpointBuilder', 'Audiosrv') { Set-Service $s -StartupType Automatic; Start-Service $s }
          $cs = 'SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
          foreach ($k in "HKLM:\$cs", "HKCU:\$cs", "HKCU:\$cs\NonPackaged") {
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name Value -Value Allow -Type String
          }
          $zip = "$env:RUNNER_TEMP\vbcable.zip"
          Invoke-WebRequest $env:VBCABLE_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:VBCABLE_SHA256) { Write-Output "::error::VB-CABLE SHA-256 $hash does not match the pin"; exit 1 }
          $dir = "$env:RUNNER_TEMP\vbcable"
          Expand-Archive $zip -DestinationPath $dir
          $cat = Get-ChildItem $dir -Filter *.cat | Where-Object Name -like '*64*' | Select-Object -First 1
          $cer = "$env:RUNNER_TEMP\vbaudio.cer"
          [IO.File]::WriteAllBytes($cer, (Get-AuthenticodeSignature $cat.FullName).SignerCertificate.Export('Cert'))
          certutil -addstore -f TrustedPublisher $cer | Out-Null
          Start-Process -FilePath "$dir\VBCABLE_Setup_x64.exe" -ArgumentList '-i', '-h' -Wait | Out-Null
          for ($i = 0; $i -lt 60; $i++) {
            $dev = Get-CimInstance Win32_SoundDevice | Where-Object Name -like '*VB-Audio*'
            if ($dev) { break }
            Start-Sleep 2
          }
          if (-not $dev) { Write-Output "::error::VB-CABLE device did not appear after the install"; exit 1 }
          Restart-Service Audiosrv -Force
      - name: Runtime layer cache (restore only; windows-build.yml saves it)
        if: github.event.inputs.tag == ''
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TLWU_BUILD_ROOT }}\runtime
          key: tlwu-runtime-${{ runner.os }}-py312-lite-${{ hashFiles('requirements*.txt', 'release/packaging/build_windows.py', 'release/packaging/runtime_layer.py', 'release/packaging/launcher/**', 'release/packaging/stubs/**', 'src/ui/tinglongwu/gui/assets/tinglongwu.ico') }}
      - name: Setup exe (this commit's core + wizard, or the release named by `tag`)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TLWU_TAG: ${{ github.event.inputs.tag }}
        run: |
          $out = "$env:RUNNER_TEMP\setup"
          New-Item -ItemType Directory -Force $out | Out-Null
          if ($env:TLWU_TAG) {
            gh release download $env:TLWU_TAG --repo $env:GITHUB_REPOSITORY --pattern 'tinglongwu-setup.exe' --dir $out
            if ($LASTEXITCODE) { throw "FAIL: no tinglongwu-setup.exe in $env:TLWU_TAG" }
          } else {
            python release\packaging\build_windows.py --lite
            if ($LASTEXITCODE) { throw "FAIL: core build" }
            if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
            python release\installer\build_installer.py --core-dir "$env:TLWU_BUILD_ROOT\dist\tlwu"
            if ($LASTEXITCODE) { throw "FAIL: wizard build" }
            Copy-Item (Get-ChildItem dist\installer\tinglongwu-setup-*.exe | Select-Object -First 1).FullName "$out\tinglongwu-setup.exe"
          }
      - name: "#974 (1) setup exe silent install (downloads the default models)"
        shell: pwsh
        run: |
          Remove-Item Env:TLWU_SKIP_MODELS -ErrorAction SilentlyContinue
          $app = "$env:RUNNER_TEMP\app"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\setup\tinglongwu-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$app", "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          Get-Content "$app\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0) { throw "FAIL: wizard exit $($p.ExitCode)" }
          if (-not (Test-Path "$app\tlwu.exe")) { throw "FAIL: no tlwu.exe in $app" }
          "TLWU_APP=$app" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: "#974 (2)-(4) one speak press zh -> en: no voice_not_installed, pair zh->en, voice on CABLE Output in 30 s"
        shell: pwsh
        run: |
          Remove-Item Env:TLWU_SKIP_MODELS -ErrorAction SilentlyContinue
          & "$env:TLWU_APP\tlwu.exe" speak-smoke --mine zh --other en --install-voice --json "$env:RUNNER_TEMP\speak_smoke.json"
          $rc = $LASTEXITCODE
          "### #974 speak smoke (clean Windows, VB-CABLE)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:RUNNER_TEMP\speak_smoke.json" -ErrorAction SilentlyContinue | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($rc -ne 0) { throw "FAIL: speak-smoke exit $rc (an app without the speak-smoke command, e.g. v0.3.5, fails here too)" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: speak-smoke
          path: |
            ${{ runner.temp }}\speak_smoke.json
            ${{ runner.temp }}\setup.log
            ${{ runner.temp }}\app\install.log
          if-no-files-found: ignore
