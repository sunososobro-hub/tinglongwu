name: install-clean
# A Windows PC with NO Python at all (#67), installed the two ways a non-technical user does it:
#   install-bat:   double-click install.bat (install.ps1 must fetch Python 3.12 itself, per-user, no admin)
#   installer-exe: the Inno Setup wizard tinglongwu-setup-<ver>.exe, run silently (#69)
# windows-latest ships Python, so each job first takes every Python off PATH and the py launcher away, and checks
# that neither `python` nor `py` resolves any more. Models are skipped (TLWU_SKIP_MODELS) to keep the jobs short;
# the model download itself is covered by install-test.yml and e2e.yml.
on:
  push:
    branches: [dev]
    paths: ['scripts/**', 'install.*', 'installer/**', 'pyproject.toml', 'requirements*.txt', '.github/workflows/install-clean.yml']
  pull_request:
    branches: [dev]
    paths: ['scripts/**', 'install.*', 'installer/**', 'pyproject.toml', 'requirements*.txt', '.github/workflows/install-clean.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-clean-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  TLWU_UI_LANG: en
  TLWU_SKIP_MODELS: "1"

jobs:
  install-bat:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "#67 no Python on this PC, then double-click install.bat"
        shell: powershell
        run: |
          . .\.github\scripts\hide_python.ps1
          $target = Join-Path $env:LOCALAPPDATA 'Programs\Python\Python312\python.exe'
          if (Test-Path $target) { throw "per-user Python already present: $target" }
          # as a double-click does: cmd runs the .bat; `pause` at the end reads NUL and returns
          cmd /c "install.bat < NUL 2>&1" | Tee-Object -FilePath "$env:RUNNER_TEMP\install.log"
          if (-not (Test-Path $target)) { throw "FAIL: install.ps1 did not install Python 3.12 per-user at $target" }
          Write-Host "PASS: Python installed by the installer: $(& $target --version)"
          $cfg = Get-Content .venv\pyvenv.cfg -Raw
          if ($cfg -notmatch [regex]::Escape((Split-Path $target))) { throw "FAIL: .venv is not based on the new Python:`n$cfg" }
          & .venv\Scripts\python.exe -c "import tinglongwu, llama_cpp; print('PASS: import ok')"
          if ($LASTEXITCODE -ne 0) { throw "FAIL: import" }
          $h = & .venv\Scripts\tlwu.exe --help   # read it all: closing the pipe early fails the exe
          if ($LASTEXITCODE -ne 0) { throw "FAIL: tlwu --help" }
          Write-Host "PASS #67: install.bat on a PC without Python"

  installer-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build the wizard (developer side, needs Python + Inno Setup)
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          python installer\build_installer.py
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          Get-ChildItem dist\installer\*.exe
      - name: "#69 #67 no Python on this PC, run the wizard silently, then use and uninstall the app"
        shell: powershell
        run: |
          . .\.github\scripts\hide_python.ps1
          $exe = (Get-ChildItem dist\installer\tinglongwu-setup-*.exe | Select-Object -First 1).FullName
          $app = Join-Path $env:LOCALAPPDATA 'Programs\tinglongWu'
          $p = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/TASKS=desktopicon', "/LOG=$env:RUNNER_TEMP\setup.log" -Wait -PassThru
          Get-Content "$app\install.log" -ErrorAction SilentlyContinue | Select-Object -Last 40
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 40; throw "FAIL: wizard exit $($p.ExitCode)" }
          $done = (Get-Content "$app\install.done" -ErrorAction SilentlyContinue | Out-String).Trim()
          if ($done -ne '0') { throw "FAIL: install.ps1 inside the wizard ended with '$done'" }
          $py = Join-Path $env:LOCALAPPDATA 'Programs\Python\Python312\python.exe'
          if (-not (Test-Path $py)) { throw "FAIL: the wizard did not provision Python" }
          if (-not (Test-Path "$app\.venv\Scripts\tlwu-gui.exe")) { throw "FAIL: no tlwu-gui.exe" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*tinglongWu*.lnk'
          if (-not $lnk) { throw "FAIL: no Start-menu shortcut" }
          Write-Host "PASS: shortcuts: $($lnk.Name -join ', ')"
          $h = & "$app\.venv\Scripts\tlwu.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "FAIL: tlwu --help" }
          $un = Get-ChildItem "$app\unins*.exe" | Select-Object -First 1
          if (-not $un) { throw "FAIL: no uninstaller" }
          $u = Start-Process -FilePath $un.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 5
          if ($u.ExitCode -ne 0 -or (Test-Path "$app\.venv\Scripts\tlwu-gui.exe")) { throw "FAIL: uninstall (exit $($u.ExitCode))" }
          Write-Host "PASS #69: wizard installs on a PC without Python, app runs, uninstall works"
