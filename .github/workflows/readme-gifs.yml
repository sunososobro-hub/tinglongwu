name: readme-gifs
# #734 (owner 2026-11-16): record the README per-mode GIFs on a GitHub-hosted runner, no owner recording.
# Real GUI (tlwu-gui's App) on Xvfb + openbox, real models (e2e smoke set), a PulseAudio null sink as the
# speakers whose monitor is also the default microphone, a recorded speech clip played into it, ffmpeg x11grab of
# the window -> scripts/readme_gif.py caps (<= 3 s, <= 2 MB). The GIFs are uploaded as the `readme-gifs` artifact;
# a worker reviews them and commits them to assets/demo/ in a fix/734-rK PR. Manual only: nothing runs on push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-gifs
  cancel-in-progress: false

env:
  TLWU_NO_UPDATE: "1"
  TLWU_UI_LANG: en
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (audio server, virtual display, window manager, ffmpeg, CJK font)
        timeout-minutes: 20
        run: |
          PKGS="libsndfile1 libpulse0 pulseaudio pulseaudio-utils xvfb openbox x11-utils ffmpeg fonts-noto-cjk"
          for i in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends $PKGS && exit 0
            echo "apt try $i failed"; sleep 15
          done
          exit 1
      - name: Install tlwu + Hy-MT2 CPU engine
        run: |
          pip install -e ".[dev]"
          pip install -r requirements/requirements-llama-cpu.txt --only-binary=:all:
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Models dir
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/tlwu-models
          # same key as e2e linux: the smoke set is usually already cached
          key: e2e-models-v4-linux-${{ hashFiles('src/system/tinglongwu_setup/manifest.json', 'src/system/tinglongwu_setup/downloader.py') }}
      - name: Models (smoke set) + Kokoro voice + a Chinese speech clip for speak / two-way
        run: |
          tlwu-setup --whisper small --hymt --pair zh-en --pair en-zh --allow-unpinned --models-dir "$TLWU_MODELS"
          tlwu-setup --talk --talk-venv "$HOME/tts-kokoro" --talk-launcher "$RUNNER_TEMP/tlwu-talk.ps1" --models-dir "$TLWU_MODELS"
          echo "TLWU_KOKORO_PYTHON=$HOME/tts-kokoro/bin/python" >> "$GITHUB_ENV"
          echo "TLWU_KOKORO_MODEL=$TLWU_MODELS/kokoro" >> "$GITHUB_ENV"
          TLWU_KOKORO_PYTHON="$HOME/tts-kokoro/bin/python" TLWU_KOKORO_MODEL="$TLWU_MODELS/kokoro" \
            python scripts/ci_e2e.py zh-wav "$RUNNER_TEMP/zh.wav"
      - name: PulseAudio null sink = speakers, its monitor = the default microphone
        run: |
          pulseaudio -D --exit-idle-time=-1
          for i in $(seq 20); do pactl info >/dev/null 2>&1 && break; sleep 0.5; done
          pactl load-module module-null-sink sink_name=gif_room sink_properties=device.description=GIF-Room
          pactl set-default-sink gif_room
          pactl set-default-source gif_room.monitor
          pactl info | grep -E "Default (Sink|Source)"
      - name: Xvfb + openbox
        run: |
          Xvfb :99 -screen 0 1280x900x24 >/dev/null 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for i in $(seq 20); do DISPLAY=:99 xdpyinfo >/dev/null 2>&1 && break; sleep 0.5; done
          DISPLAY=:99 openbox >/dev/null 2>&1 &
          sleep 1
      - name: "Record listen / speak / two-way"
        run: |
          set -o pipefail
          rc=0  # every mode runs; the step fails if any GIF is missing or over its cap
          for m in listen speak two-way; do
            python scripts/readme_gif_drive.py "$m" --out-dir "$RUNNER_TEMP/gifs" --zh-wav "$RUNNER_TEMP/zh.wav" || rc=1
          done
          python scripts/readme_gif.py check --dir "$RUNNER_TEMP/gifs" --present-only | tee -a "$GITHUB_STEP_SUMMARY" || rc=1
          exit $rc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: readme-gifs
          path: ${{ runner.temp }}/gifs/
          if-no-files-found: warn
          retention-days: 14
