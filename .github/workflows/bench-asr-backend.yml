name: bench-asr-backend
# #1753: faster-whisper CPU vs whisper.cpp CPU on the pinned FLEURS smoke clips (en / ru / ja / zh, eval/ci_smoke.json),
# Whisper small and large-v3-turbo: WER / CER and ASR real-time factor per backend (scripts/bench/asr_backend_bench.py).
# Hosted runners have no GPU, so whisper.cpp is built without Vulkan here; the Vulkan column is the owner's AMD laptop.
# Numbers only, never gated, not part of any release gate.
on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - scripts/bench/asr_backend_bench.py
      - .github/workflows/bench-asr-backend.yml

permissions: {}

concurrency:
  group: bench-asr-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  PYTHONUTF8: "1"

jobs:
  bench:
    if: github.repository == 'sunososobro-hub/tinglongwu'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu
        run: pip install -e .
      - name: Paths
        run: echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
      - name: Models (faster-whisper + pinned whisper.cpp ggml)
        run: |
          tlwu-setup --whisper small --whisper large-v3-turbo --whisper-cpp small --whisper-cpp large-v3-turbo \
            --models-dir "$TLWU_MODELS"
      - name: Smoke clips
        run: python scripts/bench/make_ci_smoke.py --out eval_data/smoke
      - name: Build whisper.cpp (pinned commit, CPU) into tlwu-whisper
        run: python scripts/build_whisper_vulkan.py --out "$RUNNER_TEMP/whisper-cpu" --cpu
      - name: Bench
        run: |
          set -o pipefail
          python scripts/bench/asr_backend_bench.py --data eval_data/smoke --models-dir "$TLWU_MODELS" \
            --sizes small,large-v3-turbo --backends fw-cpu,wcpp-cpu \
            --whisper-lib "$RUNNER_TEMP/whisper-cpu/libtlwu-whisper.so" --json asr_backends.json \
            | tee bench.log
          sed -n '/^ASR backends/,$p' bench.log >> "$GITHUB_STEP_SUMMARY"
          echo "runner cores: $(nproc)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bench-asr-backend
          path: |
            asr_backends.json
            bench.log
