name: eval-fffd
# #632: reproduce the macOS "boxes in Chinese output" report with the shipped Hy-MT2-1.8B Q4_K_M GGUF on the CPU,
# default sampling (temperature 0.7), on the macos-latest runner: the reporter's four screenshot lines x 50 seeds
# plus 200 FLORES-200 eng_Latn lines x 5 seeds. scripts/bench/fffd_repro.py counts outputs with box characters
# before (the model's sampled text, what the old code printed) and after the #632 retry-then-strip path.
# Only runs when this workflow or the script changes, or by hand (workflow_dispatch, once on the default branch).
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/eval-fffd.yml
      - scripts/bench/fffd_repro.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-fffd-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  PYTHONUTF8: "1"

jobs:
  fffd:
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tlwu + Hy-MT2 CPU engine (same path as mac_install.sh)
        run: |
          pip install -e .
          source scripts/tlwu_common.sh
          tlwu_install_llama python requirements-llama-cpu.txt
      - name: Paths
        run: |
          echo "TLWU_MODELS=$HOME/tlwu-models" >> "$GITHUB_ENV"
          echo "BENCH=$HOME/bench" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/tlwu-models
            ~/bench/flores200_dataset
          key: eval-fffd-v1-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py') }}
      - name: Hy-MT2 1.8B + FLORES-200
        run: |
          tlwu-setup --hymt --models-dir "$TLWU_MODELS"
          python scripts/bench/fetch_data.py --out "$BENCH" --fleurs ""
      - name: Translate (CPU, default sampling, fixed seeds)
        run: |
          python scripts/bench/fffd_repro.py --models-dir "$TLWU_MODELS" --flores "$BENCH/flores200_dataset" --out out
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("out/fffd.summary.json", encoding="utf-8"))
          print("| set | n | with boxes before | with boxes after |\n|---|---|---|---|")
          for k in ("screenshot", "flores"):
              if k in s:
                  print(f"| {k} | {s[k]['n']} | {s[k]['before']} | {s[k]['after']} |")
          print(f"\nreproduced: {s['reproduced']}, greedy retries: {s['retries']}, sampling: {s['sampling']}")
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fffd-macos
          path: out/
          if-no-files-found: warn
