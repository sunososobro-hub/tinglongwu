name: acceptance-windows
# Scripted acceptance for issues that waited on a hands-on Windows check (status:needs-test).
# Headless: windows-latest, CPU only, no mic, no GPU, no models. The exe build + --smoke lives in
# windows-build.yml (#363); this job only runs the issue-mapped tests in scripts/acceptance_needs_test.py.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether the steps are needed (docs / mobile-only PRs still report success)
        id: changes
        shell: bash
        run: |
          # #976: a pull_request that only touches docs / markdown / .agent / mobile/** cannot change the desktop app.
          # push and workflow_dispatch always run in full (the release gate needs a real success on the dev tip).
          build=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if files=$(git diff --no-renames --name-only "origin/$GITHUB_BASE_REF...HEAD") && [ -n "$files" ]; then
              # --no-renames: a desktop file moved into mobile/ still counts; no grep -q: an early exit + SIGPIPE under pipefail would read as "skip"
              if ! echo "$files" | grep -Ev '^(docs/|\.agent/|mobile/)|\.md$' >/dev/null; then build=false; fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [ "$build" = false ]; then echo "docs/mobile-only PR: skipping the steps (job still reports success)"; else echo "steps needed"; fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.changes.outputs.build == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.changes.outputs.build == 'true'
        run: pip install -e ".[dev]"
      - name: Acceptance (issue -> tests table)
        if: steps.changes.outputs.build == 'true'
        id: acceptance
        shell: bash
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python scripts/acceptance_needs_test.py | tee acceptance.md
      - name: Job summary
        if: ${{ (always()) && steps.changes.outputs.build == 'true' }}
        shell: bash
        run: |
          if [ -f acceptance.md ]; then cat acceptance.md >> "$GITHUB_STEP_SUMMARY"; else echo "acceptance script produced no table" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Fail if acceptance failed
        if: ${{ (steps.acceptance.outcome == 'failure') && steps.changes.outputs.build == 'true' }}
        shell: bash
        run: exit 1
