name: acceptance-windows
# Scripted acceptance for issues that waited on a hands-on Windows check (status:needs-test).
# Headless: windows-latest, CPU only, no mic, no GPU, no models. The exe build + --smoke lives in
# windows-build.yml (#363); this job only runs the issue-mapped tests in scripts/acceptance_needs_test.py.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Acceptance (issue -> tests table)
        id: acceptance
        shell: bash
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          python scripts/acceptance_needs_test.py | tee acceptance.md
      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f acceptance.md ]; then cat acceptance.md >> "$GITHUB_STEP_SUMMARY"; else echo "acceptance script produced no table" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Fail if acceptance failed
        if: steps.acceptance.outcome == 'failure'
        shell: bash
        run: exit 1
