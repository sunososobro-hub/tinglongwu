name: model-pins
# #1401: refresh committed model pins (tinglongwu_setup/manifest.json) on a GitHub-hosted runner, because the
# cloud agent sandbox cannot reach huggingface.co (403). Runs `scripts/make_model_pins.py --only <prefix>` (default
# `whisper-cpp-`: the whisper.cpp ggml models for the Vulkan ASR) and prints the manifest diff to the log and the
# step summary; the refreshed manifest is uploaded as the `model-pins` artifact. It never pushes: a maintainer
# reviews the diff and commits it in a `fix/N` PR (model pins are g4, so that PR needs an Opus PASS).
# Only runs when this workflow or the pin script changes, or by hand (workflow_dispatch, once on the default branch).
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/model-pins.yml
      - scripts/make_model_pins.py
  workflow_dispatch:
    inputs:
      only:
        description: "refresh only model keys with this prefix (e.g. whisper-cpp-, whisper-cpp-small)"
        default: "whisper-cpp-"

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -m pip install huggingface_hub==2.4.0  # same pin as requirements.txt
      - name: refresh pins
        env:
          ONLY: ${{ inputs.only || 'whisper-cpp-' }}
        run: python scripts/make_model_pins.py --only "$ONLY"
      - name: diff
        run: |
          git --no-pager diff --stat tinglongwu_setup/manifest.json
          git --no-pager diff tinglongwu_setup/manifest.json | tee pins.diff
          { echo '### model pins diff'; echo '```diff'; cat pins.diff; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-pins
          path: |
            tinglongwu_setup/manifest.json
            pins.diff
