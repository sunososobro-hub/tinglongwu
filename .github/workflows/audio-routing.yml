name: audio-routing
# #849 (owner 2026-11-14): the audio-routing part of hw-tests runs on a GitHub-hosted windows-latest runner, so it
# no longer depends on the owner's home PC. The runner has no sound card: VB-CABLE (official zip, pinned SHA-256,
# the same package tinglongwu/vbcable.py points at) is the virtual audio device; the Windows audio service is started
# first. Steps: device listing, a signal check (a 440 Hz tone played into "CABLE Input" must be captured on "CABLE
# Output" with RMS above SILENCE_RMS_THRESHOLD, scripts/cable_loopback_check.py), and speak_selftest through
# VB-CABLE (the same check as hw-tests.yml "#6 #207 #311-4", CPU models from the e2e cache).
# Required for the release PR alongside ci / e2e / windows-build (scripts/release_notes.py REQUIRED_CHECKS).
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
    inputs:
      play_device:
        description: "playback device for the signal check (a wrong name must fail: Verify of #849)"
        type: string
        default: "CABLE Input"

permissions:
  contents: read

concurrency:
  group: audio-routing-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  # official VB-Audio package; SHA-256 measured from that URL (#849); a changed file fails the job before anything runs
  VBCABLE_URL: https://download.vb-audio.com/Download_CABLE/VBCABLE_Driver_Pack45.zip
  VBCABLE_SHA256: b950e39f01af1d04ea623c8f6d8eb9b6ea5c477c637295fabf20631c85116bfb

jobs:
  audio-routing:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Windows audio service (disabled on hosted runners)
        shell: pwsh
        run: |
          foreach ($s in 'AudioEndpointBuilder', 'Audiosrv') {
            Set-Service $s -StartupType Automatic
            Start-Service $s
          }
          Get-Service AudioEndpointBuilder, Audiosrv | Format-Table -AutoSize Name, Status
          # Windows privacy: desktop apps may record (else every capture fails with 0x80070005 E_ACCESSDENIED)
          $cs = 'SOFTWARE\Microsoft\Windows\CurrentVersion\CapabilityAccessManager\ConsentStore\microphone'
          foreach ($k in "HKLM:\$cs", "HKCU:\$cs", "HKCU:\$cs\NonPackaged") {
            New-Item -Path $k -Force | Out-Null
            Set-ItemProperty -Path $k -Name Value -Value Allow -Type String
          }

      - name: VB-CABLE (official zip, pinned SHA-256, silent install)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\vbcable.zip"
          Invoke-WebRequest $env:VBCABLE_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Output "VB-CABLE zip SHA-256: $hash"
          if ($hash -ne $env:VBCABLE_SHA256) { Write-Output "::error::VB-CABLE SHA-256 $hash does not match the pin '$env:VBCABLE_SHA256'"; exit 1 }
          $dir = "$env:RUNNER_TEMP\vbcable"
          Expand-Archive $zip -DestinationPath $dir
          # trust the driver's publisher first, so the silent install shows no "Windows Security" prompt
          $cat = Get-ChildItem $dir -Filter *.cat | Where-Object Name -like '*64*' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $cat.FullName
          Write-Output "catalog $($cat.Name) signer: $($sig.SignerCertificate.Subject) ($($sig.Status))"
          $cer = "$env:RUNNER_TEMP\vbaudio.cer"
          [IO.File]::WriteAllBytes($cer, $sig.SignerCertificate.Export('Cert'))
          certutil -addstore -f TrustedPublisher $cer | Out-Null
          $p = Start-Process -FilePath "$dir\VBCABLE_Setup_x64.exe" -ArgumentList '-i', '-h' -Wait -PassThru
          Write-Output "setup exit code $($p.ExitCode)"
          for ($i = 0; $i -lt 60; $i++) {
            $dev = Get-CimInstance Win32_SoundDevice | Where-Object Name -like '*VB-Audio*'
            if ($dev) { break }
            Start-Sleep 2
          }
          Get-CimInstance Win32_SoundDevice | Format-Table -AutoSize Name, Status
          if (-not $dev) { Write-Output "::error::VB-CABLE device did not appear after the install"; exit 1 }
          Restart-Service Audiosrv -Force

      - name: Install tlwu + Hy-MT2 CPU engine (no dev extra, so speak_selftest does not wait for a quiet CPU)
        shell: bash
        run: |
          pip install -e .
          pip install -r requirements-llama-cpu.txt --only-binary=:all:

      - name: "#849 device listing + signal check: tone into CABLE Input is captured on CABLE Output"
        shell: bash
        env:
          PLAY: ${{ inputs.play_device || 'CABLE Input' }}
        run: |
          python scripts/cable_loopback_check.py --play "$PLAY" --record "CABLE Output" --json "$RUNNER_TEMP/loopback.json"
          { echo '### #849 VB-CABLE signal check (windows-latest)'; echo '```'; cat "$RUNNER_TEMP/loopback.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "#849 negative control: a wrong device name must fail the signal check"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if python scripts/cable_loopback_check.py --play "CABLE Inputx" --record "CABLE Output"; then
            echo "::error::the signal check passed with a wrong device name"; exit 1
          fi
          echo "wrong device name failed as expected" >> "$GITHUB_STEP_SUMMARY"

      - name: Models dir
        if: ${{ !cancelled() }}
        shell: bash
        run: echo "TLWU_MODELS=$(cygpath -m "$HOME/tlwu-models")" >> "$GITHUB_ENV"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: ${{ !cancelled() }}
        with:
          path: ~/tlwu-models
          key: e2e-models-v3-windows-${{ hashFiles('tinglongwu_setup/manifest.json', 'tinglongwu_setup/downloader.py') }}   # same set as e2e.yml
      - name: Models (smoke set) + Kokoro voice venv + Russian voice
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          tlwu-setup --whisper small --hymt --pair zh-en --pair en-zh --pair en-ru --pair ru-en --allow-unpinned --models-dir "$TLWU_MODELS"
          tlwu-setup --talk --talk-venv "$(cygpath -m "$HOME/tts-kokoro")" --talk-launcher "$RUNNER_TEMP/tlwu-talk.ps1" --models-dir "$TLWU_MODELS"
          tlwu-setup --vosk-tts-ru --models-dir "$TLWU_MODELS"
          echo "TLWU_KOKORO_PYTHON=$(cygpath -m "$HOME/tts-kokoro/Scripts/python.exe")" >> "$GITHUB_ENV"
          echo "TLWU_KOKORO_MODEL=$TLWU_MODELS/kokoro" >> "$GITHUB_ENV"
          TLWU_KOKORO_PYTHON="$(cygpath -m "$HOME/tts-kokoro/Scripts/python.exe")" TLWU_KOKORO_MODEL="$TLWU_MODELS/kokoro" \
            python scripts/ci_e2e.py zh-wav "$RUNNER_TEMP/zh.wav" --repeat 2

      - name: "#6 #207 #311-4 speak_selftest through VB-CABLE (en), records CABLE Output"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python scripts/speak_selftest.py --clip "$RUNNER_TEMP/zh.wav" --to en --models-dir "$TLWU_MODELS" \
            --tts-python "$TLWU_KOKORO_PYTHON" --tts-model "$TLWU_KOKORO_MODEL" --json "$RUNNER_TEMP/speak_en.json"
          { echo '### speak_selftest en (windows-latest, VB-CABLE)'; echo '```'; cat "$RUNNER_TEMP/speak_en.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: "#311 item 4 speak_selftest --to ru: Russian voice reaches CABLE Input"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python scripts/speak_selftest.py --clip "$RUNNER_TEMP/zh.wav" --to ru --models-dir "$TLWU_MODELS" \
            --tts-python "$TLWU_KOKORO_PYTHON" --tts-model "$TLWU_KOKORO_MODEL" --json "$RUNNER_TEMP/speak_ru.json"
          { echo '### speak_selftest ru (windows-latest, VB-CABLE)'; echo '```'; cat "$RUNNER_TEMP/speak_ru.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
