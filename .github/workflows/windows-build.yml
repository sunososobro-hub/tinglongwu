name: windows-build
# Builds the packaged Windows app (tlwu.exe) with the same script as the manual pack machine
# (packaging/build_windows.py), runs `tlwu.exe --smoke` from the unpacked zip and uploads the zip (#363).
# #923: two layers. The runtime layer (Python + third-party packages + tlwu.exe) comes from a cache and is rebuilt only
# when requirements*.txt or the packaging code change; the app layer (tinglongwu/, tlwu_app/, tinglongwu_setup/) is
# repacked on every run, so an app-only change finishes in a few minutes.
# #341: also runs scripts/win_smoke.ps1 (--smoke + 10 s GUI launch) and uploads the logs; docs-only PRs skip the build and stay green.
# CPU-only build: the runner has no GPU, so llama-cpp-python comes from the CPU wheel index and no CUDA DLLs are copied.
on:
  push:
    branches: [dev]
  pull_request:  # always reports (so it can be a required check); build steps run only for packaging-relevant diffs (#341)
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  # #888: only PR runs cancel each other. dev pushes always finish, or no dev run ever saves the build cache (since #923: the runtime layer)
  # (11 of 12 dev builds were cancelled on 2026-11-14 and PR builds fell from ~13 to ~40 min).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # #1540: no duplicate run on the release PR (release/vX.Y.Z -> main); the snapshot commit already has its
    # dev push / release-pr.yml dispatch run, which is what the release gate reads
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      build: ${{ steps.changes.outputs.build }}
      artifact: tinglongwu-win64-${{ steps.sha.outputs.short }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Build paths (absolute, no '..', which upload-artifact rejects)
        shell: bash
        run: |
          echo "TLWU_BUILD_ROOT=$RUNNER_TEMP\\tlwu-build" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Decide whether the build is needed (path filter that still reports success)
        id: changes
        shell: bash
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_BASE_REF" != main ]; then
            if files=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD"); then
              echo "$files" | grep -Eq '^(packaging/|installer/|tinglongwu/|tlwu_app/|tinglongwu_setup/|requirements[^/]*$|pyproject\.toml$|scripts/[^/]*\.ps1$|\.github/workflows/)' || build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build needed: $build"
      - name: Runtime layer cache (restore; key = the files of packaging/runtime_layer.py KEY_GLOBS)
        id: runtime
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TLWU_BUILD_ROOT }}\runtime
          key: tlwu-runtime-${{ runner.os }}-py312-lite-${{ hashFiles('requirements*.txt', 'packaging/build_windows.py', 'packaging/runtime_layer.py', 'packaging/launcher/**', 'packaging/stubs/**', 'tinglongwu/gui/assets/tinglongwu.ico') }}
      - name: Python (runtime layer restored, no pip cache needed)
        if: steps.changes.outputs.build == 'true' && steps.runtime.outputs.cache-hit == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Python + pip cache (the runtime layer is rebuilt)
        if: steps.changes.outputs.build == 'true' && steps.runtime.outputs.cache-hit != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-llama-cpu.txt
      - name: Build (packaging/build_windows.py; makes the packaging venv itself when the runtime layer is rebuilt; runs tlwu.exe --smoke before zipping)
        id: build
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          python packaging\build_windows.py --lite
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      # #888: saved from dev pushes only (PR saves fill the cache quota with per-PR copies and evict the dev entry
      # that every PR restores from), right after the build so a later failing check step does not lose it. A PR that
      # changes the key files rebuilds the layer on each push; that takes about a minute.
      - name: Runtime layer cache (save the rebuilt layer, dev pushes only)
        if: always() && github.event_name == 'push' && steps.build.outcome == 'success' && steps.runtime.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.TLWU_BUILD_ROOT }}\runtime
          key: ${{ steps.runtime.outputs.cache-primary-key }}
      - name: Core zip release check (scripts/release_check.py, 300 MB budget, no CUDA files, #638)
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          python scripts\release_check.py "$env:TLWU_BUILD_ROOT\dist\tinglongwu-win64.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: DLL check (scripts/check_dist_dlls.py, if present)
        if: steps.changes.outputs.build == 'true' && (hashFiles('scripts/check_dist_dlls.py') != '')
        shell: pwsh
        run: |
          python scripts\check_dist_dlls.py "$env:TLWU_BUILD_ROOT\dist\tlwu"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test the unpacked zip (llama_cpp must load too, see #398)
        if: steps.changes.outputs.build == 'true'
        shell: python
        run: |
          import os, subprocess, sys, zipfile
          from pathlib import Path

          root = Path(os.environ["TLWU_BUILD_ROOT"]).resolve()
          zp = root / "dist" / "tinglongwu-win64.zip"
          out = root / "unzipped"
          with zipfile.ZipFile(zp) as z:
              z.extractall(out)
          app = out / "tlwu"
          print(f"zip: {zp.stat().st_size >> 20} MB, files: {sum(1 for f in app.rglob('*') if f.is_file())}")
          r = subprocess.run([str(app / "tlwu.exe"), "--smoke"], cwd=app, capture_output=True,
                             encoding="utf-8", errors="replace", timeout=600)
          print(r.stdout, r.stderr, sep="\n")
          lines = r.stdout.splitlines()
          problems = []
          if r.returncode != 0:
              problems.append(f"tlwu.exe --smoke exit code {r.returncode}")
          if not any(l.startswith("smoke: OK") for l in lines):
              problems.append("no 'smoke: OK' line")
          if not any(l.startswith("OK   llama_cpp ") for l in lines):
              problems.append("llama_cpp did not load (optional in --smoke, required in CI: #398)")
          if problems:
              sys.exit("FAILED: " + "; ".join(problems))
      - name: Packaged-app smoke + GUI launch (scripts/win_smoke.ps1, #341)
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          .\scripts\win_smoke.ps1 -AppDir "$env:TLWU_BUILD_ROOT\unzipped\tlwu" -LogDir "$env:RUNNER_TEMP\smoke-logs" -GuiSeconds 10
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload smoke logs
        if: always() && steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-smoke-logs
          path: ${{ runner.temp }}\smoke-logs
          retention-days: 14
          if-no-files-found: warn
      - name: Short sha
        if: steps.changes.outputs.build == 'true'
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.changes.outputs.build == 'true'
        with:
          name: tinglongwu-win64-${{ steps.sha.outputs.short }}
          path: ${{ env.TLWU_BUILD_ROOT }}\dist\tinglongwu-win64.zip
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

  upgrade:
    # #923 review C1 / C2: every existing user gets the new core on top of the old folder (the auto-update runs the
    # wizard over {app}; Inno Setup deletes nothing). Baseline = the latest published release, whatever it is.
    #   C1  unzip the released core zip, unzip the new one over it, tlwu.exe --smoke + GUI launch
    #   C2  build the wizard from the new core, install silently into a fresh folder and over the released version,
    #       tlwu.exe --smoke in each installed folder (Acceptance 3 of #923: the wizard installs and starts it)
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Work folder (W, outside the checkout)
        shell: bash
        run: echo "W=$RUNNER_TEMP\\upgrade" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}\upgrade\new
      - name: Baseline = core zip of the latest published release (checked against its SHA256SUMS.txt)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$W/base" && cd "$W/base"
          gh release download --repo "$GITHUB_REPOSITORY" -p tinglongwu-win64.zip -p SHA256SUMS.txt
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '"baseline release: " + .tagName'
          grep ' tinglongwu-win64.zip$' SHA256SUMS.txt | sha256sum -c -
      - name: C1 new core zip unpacked over the released one, then tlwu.exe --smoke (scripts/upgrade_check.py overlay)
        shell: pwsh
        run: |
          python scripts\upgrade_check.py overlay --old-zip "$env:W\base\tinglongwu-win64.zip" --new-zip "$env:W\new\tinglongwu-win64.zip" --dir "$env:W\overlay"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: C1 GUI launch in the overlaid folder (scripts/win_smoke.ps1)
        shell: pwsh
        run: |
          .\scripts\win_smoke.ps1 -AppDir "$env:W\overlay\tlwu" -LogDir "$env:W\logs\overlay" -GuiSeconds 10
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: C2 build the wizard from the new core (installer/build_installer.py --core-dir)
        shell: pwsh
        run: |
          python scripts\upgrade_check.py unzip --zip "$env:W\new\tinglongwu-win64.zip" --dir "$env:W\core"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          python installer\build_installer.py --core-dir "$env:W\core\tlwu"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist\installer\tinglongwu-setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "no tinglongwu-setup-*.exe in dist\installer" }
          "SETUP_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: C2 wizard, silent, into a fresh folder, then tlwu.exe --smoke there (scripts/upgrade_check.py wizard)
        shell: pwsh
        run: |
          python scripts\upgrade_check.py wizard --setup "$env:SETUP_EXE" --dir "$env:W\fresh install" --log "$env:W\logs\setup-fresh.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: C2 wizard, silent, over the released version, then tlwu.exe --smoke there
        shell: pwsh
        run: |
          python scripts\upgrade_check.py unzip --zip "$env:W\base\tinglongwu-win64.zip" --dir "$env:W\old"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts\upgrade_check.py wizard --setup "$env:SETUP_EXE" --dir "$env:W\old\tlwu" --log "$env:W\logs\setup-over-old.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: U1 app-layer-only update, same runtime key (plan app < 15 MB, --apply-app, smoke; truncated zip rolls back)
        shell: pwsh
        run: |
          python scripts\upgrade_check.py app-update --old-zip "$env:W\base\tinglongwu-win64.zip" --core-dir "$env:W\core\tlwu" --dir "$env:W\appupd"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: U2 forced runtime key mismatch, the plan is the full installer (its install path is the C2 steps above)
        shell: pwsh
        run: |
          python scripts\upgrade_check.py plan-full --old-zip "$env:W\base\tinglongwu-win64.zip" --core-dir "$env:W\core\tlwu" --dir "$env:W\fullupd"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload upgrade logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: upgrade-logs
          path: |
            ${{ runner.temp }}\upgrade\logs
            ${{ runner.temp }}\upgrade\fresh install\install.log
            ${{ runner.temp }}\upgrade\old\tlwu\install.log
          retention-days: 14
          if-no-files-found: warn
