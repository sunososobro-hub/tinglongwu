name: windows-build
# Builds the packaged Windows app (tlwu.exe) with the same script as the manual pack machine
# (packaging/build_windows.py), runs `tlwu.exe --smoke` from the unpacked zip and uploads the zip (#363).
# #341: also runs scripts/win_smoke.ps1 (--smoke + 10 s GUI launch) and uploads the logs; docs-only PRs skip the build and stay green.
# CPU-only build: the runner has no GPU, so llama-cpp-python comes from the CPU wheel index and no CUDA DLLs are copied.
on:
  push:
    branches: [dev]
  pull_request:  # always reports (so it can be a required check); build steps run only for packaging-relevant diffs (#341)
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Build paths (absolute, no '..', which upload-artifact rejects)
        shell: bash
        run: |
          echo "TLWU_BUILD_ROOT=$RUNNER_TEMP\\tlwu-build" >> "$GITHUB_ENV"
          echo "NUITKA_CACHE_DIR=$RUNNER_TEMP\\nuitka-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Decide whether the build is needed (path filter that still reports success)
        id: changes
        shell: bash
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_BASE_REF" != main ]; then
            if files=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD"); then
              echo "$files" | grep -Eq '^(packaging/|installer/|tinglongwu/gui/|tlwu_app/|requirements[^/]*$|pyproject\.toml$|scripts/[^/]*\.ps1$|\.github/workflows/)' || build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "build needed: $build"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.changes.outputs.build == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-llama-cpu.txt
      - name: Nuitka compile cache
        if: steps.changes.outputs.build == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-llama-cpu.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('requirements.txt', 'requirements-llama-cpu.txt') }}-
            nuitka-${{ runner.os }}-
      - name: Packaging venv (requirements.txt without av / psutil, CPU llama-cpp-python, Nuitka)
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          python -m venv "$env:RUNNER_TEMP\pack-venv"
          $py = "$env:RUNNER_TEMP\pack-venv\Scripts\python.exe"
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^(av|psutil)==' } | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\req-pack.txt"
          & $py -m pip install --upgrade pip
          if ($LASTEXITCODE) { exit 1 }
          & $py -m pip install -r "$env:RUNNER_TEMP\req-pack.txt"
          if ($LASTEXITCODE) { exit 1 }
          & $py -m pip install -r requirements-llama-cpu.txt --only-binary=:all:
          if ($LASTEXITCODE) { exit 1 }
          & $py -m pip install nuitka ordered-set zstandard
          if ($LASTEXITCODE) { exit 1 }
          & $py -m nuitka --version
          "PACK_PY=$py" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Build (packaging/build_windows.py, runs tlwu.exe --smoke before zipping)
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          & $env:PACK_PY packaging\build_windows.py --lite
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: DLL check (scripts/check_dist_dlls.py, if present)
        if: steps.changes.outputs.build == 'true' && (hashFiles('scripts/check_dist_dlls.py') != '')
        shell: pwsh
        run: |
          & $env:PACK_PY scripts\check_dist_dlls.py "$env:TLWU_BUILD_ROOT\dist\tlwu"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test the unpacked zip (llama_cpp must load too, see #398)
        if: steps.changes.outputs.build == 'true'
        shell: python
        run: |
          import os, subprocess, sys, zipfile
          from pathlib import Path

          root = Path(os.environ["TLWU_BUILD_ROOT"]).resolve()
          zp = root / "dist" / "tinglongwu-win64.zip"
          out = root / "unzipped"
          with zipfile.ZipFile(zp) as z:
              z.extractall(out)
          app = out / "tlwu"
          print(f"zip: {zp.stat().st_size >> 20} MB, files: {sum(1 for f in app.rglob('*') if f.is_file())}")
          r = subprocess.run([str(app / "tlwu.exe"), "--smoke"], cwd=app, capture_output=True,
                             encoding="utf-8", errors="replace", timeout=600)
          print(r.stdout, r.stderr, sep="\n")
          lines = r.stdout.splitlines()
          problems = []
          if r.returncode != 0:
              problems.append(f"tlwu.exe --smoke exit code {r.returncode}")
          if not any(l.startswith("smoke: OK") for l in lines):
              problems.append("no 'smoke: OK' line")
          if not any(l.startswith("OK   llama_cpp ") for l in lines):
              problems.append("llama_cpp did not load (optional in --smoke, required in CI: #398)")
          if problems:
              sys.exit("FAILED: " + "; ".join(problems))
      - name: Packaged-app smoke + GUI launch (scripts/win_smoke.ps1, #341)
        if: steps.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          .\scripts\win_smoke.ps1 -AppDir "$env:TLWU_BUILD_ROOT\unzipped\tlwu" -LogDir "$env:RUNNER_TEMP\smoke-logs" -GuiSeconds 10
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload smoke logs
        if: always() && steps.changes.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: win-smoke-logs
          path: ${{ runner.temp }}\smoke-logs
          retention-days: 14
          if-no-files-found: warn
      - name: Short sha
        if: steps.changes.outputs.build == 'true'
        id: sha
        shell: bash
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.changes.outputs.build == 'true'
        with:
          name: tinglongwu-win64-${{ steps.sha.outputs.short }}
          path: ${{ env.TLWU_BUILD_ROOT }}\dist\tinglongwu-win64.zip
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
