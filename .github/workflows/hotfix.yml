name: hotfix
# #950 hotfix lane, part 2 (#957): one urgent P0/P1 bug fix from dev onto the latest release, built ONCE and tested
# on that very build, in <= 20 min (scripts/hotfix_plan.py HOTFIX_BUDGET_MIN). This part is a dry run only:
#   plan     : scripts/hotfix_plan.py plan (#956: fix = merged PR / sha on dev, issue bug + P0/P1, no cadence release
#              pending, tag = latest release patch + 1), then `apply` on the base tag: cherry-pick the fix and set
#              __version__ to the tag (local commits only). A base older than the layered core (#923; v0.3.5) is
#              refused there: the upgrade overlay and wizard checks need its runtime-layer.json. The result travels to the other jobs as a git bundle, so
#              every job builds and tests the same commit (its sha is checked).
#   test     : the ci `test` suite (normal + network-disabled) on that commit
#   windows  : build_windows.py --core once (runtime layer from the shared cache, app layer repacked; the same call as
#              release.yml), scripts/release_check.py core budget, packaging/release_check.py (check_dist_dlls, llama CPU
#              instructions, tlwu.exe --smoke, --selftest), the upgrade overlay on the base release + GUI launch,
#              the wizard built from that core and installed silently fresh and over the base release
#   summary  : uploads the tested zip + wizard + SHA256SUMS.txt as ONE artifact (only when every gate passed) and writes
#              the gate table and the dispatch -> upload wall time into the job summary
# publish=true is #958 (part 3) and fails here. Nothing in this workflow pushes, tags or releases: no job has
# `contents: write`. hotfix.yml is release-producing: changes need an Opus PASS (rules section 14 after #959).
on:
  workflow_dispatch:
    inputs:
      fix:
        description: "merged PR number or commit sha on dev (a P0/P1 bug fix)"
        required: true
        type: string
      publish:
        description: "publish the hotfix release (not available yet: #958); false = dry run"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: hotfix
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read   # the fix PR, the open bump PRs
      issues: read          # the linked issue's labels
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      base: ${{ steps.plan.outputs.base }}
      fix: ${{ steps.plan.outputs.fix }}
      issue: ${{ steps.plan.outputs.issue }}
      head: ${{ steps.apply.outputs.head }}
      tree: ${{ steps.apply.outputs.tree }}
    steps:
      - name: publish=true is part 3 (#958); this workflow only does dry runs
        if: inputs.publish
        run: |
          echo "::error::publish=true is not available yet (#958); run with publish=false"
          exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # the base tag and the fix commit
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Plan (scripts/hotfix_plan.py plan)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FIX: ${{ inputs.fix }}
        run: python scripts/hotfix_plan.py plan --fix "$FIX"
      - name: Cherry-pick the fix onto the base tag and set __version__ (scripts/hotfix_plan.py apply)
        id: apply
        env:
          BASE: ${{ steps.plan.outputs.base }}
          FIX: ${{ steps.plan.outputs.fix }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          cp scripts/hotfix_plan.py "$RUNNER_TEMP/hotfix_plan.py"   # the base tag may carry an older copy
          git fetch -q --no-tags origin dev
          git checkout -q --detach "refs/tags/$BASE"
          python "$RUNNER_TEMP/hotfix_plan.py" apply --fix "$FIX" --tag "$TAG"
          git branch hotfix HEAD
          git bundle create "$RUNNER_TEMP/hotfix.bundle" "refs/tags/$BASE..hotfix"
          { echo "base \`$BASE\` + fix \`$FIX\` -> \`$TAG\`"; echo; git log --oneline "refs/tags/$BASE..hotfix" | sed 's/^/    /'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotfix-src
          path: ${{ runner.temp }}/hotfix.bundle
          retention-days: 3
          if-no-files-found: error

  test:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.plan.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hotfix-src
          path: ${{ runner.temp }}/src
      - name: Check out the planned hotfix commit (from the bundle; its sha must match the plan)
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head }}
        run: |
          set -euo pipefail
          git fetch -q "$RUNNER_TEMP/src/hotfix.bundle" hotfix
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (same as ci test)
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 xvfb && exit 0
            sleep 15
          done
          exit 1
      - name: Install
        run: pip install -e ".[dev]" "pytest-timeout==2.3.1"
      - name: Tests, normal (real-Tk GUI tests under xvfb, as in ci)
        timeout-minutes: 20
        env:
          TLWU_REQUIRE_DISPLAY: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q --timeout=120
      - name: Tests with the network physically disabled (as in ci)
        run: bash scripts/ci_offline.sh python -m pytest -q

  windows:
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read   # the base release's core zip (baseline for the upgrade checks)
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    outputs:
      build: ${{ steps.build.outcome }}
      budget: ${{ steps.budget.outcome }}
      smoke: ${{ steps.smoke.outcome }}
      overlay: ${{ steps.overlay.outcome }}
      gui: ${{ steps.gui.outcome }}
      wizard_fresh: ${{ steps.wizard_fresh.outcome }}
      wizard_upgrade: ${{ steps.wizard_upgrade.outcome }}
    steps:
      - name: Work folders outside the checkout (absolute; upload-artifact rejects '..')
        shell: bash
        run: |
          echo "TLWU_BUILD_ROOT=$RUNNER_TEMP\\tlwu-build" >> "$GITHUB_ENV"
          echo "W=$RUNNER_TEMP\\upgrade" >> "$GITHUB_ENV"
      # the checks (scripts/*_check.py, packaging/release_check.py, win_smoke.ps1) come from the dispatched ref, since an
      # older base tag may lack them (v0.3.5 has no upgrade_check.py); what ships (and its build script) is ./hotfix
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ needs.plan.outputs.base }}
          path: hotfix
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hotfix-src
          path: ${{ runner.temp }}\src
      - name: Check out the planned hotfix commit in ./hotfix (from the bundle; its sha must match the plan)
        shell: bash
        working-directory: hotfix
        env:
          HEAD_SHA: ${{ needs.plan.outputs.head }}
        run: |
          set -euo pipefail
          git fetch -q "$(cygpath -u "$RUNNER_TEMP")/src/hotfix.bundle" hotfix
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Runtime layer cache (restore only; same key as release.yml / windows-build.yml, #923)
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}\tlwu-build\runtime
          # the key of the hotfix tree's files (= the base release's layer unless the fix touches them)
          key: tlwu-runtime-${{ runner.os }}-py312-lite-${{ hashFiles('hotfix/requirements*.txt', 'hotfix/packaging/build_windows.py', 'hotfix/packaging/runtime_layer.py', 'hotfix/packaging/launcher/**', 'hotfix/packaging/stubs/**', 'hotfix/tinglongwu/gui/assets/tinglongwu.ico') }}
      - name: Build the core zip once (the hotfix tree's build_windows.py --core, as release.yml)
        id: build
        shell: pwsh
        working-directory: hotfix
        run: |
          python packaging\build_windows.py --core
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Core zip budget (scripts/release_check.py)
        id: budget
        shell: pwsh
        run: |
          python scripts\release_check.py "$env:TLWU_BUILD_ROOT\dist\tinglongwu-win64.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Release checks on that zip (check_dist_dlls, llama CPU instructions, tlwu.exe --smoke, --selftest)
        id: smoke
        shell: pwsh
        run: |
          python packaging\release_check.py "$env:TLWU_BUILD_ROOT\dist\tinglongwu-win64.zip" --work "$env:RUNNER_TEMP\rc" --report "$env:TLWU_BUILD_ROOT\dist\release-check.md"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Baseline = core zip of the base release (checked against its SHA256SUMS.txt)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p "$W/base" && cd "$W/base"
          gh release download "$BASE" --repo "$GITHUB_REPOSITORY" -p tinglongwu-win64.zip -p SHA256SUMS.txt
          grep ' tinglongwu-win64.zip$' SHA256SUMS.txt | sha256sum -c -
      - name: Upgrade overlay on the base release, then tlwu.exe --smoke (scripts/upgrade_check.py overlay)
        id: overlay
        shell: pwsh
        run: |
          python scripts\upgrade_check.py overlay --old-zip "$env:W\base\tinglongwu-win64.zip" --new-zip "$env:TLWU_BUILD_ROOT\dist\tinglongwu-win64.zip" --dir "$env:W\overlay"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: GUI launch in the overlaid folder (scripts/win_smoke.ps1)
        id: gui
        shell: pwsh
        run: |
          .\scripts\win_smoke.ps1 -AppDir "$env:W\overlay\tlwu" -LogDir "$env:W\logs\overlay" -GuiSeconds 10
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build the wizard from that core (the hotfix tree's installer/build_installer.py --core-dir)
        shell: pwsh
        working-directory: hotfix
        run: |
          python ..\scripts\upgrade_check.py unzip --zip "$env:TLWU_BUILD_ROOT\dist\tinglongwu-win64.zip" --dir "$env:W\core"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          python installer\build_installer.py --core-dir "$env:W\core\tlwu"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist\installer\tinglongwu-setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "no tinglongwu-setup-*.exe in dist\installer" }
          "SETUP_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Silent wizard into a fresh folder, then tlwu.exe --smoke (scripts/upgrade_check.py wizard)
        id: wizard_fresh
        shell: pwsh
        run: |
          python scripts\upgrade_check.py wizard --setup "$env:SETUP_EXE" --dir "$env:W\fresh install" --log "$env:W\logs\setup-fresh.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Silent wizard over the base release, then tlwu.exe --smoke
        id: wizard_upgrade
        shell: pwsh
        run: |
          python scripts\upgrade_check.py unzip --zip "$env:W\base\tinglongwu-win64.zip" --dir "$env:W\old"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts\upgrade_check.py wizard --setup "$env:SETUP_EXE" --dir "$env:W\old\tlwu" --log "$env:W\logs\setup-over-old.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Tested files for the summary job (the zip and the wizard that passed the checks above)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\tested" | Out-Null
          Copy-Item "$env:TLWU_BUILD_ROOT\dist\tinglongwu-win64.zip" "$env:RUNNER_TEMP\tested\"
          Copy-Item $env:SETUP_EXE "$env:RUNNER_TEMP\tested\"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotfix-build
          path: ${{ runner.temp }}\tested
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotfix-logs
          path: |
            ${{ runner.temp }}\upgrade\logs
            ${{ runner.temp }}\tlwu-build\dist\release-check.md
          retention-days: 14
          if-no-files-found: warn

  summary:
    needs: [plan, test, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read   # this run's created_at (dispatch time)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.test.result == 'success' && needs.windows.result == 'success'
        with:
          name: hotfix-build
          path: tested
      - name: SHA256SUMS.txt for the tested files
        id: sums
        if: needs.test.result == 'success' && needs.windows.result == 'success'
        run: |
          set -euo pipefail
          cd tested
          sha256sum tinglongwu-win64.zip tinglongwu-setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: upload
        if: steps.sums.outcome == 'success'
        with:
          name: hotfix-${{ needs.plan.outputs.tag }}-dry-run
          path: tested
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Gate table and wall time (scripts/hotfix_plan.py summary)
        if: always()   # also after a failed artifact hop: the table then says no artifact was uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED: ${{ steps.upload.outcome == 'success' }}
        run: |
          set -euo pipefail
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          uploaded=; [ "$UPLOADED" = true ] && uploaded=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 scripts/hotfix_plan.py summary --started "$started" --uploaded "$uploaded" \
            --gate "plan + cherry-pick=${{ needs.plan.result }}" \
            --gate "test=${{ needs.test.result }}" \
            --gate "windows build (--core)=${{ needs.windows.outputs.build }}" \
            --gate "core zip budget=${{ needs.windows.outputs.budget }}" \
            --gate "release checks (--smoke, --selftest)=${{ needs.windows.outputs.smoke }}" \
            --gate "upgrade overlay on the base release=${{ needs.windows.outputs.overlay }}" \
            --gate "GUI launch after overlay=${{ needs.windows.outputs.gui }}" \
            --gate "silent wizard, fresh=${{ needs.windows.outputs.wizard_fresh }}" \
            --gate "silent wizard, over the base release=${{ needs.windows.outputs.wizard_upgrade }}"
