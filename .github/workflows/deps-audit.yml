name: deps-audit
on:
  schedule:
    - cron: "17 20 * * 0"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: pip-audit (a found CVE is not a job failure)
        run: pip-audit --require-hashes -r requirements.lock.txt -f json -o audit.json || true
      - run: python scripts/deps_audit.py audit.json --apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
