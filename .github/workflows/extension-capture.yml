name: extension-capture
# #1159 cloud-verify (the owner chose this job over a hand test; it covers playback after capture starts, not the
# capture start on an already-playing tab): the unpacked MV3 extension in
# web/extension/capture runs in Playwright's Chromium under Xvfb with a real PulseAudio server whose null sink stands in for
# the speakers. tests/test_extension_capture_1159.py starts capture, then plays a known 440 Hz WAV in the tab and
# asserts >= 90 % of the clip's 16 kHz samples reach the offscreen recognizer hook, the null-sink monitor (parec) hears
# the tone for >= 90 % of the clip played after capture started (it does not record across the capture start on an
# already-playing tab), and the action badge reads ON while capturing and clears on stop.
# The `ci` `test` job runs the same test without PulseAudio; this job adds the speaker check. Not a merge gate.
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/extension-capture.yml
      - web/extension/capture/**
      - tests/test_extension_capture_1159.py
      - tests/conftest.py
      - pyproject.toml
  push:
    branches: [dev]
    paths:
      - .github/workflows/extension-capture.yml
      - web/extension/capture/**
      - tests/test_extension_capture_1159.py
      - tests/conftest.py
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  TLWU_NO_UPDATE: "1"
  PYTHONUTF8: "1"

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: System libraries (PulseAudio server + parec, Xvfb)
        timeout-minutes: 8
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for i in 1 2 3; do
            sudo apt-get $APT update && sudo apt-get $APT install -y --no-install-recommends libsndfile1 libpulse0 pulseaudio pulseaudio-utils xvfb && exit 0
            sleep 15
          done
          exit 1
      - name: Install tlwu (tests/conftest.py imports it) + Playwright Chromium
        run: |
          pip install -e ".[dev]" "pytest-timeout==2.3.1" "playwright==1.63.0"
          python -m playwright install chromium
      - name: Chromium system libraries (apt, retried)
        timeout-minutes: 10
        run: |
          for i in 1 2 3; do python -m playwright install-deps chromium && exit 0; sleep 15; done
          exit 1
      - name: PulseAudio with a null sink (speakers) whose monitor is what the user hears
        run: |
          pulseaudio -D --exit-idle-time=-1
          for i in $(seq 20); do pactl info >/dev/null 2>&1 && break; sleep 0.5; done
          pactl load-module module-null-sink sink_name=tlwu_speaker sink_properties=device.description=tlwu-Speaker
          pactl set-default-sink tlwu_speaker
          pactl list short sources
      - name: Tab capture, recognizer frames, speaker monitor, badge (#1159)
        env:
          TLWU_REQUIRE_EXTENSION: "1"
          TLWU_PULSE_MONITOR: tlwu_speaker.monitor
        run: xvfb-run -a -s "-screen 0 1280x800x24" python -m pytest -q --timeout=120 tests/test_extension_capture_1159.py
