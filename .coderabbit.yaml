# CodeRabbit: first-pass automated review. Cold Opus review remains the merge gate.
language: zh-TW
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - dev
      - main
chat:
  auto_reply: true
