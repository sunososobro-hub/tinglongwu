name: mobile
description: "tinglongWu mobile: offline live ru->zh-Hant subtitles (prototype)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  record: 7.1.2
  sherpa_onnx: 2.0.1
  llama_cpp_dart:
    git:
      url: https://github.com/netdur/llama_cpp_dart
      ref: 23dae0bd696db6378c6869ed930ece4f58c7a4b9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    llama_cpp_dart:
      # Self-built libllama.so (see tool/build_llama_android.ps1); NOT the upstream prebuilt AAR.
      android_aar: native/llama-cpp-dart-selfbuilt.aar

flutter:
  uses-material-design: true
  assets:
    - assets/models_manifest.json
